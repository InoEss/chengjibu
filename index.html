<noscript><div style="padding:24px;font-family:sans-serif;font-size:15px;line-height:1.7">成绩簿需要启用 JavaScript 才能运行。所有数据仍然只保存在本机，不会上传。</div></noscript>
<script>
/* ============================================================
   成绩簿 · 省份高考模式 + 本地规则
   数据全部随文件内置，运行时不访问网络
   ============================================================ */

var VERSION = 1;
var STORE_KEY = 'chengjibu.data.v1';
var GRADES = ['高一', '高二', '高三'];
var TYPES = ['周测', '月考', '期中', '期末', '联考', '其他'];

var SUB_ABBR = { '语文': '语', '数学': '数', '外语': '外', '物理': '物', '历史': '史', '化学': '化', '生物': '生', '政治': '政', '地理': '地', '技术': '技' };
var ABBR_SUB = { '语': '语文', '数': '数学', '外': '外语', '物': '物理', '史': '历史', '化': '化学', '生': '生物', '政': '政治', '地': '地理', '技': '技术' };

var SUBJECT_VARS = {
  '语文': '--s1', '数学': '--s2', '外语': '--s3',
  '物理': '--s4', '化学': '--s5', '生物': '--s6',
  '政治': '--s7', '历史': '--s8', '地理': '--s9', '技术': '--s4'
};
function subjectColorVar(name) {
  return 'var(' + (SUBJECT_VARS[name] || '--blue') + ')';
}

var CORE3 = [['语文', 150], ['数学', 150], ['外语', 150]];
var SECOND4 = [['化学', 100], ['生物', 100], ['政治', 100], ['地理', 100]];
var NINE = ['物理', '化学', '生物', '政治', '历史', '地理'];

var P312_NAMES = [
  '河北', '辽宁', '江苏', '福建', '湖北', '湖南', '广东', '重庆',
  '甘肃', '吉林', '黑龙江', '安徽', '江西', '贵州', '广西',
  '山西', '内蒙古', '河南', '四川', '云南', '陕西', '青海', '宁夏'
];

var P33_INFO = {
  '上海': { total: 660, electFull: 70, tech: false, note: '语数外各 150；3 门选考等级赋分各 70，本科总分 660。' },
  '浙江': { total: 750, electFull: 100, tech: true, note: '语数外各 150；7 选 3（含技术）等级赋分各 100，起点赋分 40。' },
  '北京': { total: 750, electFull: 100, tech: false, note: '语数外各 150；6 选 3 等级赋分各 100。' },
  '天津': { total: 750, electFull: 100, tech: false, note: '语数外各 150；6 选 3 等级赋分各 100。' },
  '山东': { total: 750, electFull: 100, tech: false, note: '语数外各 150；6 选 3 等级赋分各 100。' },
  '海南': { total: 900, electFull: 150, tech: false, note: '成绩以标准分公布，总分 900；语数外各 150，3 门选考各 150（标准分）。' }
};

var PROVINCE_ORDER = [
  '北京', '天津', '河北', '山西', '内蒙古', '辽宁', '吉林', '黑龙江',
  '上海', '江苏', '浙江', '安徽', '福建', '江西', '山东', '河南',
  '湖北', '湖南', '广东', '广西', '海南', '重庆', '四川', '贵州',
  '云南', '西藏', '陕西', '甘肃', '青海', '宁夏', '新疆'
];

var PROVINCES = (function () {
  var map = {};
  PROVINCE_ORDER.forEach(function (name) {
    if (P312_NAMES.indexOf(name) >= 0) {
      map[name] = {
        name: name, mode: '3+1+2', total: 750,
        core: CORE3,
        first: [['物理', 100], ['历史', 100]],
        second: SECOND4,
        note: '语数外各 150；首选科目原始分 100；再选 2 科等级赋分各 100。'
      };
      return;
    }
    if (P33_INFO[name]) {
      var info = P33_INFO[name];
      var elect = [['物理', info.electFull], ['化学', info.electFull], ['生物', info.electFull], ['政治', info.electFull], ['历史', info.electFull], ['地理', info.electFull]];
      if (info.tech) elect.push(['技术', info.electFull]);
      map[name] = {
        name: name, mode: '3+3', total: info.total,
        core: CORE3, elect: elect,
        note: info.note
      };
      return;
    }
    map[name] = {
      name: name, mode: '传统', total: 750,
      core: CORE3,
      tracks: {
        '文科': [['政治', 100], ['历史', 100], ['地理', 100]],
        '理科': [['物理', 110], ['化学', 100], ['生物', 90]]
      },
      note: '文理分科；语数外各 150，文综 / 理综 300（应用内按单科录入）。'
    };
  });
  return map;
})();

function provinceOf(name) {
  return PROVINCES[name] || PROVINCES['甘肃'];
}

function gradeIndex(g) {
  return GRADES.indexOf(g) >= 0 ? GRADES.indexOf(g) : 0;
}

/* ---------- 科目组合 ---------- */
function subjectFullForNine(p, name) {
  if (p.mode === '3+3') {
    for (var i = 0; i < p.elect.length; i++) if (p.elect[i][0] === name) return p.elect[i][1];
  }
  return 100;
}

function comboDefs(p, combo) {
  var core = p.core.map(function (x) { return { name: x[0], full: x[1], graded: false, role: 'core' }; });

  if (combo === '九科') {
    var nine = NINE.map(function (n) {
      var graded = false;
      if (p.mode === '3+1+2') graded = (n === '化学' || n === '生物' || n === '政治' || n === '地理');
      if (p.mode === '3+3') graded = true;
      return { name: n, full: subjectFullForNine(p, n), graded: graded, role: 'nine' };
    });
    return core.concat(nine);
  }

  if (p.mode === '传统') {
    var track = combo === '文科' ? '文科' : '理科';
    return core.concat(p.tracks[track].map(function (x) {
      return { name: x[0], full: x[1], graded: false, role: track };
    }));
  }

  var names = parseCombo(combo);
  if (p.mode === '3+1+2') {
    names.forEach(function (n) {
      if (n === '物理' || n === '历史') {
        var f = 100;
        p.first.forEach(function (x) { if (x[0] === n) f = x[1]; });
        core.push({ name: n, full: f, graded: false, role: 'first' });
      } else {
        var f2 = 100;
        p.second.forEach(function (x) { if (x[0] === n) f2 = x[1]; });
        core.push({ name: n, full: f2, graded: true, role: 'second' });
      }
    });
    return core;
  }

  if (p.mode === '3+3') {
    names.forEach(function (n) {
      var f = 100;
      p.elect.forEach(function (x) { if (x[0] === n) f = x[1]; });
      core.push({ name: n, full: f, graded: true, role: 'elect' });
    });
    return core;
  }
  return core;
}

function parseCombo(combo) {
  if (!combo || combo === '九科' || combo === '文科' || combo === '理科') return [];
  return Array.from(combo).map(function (c) { return ABBR_SUB[c]; }).filter(Boolean);
}

function comboFromNames(names) {
  return names.map(function (n) { return SUB_ABBR[n] || ''; }).join('');
}

function comboLabel(combo) {
  if (combo === '九科') return '九科全录';
  return combo;
}

function defaultCombo(p, grade) {
  if (grade === '高一') return '九科';
  if (p.mode === '3+1+2') return '物化生';
  if (p.mode === '3+3') return '物化生';
  return '理科';
}

function comboIsValid(p, combo, grade) {
  if (!combo) return false;
  if (combo === '九科') return true;
  if (p.mode === '传统') return combo === '文科' || combo === '理科';
  var names = parseCombo(combo);
  if (p.mode === '3+1+2') {
    if (names.length !== 3) return false;
    if (names.indexOf('物理') < 0 && names.indexOf('历史') < 0) return false;
    return names.every(function (n) { return n === '物理' || n === '历史' || ['化学', '生物', '政治', '地理'].indexOf(n) >= 0; });
  }
  if (names.length !== 3) return false;
  return names.every(function (n) {
    return p.elect.some(function (x) { return x[0] === n; });
  });
}

/* ---------- 目标 ---------- */
function defaultTargetTotal(p) {
  return Math.round(p.total * 0.85 / 5) * 5;
}

function recalcTarget(data) {
  var p = provinceOf(data.profile.province);
  var total = Math.max(1, Math.min(p.total, Number(data.target.total) || defaultTargetTotal(p)));
  data.target.total = Math.round(total);
  data.target.rate = total / p.total;
  var defs = comboDefs(p, data.profile.combo);
  var per = {};
  defs.forEach(function (s) { per[s.name] = Math.round(data.target.rate * s.full); });
  data.target.perSubject = per;
  return data;
}

function subjectTarget(rate, full) {
  return Math.round(rate * full);
}

/* ---------- 成绩计算 ---------- */
function effScore(sub, basis) {
  if (sub.graded) {
    if (basis === 'raw') return sub.raw == null ? null : Number(sub.raw);
    return (sub.gradedScore != null ? Number(sub.gradedScore) : (sub.raw == null ? null : Number(sub.raw)));
  }
  return sub.raw == null ? null : Number(sub.raw);
}

function calcExam(exam, basis, targetRate) {
  var total = 0, base = 0, full = 0, filled = 0, missing = 0, met = 0;
  var rows = exam.subjects.map(function (s) {
    var value = effScore(s, basis);
    var t = subjectTarget(targetRate, s.full);
    full += s.full;
    if (value != null) {
      total += value;
      base += s.full;
      filled++;
      if (value >= t) met++;
    } else {
      missing++;
    }
    return {
      name: s.name, full: s.full, graded: !!s.graded, raw: s.raw, gradedScore: s.gradedScore,
      value: value, target: t,
      gap: value == null ? null : t - value,
      rate: value == null ? null : value / s.full,
      met: value == null ? false : value >= t
    };
  });
  var rate = base ? total / base : 0;
  var targetPts = targetRate * base;
  return {
    total: total, base: base, full: full, filled: filled, missing: missing,
    complete: missing === 0, rate: rate,
    targetPts: targetPts,
    gap: targetPts - total,
    met: met,
    rows: rows,
    gradedCount: exam.subjects.filter(function (s) { return s.graded; }).length
  };
}

function examPercentile(rank, size) {
  if (!rank || !size) return null;
  return Math.min(1, Math.max(0, rank / size));
}

function latestExam(data) {
  if (!data.exams.length) return null;
  return data.exams.slice().sort(function (a, b) {
    return (b.date || '').localeCompare(a.date || '') || String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
  })[0];
}

function sortedExams(data, dir) {
  return data.exams.slice().sort(function (a, b) {
    if (dir === 'desc') return (b.date || '').localeCompare(a.date || '');
    return (a.date || '').localeCompare(b.date || '');
  });
}

function scopeExams(data, filter) {
  var list = data.exams.slice();
  if (filter.grade !== 'all') {
    var g = filter.grade === 'current' ? data.profile.grade : filter.grade;
    list = list.filter(function (e) { return e.grade === g; });
  }
  if (filter.type && filter.type !== 'all') {
    list = list.filter(function (e) { return e.type === filter.type; });
  }
  return list.sort(function (a, b) {
    return (a.date || '').localeCompare(b.date || '') || String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
  });
}

/* ---------- 本地规则结论 ---------- */
var SUBJECT_TIPS = {
  '语文': '默写、文言实词和选择题先守住稳定分，每周限时练一篇作文。',
  '数学': '把最近三场的错题按题型重做一遍，选填每天限时练一组。',
  '外语': '每天两篇限时阅读，先把长难句和生词处理成固定动作。',
  '物理': '按模型归类错题，先保受力分析和基础计算不丢分。',
  '历史': '用时间线整理阶段特征，材料题先练提取信息的步骤。',
  '化学': '方程式、实验操作和计算分块过一遍，先保基础题。',
  '生物': '回归教材概念，把图表题和实验设计各练两道。',
  '政治': '按模块搭答题框架，材料题先练「材料—原理—结论」。',
  '地理': '自然地理先补原理，人文地理练材料信息的提取。',
  '技术': '先把操作题步骤写完整，再练选择题的速度。'
};

function buildInsight(exams, basis, targetRate) {
  var map = {};
  exams.forEach(function (e) {
    e.subjects.forEach(function (s) {
      var v = effScore(s, basis);
      if (v == null) return;
      if (!map[s.name]) map[s.name] = { name: s.name, full: s.full, graded: !!s.graded, series: [] };
      map[s.name].full = s.full;
      map[s.name].series.push({
        date: e.date, exam: e, score: v,
        target: subjectTarget(targetRate, s.full),
        rate: v / s.full,
        met: v >= subjectTarget(targetRate, s.full)
      });
    });
  });

  var subs = Object.keys(map).map(function (k) {
    var m = map[k];
    m.series.sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (!m.series.length) return null;
    var n = m.series.length;
    var metCount = 0, sumRate = 0, sumScore = 0;
    m.series.forEach(function (p) { if (p.met) metCount++; sumRate += p.rate; sumScore += p.score; });
    var avgRate = sumRate / n;
    var avgScore = sumScore / n;
    var variance = 0;
    m.series.forEach(function (p) { variance += Math.pow(p.score - avgScore, 2); });
    var std = Math.sqrt(variance / n);
    var latest = m.series[n - 1];
    var consecutive = 0;
    for (var i = n - 1; i >= 0; i--) {
      if (m.series[i].met) break;
      consecutive++;
    }
    var prev = n > 1 ? m.series[n - 2].score : null;
    return {
      name: m.name, full: m.full, graded: m.graded, n: n,
      series: m.series,
      latest: latest,
      latestScore: latest.score,
      latestRate: latest.rate,
      target: latest.target,
      gap: latest.target - latest.score,
      gapRate: targetRate - latest.rate,
      consecutive: consecutive,
      metCount: metCount,
      metRate: metCount / n,
      avgRate: avgRate,
      std: std,
      trend: prev == null ? 0 : latest.score - prev
    };
  }).filter(Boolean);

  var priority = subs.filter(function (s) {
    return s.latest && s.gapRate > 0.004 && (s.consecutive >= 2 || s.gap >= 4);
  }).sort(function (a, b) {
    return b.gapRate - a.gapRate || b.consecutive - a.consecutive;
  }).slice(0, 3);

  var keep = subs.filter(function (s) {
    return s.latest.met && s.n >= 1 && s.metRate >= 0.6;
  }).sort(function (a, b) {
    return b.metRate - a.metRate || a.std - b.std;
  }).slice(0, 3);

  priority.forEach(function (s) {
    var tip = SUBJECT_TIPS[s.name] || '先找出最近三场重复失分的题型，集中练一组。';
    if (s.consecutive >= 3) {
      s.advice = '已连续 ' + s.consecutive + ' 场低于目标，' + tip;
    } else if (s.gapRate >= 0.12) {
      s.advice = '与目标差距较大，' + tip;
    } else if (s.trend < 0) {
      s.advice = '最近一场还在下行，' + tip;
    } else {
      s.advice = '离目标最近，优先补这一科最划算：' + tip;
    }
  });

  keep.forEach(function (s) {
    if (s.metRate === 1) {
      s.keepNote = s.n + ' 场全部达标';
    } else {
      s.keepNote = '达标率 ' + Math.round(s.metRate * 100) + '%';
    }
  });

  return { subs: subs, priority: priority, keep: keep };
}

/* ---------- 日期 ---------- */
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function dateParts(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return null;
  var y = +m[1], mo = +m[2], da = +m[3];
  var d = new Date(y, mo - 1, da);
  if (d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== da) return null;
  return { y: y, m: mo, d: da, date: d };
}

function fmtDateShort(s) {
  var p = dateParts(s);
  return p ? (p.m + '.' + p.d) : '—';
}

function fmtDateCN(s) {
  var p = dateParts(s);
  return p ? (p.m + '月' + p.d + '日') : '—';
}

function weekdayCN(s) {
  var p = dateParts(s);
  if (!p) return '';
  return '周' + '日一二三四五六'[p.date.getDay()];
}

function fmtDT(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/* ---------- 数字格式 ---------- */
function fmtScore(n) {
  if (n == null || isNaN(n)) return '—';
  var v = Math.round(n * 10) / 10;
  return (v % 1 === 0) ? String(v) : v.toFixed(1);
}

function fmtPct(x, digits) {
  if (x == null || isNaN(x)) return '—';
  return (x * 100).toFixed(digits == null ? 1 : digits) + '%';
}

function fmtGap(n) {
  if (n == null || isNaN(n)) return '—';
  var v = Math.round(n * 10) / 10;
  if (v === 0) return '0';
  return (v > 0 ? '+' : '−') + fmtScore(Math.abs(v));
}

function uid() {
  return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

/* ---------- 备份格式 ---------- */
function makeBackup(data) {
  var exams = sortedExams(data, 'asc');
  return {
    app: '成绩簿',
    format: 'chengjibu-backup',
    version: VERSION,

      to: exams.length ? exams[exams.length - 1].date : null,
      province: data.profile.province,
      grade: data.profile.grade,
      combo: data.profile.combo,
      target: data.target.total
    },
    data: data
  };
}

function validateBackup(obj) {
  var errors = [];
  var warnings = [];
  if (!obj || typeof obj !== 'object') {
    return { errors: ['文件内容不是 JSON 对象'], warnings: [], summary: null, data: null };
  }
  if (obj.format !== 'chengjibu-backup') {
    errors.push('不是成绩簿的备份文件（缺少 format: chengjibu-backup）');
  }
  if (!obj.version) {
    errors.push('备份缺少版本信息');
  } else if (Number(obj.version) > VERSION) {
    errors.push('备份版本高于当前应用支持的版本');
  }
  var d = obj.data;
  if (!d || typeof d !== 'object') {
    errors.push('文件缺少成绩数据（data）');
    return { errors: errors, warnings: warnings, summary: null, data: null };
  }
  if (!d.profile || typeof d.profile !== 'object') errors.push('缺少 profile 设置');
  if (!d.target || typeof d.target !== 'object') errors.push('缺少 target 目标');
  if (!Array.isArray(d.exams)) errors.push('exams 不是数组');

  if (d.profile) {
    if (GRADES.indexOf(d.profile.grade) < 0) warnings.push('年级字段异常，已回退为「高一」');
    if (!PROVINCES[d.profile.province]) warnings.push('省份「' + d.profile.province + '」不在内置名单，将按甘肃口径展示');
    if (!d.profile.combo) warnings.push('科目组合缺失，已回退为当前年级默认组合');
  }

  var exams = Array.isArray(d.exams) ? d.exams : [];
  var incomplete = 0, ranked = 0, withGraded = 0;
  var from = null, to = null;
  var checked = 0;

  exams.forEach(function (e, i) {
    var tag = '第 ' + (i + 1) + ' 场';
    if (!e || typeof e !== 'object') { errors.push(tag + '不是对象'); return; }
    if (!dateParts(e.date)) errors.push(tag + '的日期无效');
    else {
      if (!from || e.date < from) from = e.date;
      if (!to || e.date > to) to = e.date;
      if (e.date > todayStr()) warnings.push(tag + '日期在未来（' + e.date + '）');
    }
    if (!e.name || typeof e.name !== 'string') errors.push(tag + '缺少考试名称');
    if (!Array.isArray(e.subjects) || !e.subjects.length) { errors.push(tag + '缺少科目成绩'); return; }
    checked++;
    var miss = 0;
    var hasRank = !!(e.rank && (e.rank['class'] || e.rank.grade));
    if (hasRank) ranked++;
    var hasGraded = false;
    e.subjects.forEach(function (s) {
      if (!s || typeof s !== 'object' || typeof s.name !== 'string' || !isFinite(Number(s.full)) || Number(s.full) <= 0) {
        errors.push(tag + '的科目结构不完整');
        return;
      }
      if (s.raw == null) miss++;
      else if (!isFinite(Number(s.raw))) errors.push(tag + '「' + s.name + '」分数不是数字');
      else if (Number(s.raw) > Number(s.full) + 0.01) warnings.push(tag + '「' + s.name + '」分数超过满分，已保留原值');
      if (s.graded) {
        hasGraded = true;
        if (s.gradedScore != null && (!isFinite(Number(s.gradedScore)) || Number(s.gradedScore) > Number(s.full) + 0.01)) {
          warnings.push(tag + '「' + s.name + '」赋分超过满分，已保留原值');
        }
      }
    });
    if (miss > 0) incomplete++;
    if (hasGraded) withGraded++;
    if (!hasRank && e.type !== '周测') warnings.push(tag + '没有排名');
  });

  var summary = {
    exams: exams.length,
    checked: checked,
    from: from, to: to,
    province: d.profile ? d.profile.province : '—',
    grade: d.profile ? d.profile.grade : '—',
    combo: d.profile ? comboLabel(d.profile.combo) : '—',
    target: d.target ? d.target.total : '—',
    incomplete: incomplete,
    ranked: ranked,
    withGraded: withGraded,
    exportedAt: obj.exportedAt || null,
    source: (obj.data && obj.data.profile) ? obj.data.profile.province : '—'
  };

  return { errors: errors, warnings: warnings, summary: summary, data: d };
}

function normalizeImport(d) {
  var p = provinceOf(d.profile && d.profile.province);
  var out = {
    version: VERSION,
    profile: {
      grade: GRADES.indexOf(d.profile && d.profile.grade) >= 0 ? d.profile.grade : '高一',
      province: PROVINCES[d.profile && d.profile.province] ? d.profile.province : '甘肃',
      combo: (d.profile && comboIsValid(p, d.profile.combo, d.profile.grade)) ? d.profile.combo : defaultCombo(p, (d.profile && d.profile.grade) || '高一'),
      classSize: Math.max(1, Number(d.profile && d.profile.classSize) || 45),
      gradeSize: Math.max(1, Number(d.profile && d.profile.gradeSize) || 720),
      theme: (d.profile && d.profile.theme === 'dark') ? 'dark' : 'light'
    },
    target: {
      total: Math.max(1, Number(d.target && d.target.total) || defaultTargetTotal(p)),
      rate: 0, perSubject: {}
    },
    exams: (d.exams || []).map(function (e) {
      var subs = (e.subjects || []).map(function (s) {
        var sub = {
          name: s.name,
          full: Number(s.full) || 100,
          graded: !!s.graded,
          raw: s.raw == null ? null : Number(s.raw)
        };
        if (sub.graded) sub.gradedScore = s.gradedScore == null ? null : Number(s.gradedScore);
        return sub;
      });
      return {
        id: e.id || uid(),
        name: e.name || (fmtDateCN(e.date) + '考试'),
        date: e.date,
        type: TYPES.indexOf(e.type) >= 0 ? e.type : (e.type || '其他'),
        grade: GRADES.indexOf(e.grade) >= 0 ? e.grade : out.profile.grade,
        province: PROVINCES[e.province] ? e.province : out.profile.province,
        combo: e.combo || out.profile.combo,
        subjects: subs,
        rank: {
          'class': e.rank && e.rank['class'] != null ? Number(e.rank['class']) : null,
          classSize: e.rank && e.rank.classSize != null ? Number(e.rank.classSize) : out.profile.classSize,
          grade: e.rank && e.rank.grade != null ? Number(e.rank.grade) : null,
          gradeSize: e.rank && e.rank.gradeSize != null ? Number(e.rank.gradeSize) : out.profile.gradeSize
        },
        note: typeof e.note === 'string' ? e.note : '',
        createdAt: e.createdAt || new Date().toISOString(),
        updatedAt: e.updatedAt || e.createdAt || new Date().toISOString()
      };
    }),
    createdAt: d.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  recalcTarget(out);
  return out;
}

/* ---------- 演示数据（本地生成，可随时删除） ---------- */
function makeDemoData(profile, targetRate) {
  var p = provinceOf(profile.province);
  var gradeIdx = gradeIndex(profile.grade);
  var today = todayStr();
  var d = new Date();
  var curStartYear = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;

  var offsets = [
    ['09-08', '周测'], ['09-18', '月考'], ['09-30', '周测'], ['10-16', '周测'], ['10-30', '月考'], ['11-12', '期中'],
    ['12-20', '月考'], ['01-18', '期末'], ['03-15', '周测'], ['04-22', '月考'], ['05-28', '期中'], ['07-05', '期末']
  ];

  var bias = {
    '语文': -0.02, '数学': 0.055, '外语': -0.125, '物理': -0.035,
    '历史': 0.005, '化学': -0.055, '生物': 0.02, '政治': -0.06, '地理': -0.005, '技术': 0
  };

  var plan = [];
  for (var gi = 0; gi <= gradeIdx; gi++) {
    var startYear = curStartYear - (gradeIdx - gi);
    var grade = GRADES[gi];
    offsets.forEach(function (o) {
      var y = startYear + (o[0].slice(0, 2) === '01' || o[0].slice(0, 2) === '03' || o[0].slice(0, 2) === '04' || o[0].slice(0, 2) === '05' || o[0].slice(0, 2) === '07' ? 1 : 0);
      var date = y + '-' + o[0];
      if (date > today) return;
      plan.push({ date: date, type: o[1], grade: grade, year: gi });
    });
  }

  plan.sort(function (a, b) { return a.date.localeCompare(b.date); });

  var exams = plan.map(function (item, idx) {
    var t = plan.length > 1 ? idx / (plan.length - 1) : 1;
    var combo = item.grade === '高一' ? '九科' : profile.combo;
    var defs = comboDefs(p, combo);
    var trend = -0.06 + 0.075 * t;
    var subjects = defs.map(function (s, si) {
      var noise = Math.sin((idx + 1) * 7.3 + si * 2.1) * 0.021;
      var rate = Math.max(0.35, Math.min(0.985, targetRate + trend + (bias[s.name] || 0) + noise));
      var score = Math.round(rate * s.full);
      if (score < 0) score = 0;
      if (score > s.full) score = s.full;
      var sub = { name: s.name, full: s.full, graded: s.graded, raw: null };
      if (s.graded) {
        var raw = Math.round(score - 2 - (si % 3));
        sub.raw = Math.max(0, Math.min(s.full, raw));
        sub.gradedScore = score;
      } else {
        sub.raw = score;
      }
      return sub;
    });

    var total = subjects.reduce(function (acc, s) { return acc + (s.graded ? (s.gradedScore == null ? s.raw : s.gradedScore) : s.raw); }, 0);
    var base = subjects.reduce(function (acc, s) { return acc + s.full; }, 0);
    var rate = total / base;
    var percentile = Math.max(0.03, Math.min(0.95, 1 - (rate - 0.5) / 0.42));
    var cls = Math.max(1, Math.round(percentile * (profile.classSize || 45)));
    var grd = Math.max(1, Math.round(percentile * (profile.gradeSize || 720) * 0.92));
    var hasRank = item.type !== '周测';

    var notes = ['', '', '数学最后一题没做完', '', '外语听力失分多', '', '物理计算题粗心', '', '状态一般', '', '', '', ''];
    var name = fmtDateCN(item.date);

    return {
      id: 'demo-' + (idx + 1),
      name: name,
      date: item.date,
      type: item.type,
      grade: item.grade,
      province: profile.province,
      combo: combo,
      subjects: subjects,
      rank: {
        'class': hasRank ? cls : null,
        classSize: profile.classSize || 45,
        grade: hasRank ? grd : null,
        gradeSize: profile.gradeSize || 720
      },
      note: notes[idx % notes.length] || '',
      createdAt: item.date + 'T12:00:00.000Z',
      updatedAt: item.date + 'T12:00:00.000Z'
    };
  });

  var data = makeDefaultData();
  data.profile.grade = profile.grade;
  data.profile.province = profile.province;
  data.profile.combo = profile.combo;
  data.profile.classSize = profile.classSize;
  data.profile.gradeSize = profile.gradeSize;
  data.profile.theme = profile.theme;
  data.target.total = Math.round(targetRate * p.total);
  data.exams = exams;
  recalcTarget(data);
  return data;
}

/* ============================================================
   图表：手绘 SVG（离线，无第三方库）
   折线 / 柱状 / 名次（纵轴反转）/ 迷你趋势
   ============================================================ */

function escC(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function chartFrame(el, h, padOpt) {
  var W = Math.max(280, Math.floor(el.clientWidth || (el.parentNode ? el.parentNode.clientWidth : 340) || 340));
  var p = padOpt || { l: 38, r: 46, t: 30, b: 32 };
  return { W: W, H: h, p: p, pw: W - p.l - p.r, ph: h - p.t - p.b };
}

function xAt(i, n, f) {
  if (n <= 1) return f.p.l + f.pw / 2;
  return f.p.l + (i / (n - 1)) * f.pw;
}

function yAt(v, lo, hi, f) {
  if (hi === lo) return f.p.t + f.ph / 2;
  return f.p.t + ((hi - v) / (hi - lo)) * f.ph;
}

/* 单调三次曲线：平滑但不越过数据点，避免分数曲线出现假的峰谷 */
function smoothPath(pts) {
  if (!pts.length) return '';
  if (pts.length === 1) return 'M' + pts[0].x + ' ' + pts[0].y;
  if (pts.length === 2) return 'M' + pts[0].x + ' ' + pts[0].y + ' L' + pts[1].x + ' ' + pts[1].y;
  var n = pts.length, dx = [], delta = [], m = [];
  for (var i = 1; i < n; i++) {
    dx[i] = pts[i].x - pts[i - 1].x;
    delta[i] = dx[i] ? (pts[i].y - pts[i - 1].y) / dx[i] : 0;
  }
  m[0] = delta[1];
  m[n - 1] = delta[n - 1];
  for (i = 1; i < n - 1; i++) {
    if (delta[i] * delta[i + 1] <= 0) m[i] = 0;
    else {
      var w1 = 2 * dx[i + 1] + dx[i];
      var w2 = dx[i + 1] + 2 * dx[i];
      m[i] = (w1 + w2) / (w1 / delta[i] + w2 / delta[i + 1]);
    }
  }
  var d = 'M' + pts[0].x + ' ' + pts[0].y;
  for (i = 0; i < n - 1; i++) {
    var h = dx[i + 1];
    d += ' C' + (pts[i].x + h / 3) + ' ' + (pts[i].y + m[i] * h / 3) +
      ' ' + (pts[i + 1].x - h / 3) + ' ' + (pts[i + 1].y - m[i + 1] * h / 3) +
      ' ' + pts[i + 1].x + ' ' + pts[i + 1].y;
  }
  return d;
}

function niceRange(values, extra) {
  var lo = Math.min.apply(null, values);
  var hi = Math.max.apply(null, values);
  if (extra != null) { lo = Math.min(lo, extra); hi = Math.max(hi, extra); }
  var span = hi - lo;
  if (span < 10) span = 10;
  lo = Math.floor((lo - span * 0.09) / 10) * 10;
  hi = Math.ceil((hi + span * 0.09) / 10) * 10;
  if (hi <= lo) hi = lo + 10;
  return { lo: lo, hi: hi };
}

function xLabels(n, pw) {
  var maxN = Math.max(2, Math.min(6, Math.floor(pw / 54)));
  if (n <= maxN) {
    var all = [];
    for (var i = 0; i < n; i++) all.push(i);
    return all;
  }
  var res = [];
  for (var k = 0; k < maxN; k++) res.push(Math.round(k * (n - 1) / (maxN - 1)));
  var uniq = [];
  res.forEach(function (v) { if (uniq.indexOf(v) < 0) uniq.push(v); });
  return uniq;
}

function svgHead(f, label) {
  return '<svg viewBox="0 0 ' + f.W + ' ' + f.H + '" width="' + f.W + '" height="' + f.H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + escC(label) + '">';
}

/* ---------- 提示层 ---------- */
function bindTip(el, items) {
  var tip = el.querySelector('.chart-tip');
  var cross = el.querySelector('.chart-cross');
  var focus = el.querySelector('.chart-focus');
  if (!tip || !cross) return;
  var pressed = false;
  var focusIdx = -1;

  function paint(i) {
    var it = items[i];
    if (!it) return;
    cross.style.left = it.x + 'px';
    if (focus) { focus.style.left = it.x + 'px'; focus.style.top = (it.y == null ? 0 : it.y) + 'px'; }
    tip.innerHTML = it.html;
    tip.classList.add('on');
    el.classList.add('on');
    var tw = tip.offsetWidth || 120;
    var left = Math.max(tw / 2 + 3, Math.min(el.clientWidth - tw / 2 - 3, it.x));
    tip.style.left = left + 'px';
  }

  function hide() {
    tip.classList.remove('on');
    el.classList.remove('on');
  }

  function nearest(clientX) {
    var r = el.getBoundingClientRect();
    var x = clientX - r.left;
    var best = 0, bd = Infinity;
    items.forEach(function (it, i) {
      var d = Math.abs(it.x - x);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }

  el.addEventListener('pointerdown', function (e) {
    if (!items.length) return;
    pressed = true;
    paint(nearest(e.clientX));
  });
  el.addEventListener('pointermove', function (e) {
    if (!items.length) return;
    if (e.pointerType === 'mouse' || pressed) paint(nearest(e.clientX));
  });
  el.addEventListener('pointerup', function () {
    if (pressed) {
      pressed = false;
      window.setTimeout(hide, 120);
    }
  });
  el.addEventListener('pointercancel', function () { pressed = false; hide(); });
  el.addEventListener('pointerleave', function () {
    if (!pressed) hide();
  });
  el.addEventListener('focus', function () {
    if (!items.length) return;
    focusIdx = 0;
    paint(focusIdx);
  });
  el.addEventListener('blur', function () {
    focusIdx = -1;
    hide();
  });
  el.addEventListener('keydown', function (e) {
    if (!items.length) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      focusIdx = focusIdx < 0 ? 0 : focusIdx;
      focusIdx = (focusIdx + (e.key === 'ArrowRight' ? 1 : -1) + items.length) % items.length;
      paint(focusIdx);
    }
    if (e.key === 'Escape') hide();
  });
}

function mountChart(el, svg, items, label) {
  el.innerHTML = svg + '<div class="chart-cross"></div><div class="chart-focus"></div><div class="chart-tip"></div>';
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', label);
  bindTip(el, items);
}

/* ---------- 总分趋势 ---------- */
function drawTotalChart(el, exams, basis, targetRate, targetTotal, provinceTotal) {
  if (!exams.length) return;
  var f = chartFrame(el, 236);
  var pts = exams.map(function (e) {
    var c = calcExam(e, basis, targetRate);
    return {
      exam: e, c: c,
      plot: c.rate * provinceTotal,
      actual: c.total
    };
  });
  var values = pts.map(function (p) { return p.plot; });
  var r = niceRange(values, targetTotal);
  var ticks = [r.lo, Math.round((r.lo + r.hi) / 2), r.hi].filter(function (v, i, a) { return a.indexOf(v) === i; });

  var s = svgHead(f, '总分趋势图，' + pts.length + ' 场考试');
  ticks.forEach(function (v) {
    var y = yAt(v, r.lo, r.hi, f);
    s += '<line class="c-grid" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + y + '" y2="' + y + '"/>';
    s += '<text class="c-axis" x="' + (f.p.l - 7) + '" y="' + (y + 3.5) + '" text-anchor="end">' + v + '</text>';
  });

  var yT = yAt(targetTotal, r.lo, r.hi, f);
  s += '<line class="c-target" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + yT + '" y2="' + yT + '"/>';
  var tLabelY = yT + 14 > f.H - 6 ? yT - 7 : yT + 14;
  s += '<text class="c-target-label" x="' + (f.p.l + 3) + '" y="' + tLabelY + '" text-anchor="start">目标 ' + targetTotal + '</text>';

  pts.forEach(function (p, i) {
    p.x = xAt(i, pts.length, f);
    p.y = yAt(p.plot, r.lo, r.hi, f);
  });
  var linePath = smoothPath(pts);
  s += '<path class="c-glow" d="' + linePath + '" pathLength="100"/>';
  s += '<path class="c-line" d="' + linePath + '" pathLength="100"/>';

  pts.forEach(function (p, i) {
    var cls = 'c-dot';
    if (!p.c.complete) cls = 'c-dot-open';
    if (i === pts.length - 1) cls = 'c-dot-last';
    if (i === pts.length - 1) s += '<circle class="c-halo" cx="' + p.x + '" cy="' + p.y + '" r="10"/>';
    s += '<circle class="' + cls + '" cx="' + p.x + '" cy="' + p.y + '" r="' + (i === pts.length - 1 ? 4.2 : 3.1) + '" style="--i:' + i + '"/>';
  });

  var xIdx = xLabels(pts.length, f.pw);
  xIdx.forEach(function (i) {
    var x = xAt(i, pts.length, f);
    var anchor = 'middle';
    if (i === 0) anchor = 'start';
    if (i === pts.length - 1) anchor = 'end';
    s += '<text class="c-small" x="' + x + '" y="' + (f.H - 10) + '" text-anchor="' + anchor + '">' + fmtDateShort(pts[i].exam.date) + '</text>';
  });

  if (pts.length > 1) {
    var y0 = Math.max(f.p.t + 12, pts[0].y - 10);
    var yL = Math.max(f.p.t + 12, pts[pts.length - 1].y - 10);
    s += '<text class="c-value" x="' + (pts[0].x + 3) + '" y="' + y0 + '" text-anchor="start">' + fmtScore(Math.round(pts[0].plot)) + '</text>';
    s += '<text class="c-value" x="' + (pts[pts.length - 1].x - 3) + '" y="' + yL + '" text-anchor="end">' + fmtScore(Math.round(pts[pts.length - 1].plot)) + '</text>';
  } else {
    s += '<text class="c-value" x="' + pts[0].x + '" y="' + (pts[0].y - 12) + '" text-anchor="middle">' + fmtScore(Math.round(pts[0].plot)) + '</text>';
  }
  s += '</svg>';

  var items = pts.map(function (p, i) {
    var gap = targetTotal - p.plot;
    var meta = p.exam.name === fmtDateCN(p.exam.date) ? p.exam.type : fmtDateCN(p.exam.date) + ' · ' + p.exam.type;
    var lines = '<div class="ts">本场 ' + fmtScore(p.actual) + ' / ' + fmtScore(p.c.base) + '</div>';
    lines += '<div class="ts">目标 ' + targetTotal + ' · ' + (gap > 0.5 ? '差 ' + fmtScore(gap) + ' 分' : (gap < -0.5 ? '超 ' + fmtScore(Math.abs(gap)) + ' 分' : '正好达标')) + (Math.abs(p.c.base - provinceTotal) > 0.5 ? '（按折合分）' : '') + '</div>';
    lines += '<div class="ts">得分率 ' + fmtPct(p.c.rate) + (p.c.missing ? ' · 不完整 已录 ' + p.c.filled + '/' + (p.c.filled + p.c.missing) + ' 科' : '') + '</div>';
    return {
      x: p.x, y: p.y,
      html: '<div class="tt">' + escC(p.exam.name) + '</div><div class="ts">' + escC(meta) + '</div><div class="tm">' + fmtScore(Math.round(p.plot)) + ' 分</div>' + lines
    };
  });

  mountChart(el, s, items, '总分趋势：' + fmtScore(pts[0].plot) + ' 到 ' + fmtScore(pts[pts.length - 1].plot));
}

/* ---------- 单科趋势 ---------- */
function drawSubjectChart(el, exams, subjectName, basis, targetRate) {
  var name = subjectName;
  var rows = [];
  exams.forEach(function (e) {
    var sub = null;
    e.subjects.forEach(function (x) { if (x.name === name) sub = x; });
    if (!sub) return;
    var v = effScore(sub, basis);
    if (v == null) return;
    var t = subjectTarget(targetRate, sub.full);
    rows.push({ exam: e, sub: sub, value: v, target: t, met: v >= t, rate: v / sub.full });
  });
  if (!rows.length) {
    el.innerHTML = '<div class="center-note" style="padding:24px 0 18px">这个科目在当前范围内还没有成绩</div>';
    return;
  }
  var full = rows[0].sub.full;
  var target = rows[0].target;
  var f = chartFrame(el, 224);
  var r = niceRange(rows.map(function (x) { return x.value; }), target);
  var ticks = [r.lo, Math.round((r.lo + r.hi) / 2), r.hi].filter(function (v, i, a) { return a.indexOf(v) === i; });
  var s = svgHead(f, name + '成绩趋势');

  ticks.forEach(function (v) {
    var y = yAt(v, r.lo, r.hi, f);
    s += '<line class="c-grid" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + y + '" y2="' + y + '"/>';
    s += '<text class="c-axis" x="' + (f.p.l - 7) + '" y="' + (y + 3.5) + '" text-anchor="end">' + v + '</text>';
  });

  var yT = yAt(target, r.lo, r.hi, f);
  s += '<line class="c-target" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + yT + '" y2="' + yT + '"/>';

  var xLast = xAt(rows.length - 1, rows.length, f);
  s += '<rect class="c-target-mark" x="' + (xLast - 3) + '" y="' + (yT - 3) + '" width="6" height="6" transform="rotate(45 ' + xLast + ' ' + yT + ')" fill="var(--amber)" opacity=".95"/>';
  var tlY = yT + 13 > f.H - 6 ? yT - 7 : yT + 13;
  s += '<text class="c-target-label" x="' + (f.W - f.p.r) + '" y="' + tlY + '" text-anchor="end">目标 ' + target + '</text>';

  rows.forEach(function (p, i) {
    p.x = xAt(i, rows.length, f);
    p.y = yAt(p.value, r.lo, r.hi, f);
  });
  var path = smoothPath(rows);
  s += '<path class="c-glow" d="' + path + '" pathLength="100"/>';
  s += '<path class="c-line" d="' + path + '" pathLength="100"/>';
  rows.forEach(function (p, i) {
    if (i === rows.length - 1) s += '<circle class="c-halo" cx="' + p.x + '" cy="' + p.y + '" r="10"/>';
    s += '<circle class="' + (i === rows.length - 1 ? 'c-dot-last' : 'c-dot') + '" cx="' + p.x + '" cy="' + p.y + '" r="' + (i === rows.length - 1 ? 4.2 : 3.1) + '" style="--i:' + i + '"/>';
  });

  xLabels(rows.length, f.pw).forEach(function (i) {
    var x = xAt(i, rows.length, f);
    var anchor = i === 0 ? 'start' : (i === rows.length - 1 ? 'end' : 'middle');
    s += '<text class="c-small" x="' + x + '" y="' + (f.H - 10) + '" text-anchor="' + anchor + '">' + fmtDateShort(rows[i].exam.date) + '</text>';
  });

  if (rows.length > 1) {
    s += '<text class="c-value" x="' + (rows[0].x + 3) + '" y="' + Math.max(f.p.t + 12, rows[0].y - 10) + '" text-anchor="start">' + fmtScore(rows[0].value) + '</text>';
    s += '<text class="c-value" x="' + (rows[rows.length - 1].x - 3) + '" y="' + Math.max(f.p.t + 12, rows[rows.length - 1].y - 10) + '" text-anchor="end">' + fmtScore(rows[rows.length - 1].value) + '</text>';
  } else {
    s += '<text class="c-value" x="' + rows[0].x + '" y="' + (rows[0].y - 12) + '" text-anchor="middle">' + fmtScore(rows[0].value) + '</text>';
  }
  s += '</svg>';

  var items = rows.map(function (p) {
    return {
      x: p.x, y: p.y,
      html: '<div class="tt">' + escC(p.exam.name) + '</div><div class="ts">' + escC(p.exam.name === fmtDateCN(p.exam.date) ? p.exam.type : fmtDateCN(p.exam.date) + ' · ' + p.exam.type) + '</div><div class="tm">' + fmtScore(p.value) + ' / ' + p.sub.full + '</div>' +

        '<div class="ts">得分率 ' + fmtPct(p.rate) + (p.sub.graded ? ' · 赋分科目' : '') + '</div>'

/* ---------- 得分率对比 ---------- */
function subjectStats(exams, basis, targetRate) {
  var map = {};
  exams.forEach(function (e) {
    e.subjects.forEach(function (s) {
      var v = effScore(s, basis);
      if (v == null) return;
      if (!map[s.name]) map[s.name] = { name: s.name, full: s.full, graded: !!s.graded, count: 0, sum: 0, latest: null, latestDate: '' };
      var m = map[s.name];
      m.count++;
      m.sum += v;
      if (!m.latestDate || e.date >= m.latestDate) {
        m.latestDate = e.date;
        m.latest = { value: v, rate: v / s.full, full: s.full };
      }
    });
  });
  return Object.keys(map).map(function (k) {
    var m = map[k];
    return {
      name: k, full: m.full, graded: m.graded, count: m.count,
      avgRate: m.sum / m.count / m.full,
      latestRate: m.latest.rate,
      targetRate: targetRate,
      gapRate: targetRate - (m.sum / m.count / m.full),
      latest: m.latest
    };
  }).sort(function (a, b) { return b.gapRate - a.gapRate; });
}

function drawRateChart(el, stats, targetRate) {
  if (!stats.length) return;
  var f = chartFrame(el, 226, { l: 34, r: 18, t: 28, b: 34 });
  var n = stats.length;
  var slot = f.pw / n;
  var bw = Math.min(38, Math.max(14, slot * 0.54));
  var s = svgHead(f, '各科得分率对比');
  [0, 0.5, 1].forEach(function (v) {
    var y = yAt(v, 0, 1, f);
    s += '<line class="c-grid" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + y + '" y2="' + y + '"/>';
    s += '<text class="c-axis" x="' + (f.p.l - 6) + '" y="' + (y + 3.5) + '" text-anchor="end">' + Math.round(v * 100) + '%</text>';
  });
  s += '<line class="c-bar-baseline" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + yAt(0, 0, 1, f) + '" y2="' + yAt(0, 0, 1, f) + '"/>';
  var yr = yAt(targetRate, 0, 1, f);
  s += '<line class="c-target" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + yr + '" y2="' + yr + '"/>';
  s += '<text class="c-small" x="' + (f.p.l + 2) + '" y="' + (yr - 4) + '" text-anchor="start" style="font-size:9.5px">目标 ' + fmtPct(targetRate) + '</text>';

  var items = [];
  stats.forEach(function (st, i) {
    var x = f.p.l + slot * (i + 0.5);
    var top = yAt(Math.max(0.001, st.avgRate), 0, 1, f);
    var bottom = yAt(0, 0, 1, f);
    var met = st.avgRate >= targetRate;
    s += '<rect class="c-bar ' + (met ? 'c-bar-met' : 'c-bar-miss') + '" x="' + (x - bw / 2) + '" y="' + top + '" width="' + bw + '" height="' + Math.max(2, bottom - top) + '" rx="2" style="--i:' + i + '"/>';
    var anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
    var lx = i === 0 ? x - bw / 2 : (i === n - 1 ? x + bw / 2 : x);
    s += '<text class="c-axis" x="' + lx + '" y="' + (f.H - 10) + '" text-anchor="' + anchor + '" style="font-size:11px">' + st.name.slice(0, 1) + '</text>';
    items.push({
      x: x, y: top,
      html: '<div class="tt">' + st.name + ' · ' + st.count + ' 场</div><div class="tm">平均 ' + fmtPct(st.avgRate) + '</div>' +
        '<div class="ts">最新 ' + fmtPct(st.latestRate) + ' · 目标 ' + fmtPct(targetRate) + '</div>' +
        '<div class="ts">' + (met ? '平均已达标' : '平均差 ' + fmtScore(st.gapRate * 100) + ' 个百分点') + '</div>'
    });
  });
  s += '</svg>';

  var legend = '<div class="chart-legend"><span><i class="dot met"></i>达标</span><span><i class="dot miss"></i>未达标</span><span><i class="tick"></i>目标线</span></div>';
  mountChart(el, s, items, '各科得分率对比柱状图');
  el.insertAdjacentHTML('beforeend', legend);
}

/* ---------- 排名走势 ---------- */
function drawRankChart(el, exams, which) {
  var rows = [];
  exams.forEach(function (e) {
    var r = which === 'grade' ? e.rank && e.rank.grade : e.rank && e.rank['class'];
    var size = which === 'grade' ? e.rank && e.rank.gradeSize : e.rank && e.rank.classSize;
    if (r == null || !size) return;
    rows.push({ exam: e, rank: Number(r), size: Number(size), pct: Number(r) / Number(size) });
  });
  if (!rows.length) {
    el.innerHTML = '<div class="center-note" style="padding:30px 0 24px">当前范围内没有' + (which === 'grade' ? '年级' : '班级') + '排名数据<br><span style="color:var(--muted)">周测与未填名次的场次不会出现在这里</span></div>';
    return;
  }
  var f = chartFrame(el, 208, { l: 40, r: 52, t: 28, b: 32 });
  var maxRank = Math.max.apply(null, rows.map(function (x) { return x.rank; }));
  var hi = Math.max(10, Math.ceil(maxRank / 10) * 10 + 2);
  var lo = 1;
  var s = svgHead(f, '名次走势图，纵轴越往上名次越靠前');
  [1, Math.round(hi / 2), hi].forEach(function (v) {
    var y = yAt(hi - (v - lo), lo, hi, f);
    s += '<line class="c-grid" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + y + '" y2="' + y + '"/>';
    s += '<text class="c-axis" x="' + (f.p.l - 7) + '" y="' + (y + 3.5) + '" text-anchor="end">' + v + '</text>';
  });

  rows.forEach(function (p, i) {
    p.x = xAt(i, rows.length, f);
    p.y = yAt(hi - (p.rank - lo), lo, hi, f);
  });
  var path = smoothPath(rows);
  s += '<path class="c-glow" d="' + path + '" pathLength="100"/>';
  s += '<path class="c-rank-line" d="' + path + '" pathLength="100"/>';
  rows.forEach(function (p, i) {
    if (i === rows.length - 1) s += '<circle class="c-halo" cx="' + p.x + '" cy="' + p.y + '" r="10"/>';
    s += '<circle class="' + (i === rows.length - 1 ? 'c-rank-last' : 'c-rank-dot') + '" cx="' + p.x + '" cy="' + p.y + '" r="' + (i === rows.length - 1 ? 4.4 : 3.1) + '" style="--i:' + i + '"/>';
  });
  xLabels(rows.length, f.pw).forEach(function (i) {
    var x = xAt(i, rows.length, f);
    var anchor = i === 0 ? 'start' : (i === rows.length - 1 ? 'end' : 'middle');
    s += '<text class="c-small" x="' + x + '" y="' + (f.H - 10) + '" text-anchor="' + anchor + '">' + fmtDateShort(rows[i].exam.date) + '</text>';
  });

  var last = rows[rows.length - 1];
  s += '<text class="c-value" x="' + (last.x - 6) + '" y="' + Math.max(f.p.t + 2, last.y - 10) + '" text-anchor="end">第 ' + last.rank + ' 名</text>';
  s += '</svg>';

  var items = rows.map(function (p) {
    return {
      x: p.x, y: p.y,
      html: '<div class="tt">' + escC(p.exam.name) + '</div><div class="ts">' + escC(p.exam.name === fmtDateCN(p.exam.date) ? p.exam.type : fmtDateCN(p.exam.date) + ' · ' + p.exam.type) + '</div><div class="tm">' + (which === 'grade' ? '年级' : '班级') + '第 ' + p.rank + ' 名</div>' +
        '<div class="ts">共 ' + p.size + ' 人 · 前 ' + fmtPct(p.pct) + '</div>'
    };
  });
  mountChart(el, s, items, '名次走势：最新第 ' + last.rank + ' 名');
}

/* ---------- 迷你趋势（总览） ---------- */
function drawMiniTrend(el, exams, basis, targetRate, targetTotal, provinceTotal) {
  if (!exams.length) return;
  var f = chartFrame(el, 132, { l: 34, r: 34, t: 22, b: 22 });
  var pts = exams.map(function (e) {
    var c = calcExam(e, basis, targetRate);
    return { exam: e, v: c.rate * provinceTotal, c: c };
  });
  var r = niceRange(pts.map(function (p) { return p.v; }), targetTotal);
  var s = svgHead(f, '近五次总分趋势');
  [r.lo, r.hi].forEach(function (v) {
    var y = yAt(v, r.lo, r.hi, f);
    s += '<line class="c-grid" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + y + '" y2="' + y + '"/>';
    s += '<text class="c-axis" x="' + (f.p.l - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" style="font-size:9.5px">' + v + '</text>';
  });
  var yT = yAt(targetTotal, r.lo, r.hi, f);
  s += '<line class="c-target" x1="' + f.p.l + '" x2="' + (f.W - f.p.r) + '" y1="' + yT + '" y2="' + yT + '"/>';
  s += '<text class="c-small" x="' + (f.p.l + 3) + '" y="' + (yT - 4) + '" text-anchor="start" style="font-size:9px">目标 ' + targetTotal + '</text>';
  pts.forEach(function (p, i) {
    p.x = xAt(i, pts.length, f);
    p.y = yAt(p.v, r.lo, r.hi, f);
  });
  var path = smoothPath(pts);
  if (pts.length > 1) {
    s += '<path class="c-glow" d="' + path + '" pathLength="100"/>';
    s += '<path class="c-line" d="' + path + '" pathLength="100"/>';
  }
  pts.forEach(function (p, i) {
    var isLast = i === pts.length - 1;
    if (isLast) s += '<circle class="c-halo" cx="' + p.x + '" cy="' + p.y + '" r="8"/>';
    s += '<circle class="' + (isLast ? 'c-dot-last' : 'c-dot') + '" cx="' + p.x + '" cy="' + p.y + '" r="' + (isLast ? 4 : 2.6) + '" style="--i:' + i + '"/>';
    if (isLast) {
      s += '<text class="c-value" x="' + (p.x - 6) + '" y="' + (p.y - 9) + '" text-anchor="end">' + fmtScore(Math.round(p.v)) + '</text>';
    }
  });
  if (pts.length === 1) {
    s += '<text class="c-small" x="' + (f.W / 2) + '" y="' + (f.H - 2) + '" text-anchor="middle">' + fmtDateShort(pts[0].exam.date) + '</text>';
  } else {
    s += '<text class="c-small" x="' + f.p.l + '" y="' + (f.H - 2) + '" text-anchor="start">' + fmtDateShort(pts[0].exam.date) + '</text>';
    s += '<text class="c-small" x="' + (f.W - f.p.r) + '" y="' + (f.H - 2) + '" text-anchor="end">' + fmtDateShort(pts[pts.length - 1].exam.date) + '</text>';
  }
  s += '</svg>';
  el.innerHTML = s;
  el.setAttribute('aria-label', '近五次总分趋势，最新 ' + fmtScore(Math.round(pts[pts.length - 1].v)) + ' 分');
}

}

  moon: '<path d="M19 14.5A8 8 0 0 1 9.5 5a8 8 0 1 0 9.5 9.5z"/>',
  lock: '<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>',
  arrow: '<path d="M5 12h14M14 7l5 5-5 5"/>',
  chart: '<path d="M4 18.5V6"/><path d="M4 18.5H20"/><path d="M7 15l3.5-5 3 3 4.5-6"/>',
  ledger: '<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/>'
};

function icon(name, cls) {
  var body = ICONS[name] || ICONS.info;
  return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
}

/* ---------- 小工具 ---------- */
function secHead(title, note, tone) {
  return '<div class="sec-head"><div class="sec-title">' + (tone ? '<i class="sec-mark tone-' + tone + '"></i>' : '') + '<h2>' + title + '</h2></div>' + (note ? '<span class="sec-note">' + note + '</span>' : '') + '</div>';
}

function subjDot(name) {
  return '<i class="subj-dot" style="--sc:' + subjectColorVar(name) + '"></i>';
}

function chipSubject(label, active, act, val) {
  return '<button class="chip" data-act="' + act + '" data-v="' + esc(val) + '" aria-pressed="' + (active ? 'true' : 'false') + '"><span class="chip-dot" style="--sc:' + subjectColorVar(label) + '"></span>' + esc(label) + '</button>';
}

function isStandalone() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function isIOS() {
  return /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}

function viewHead(kicker, title, action) {
  return '<header class="view-head"><div><p class="kicker">' + kicker + '</p><h1>' + title + '</h1></div>' + (action || '') + '</header>';
}

function chip(label, active, act, val) {
  return '<button class="chip" data-act="' + act + '" data-v="' + esc(val) + '" aria-pressed="' + (active ? 'true' : 'false') + '">' + esc(label) + '</button>';
}

function segOpts(opts, current, act) {
  return '<div class="seg">' + opts.map(function (o) {
    return '<button data-act="' + act + '" data-v="' + esc(o[0]) + '" aria-pressed="' + (current === o[0] ? 'true' : 'false') + '">' + esc(o[1]) + '</button>';
  }).join('') + '</div>';
}

function scoreTag(met, text) {
  return '<span class="tag ' + (met ? 'blue' : 'red') + '">' + text + '</span>';
}

function gradeOf(data) { return data.profile.grade; }

/* ============================================================
   首次引导
   ============================================================ */
function obCombo(ob) {
  var p = provinceOf(ob.province);
  if (ob.unsorted) return '九科';
  if (p.mode === '传统') return ob.track || '理科';
  if (p.mode === '3+1+2') {
    if (!ob.first || !ob.second || ob.second.length !== 2) return null;
    return comboFromNames([ob.first].concat(ob.second));
  }
  if (p.mode === '3+3') {
    if (!ob.elect || ob.elect.length !== 3) return null;
    return comboFromNames(ob.elect);
  }
  return null;
}

function renderOnboarding(ob) {
  var p = provinceOf(ob.province);
  var steps = [1, 2, 3, 4];
  var combo = obCombo(ob);
  var body = '';

  if (ob.step === 1) {
    body = GRADES.map(function (g) {
      var sub = g === '高一' ? '九科全录，暂不选科也可以' : (g === '高二' ? '按选科组合记录，历史成绩保留' : '冲刺阶段，目标最重要');
      return '<button class="gcard" data-act="ob-grade" data-v="' + g + '" aria-pressed="' + (ob.grade === g ? 'true' : 'false') + '">' +
        '<span class="gnum">' + g + '</span><span class="gsub">' + sub + '</span>' +
        '<span class="gdot">' + icon('check') + '</span></button>';
    }).join('');
  }

  if (ob.step === 2) {
    body = '<div class="pgrid">' + PROVINCE_ORDER.map(function (name) {
      return '<button class="pcell" data-act="ob-prov" data-v="' + name + '" aria-pressed="' + (ob.province === name ? 'true' : 'false') + '">' + name + '</button>';
    }).join('') + '</div>' +
      '<div class="pinfo"><div class="meta"><b>' + esc(p.name) + '</b><span>' + p.mode + '</span><span>满分 ' + p.total + '</span><span>' +
      (p.mode === '3+1+2' ? '再选 2 科赋分' : (p.mode === '3+3' ? '选考 3 科赋分' : '文理分科')) +
      '</span></div><div class="note">' + esc(p.note) + '</div></div>';
  }

  if (ob.step === 3) {
    var head = '';
    if (ob.grade === '高一') {
      head = '<button class="switch-row" data-act="ob-unsorted"><span><span class="t">暂不选科，九科全录</span><span class="d">高一还没分科时，先把九科都记下来</span></span><span class="switch" aria-checked="' + (ob.unsorted ? 'true' : 'false') + '" role="switch"></span></button>';
    }

    if (ob.unsorted) {
      var nine = comboDefs(p, '九科');
      body = head + '<div class="tpreview" style="margin-top:12px">' + nine.map(function (s) {
          return '<div><span>' + s.name + '</span><b>' + s.full + '</b></div>';
        }).join('') + '</div>' +
        '<div class="combo-line" style="margin-top:12px"><span>满分合计</span><b>' + nine.reduce(function (a, s) { return a + s.full; }, 0) + ' 分</b><span>' + (p.mode === '传统' ? '文理分科后在设置里改成六科' : '选科后在设置里改成六科') + '</span></div>' +
        '<p class="ob-note">' + (p.mode === '传统' ? '高一上学期多数学校还没分科，先把九科都记下来；文理分科后按语数外 + 文综/理综记录。' : '高一上学期多数学校还没分科，先把九科都记下来；赋分科目会在成绩单里标出。') + '</p>';
    } else if (p.mode === '3+1+2') {
      body = head +
        '<p class="ob-sublab"><b>首选科目</b><span>二选一，原始分计入</span></p>' +
        '<div class="first-grid">' + p.first.map(function (x) {
          return '<button class="big-chip" data-act="ob-first" data-v="' + x[0] + '" aria-pressed="' + (ob.first === x[0] ? 'true' : 'false') + '">' + x[0] + '<small>满分 ' + x[1] + '</small></button>';
        }).join('') + '</div>' +
        '<p class="ob-sublab"><b>再选科目</b><span class="count">已选 ' + (ob.second ? ob.second.length : 0) + ' / 2</span></p>' +
        '<div class="elect-grid">' + p.second.map(function (x) {
          var on = ob.second.indexOf(x[0]) >= 0;
          return '<button class="big-chip" data-act="ob-second" data-v="' + x[0] + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + x[0] + '<small>赋分</small></button>';
        }).join('') + '</div>' +
        '<div class="combo-line"><span>你的组合</span><b>' + (combo ? esc(combo) : '再选 2 科') + '</b><span>' + (combo ? '赋分：' + esc(ob.second.filter(function (n) { return ['化学', '生物', '政治', '地理'].indexOf(n) >= 0; }).join(' / ')) : '') + '</span></div>';
    } else if (p.mode === '3+3') {
      body = head +
        '<p class="ob-sublab"><b>选考科目</b><span class="count">已选 ' + (ob.elect ? ob.elect.length : 0) + ' / 3</span></p>' +
        '<div class="elect-grid">' + p.elect.map(function (x) {
          var on = ob.elect.indexOf(x[0]) >= 0;
          return '<button class="big-chip" data-act="ob-elect" data-v="' + x[0] + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + x[0] + '<small>满分 ' + x[1] + '</small></button>';
        }).join('') + '</div>' +
        '<div class="combo-line"><span>你的组合</span><b>' + (combo ? esc(combo) : '再选 1 科') + '</b><span>选考 3 科按等级赋分</span></div>';
    } else {
      body = head +
        '<p class="ob-sublab"><b>文理方向</b><span>传统高考省份</span></p>' +
        '<div class="track-grid">' + ['文科', '理科'].map(function (t) {
          var names = p.tracks[t].map(function (x) { return x[0]; }).join(' · ');
          return '<button class="track-card" data-act="ob-track" data-v="' + t + '" aria-pressed="' + (ob.track === t ? 'true' : 'false') + '"><b>' + t + '</b><span>' + names + '</span></button>';
        }).join('') + '</div>' +
        '<div class="combo-line"><span>满分合计</span><b>' + 750 + ' 分</b><span>语数外 450 + 综合 300</span></div>';
    }

    if (!ob.unsorted) {
      body += '<p class="ob-note">' + (p.mode === '传统' ? '文理分科后按「语数外 450 + 文综/理综 300」记录。历史记录仍按当时的组合保存，不会被改写。' : '赋分科目会在成绩单里单独标出「赋分」。历史记录仍按当时的组合保存，不会被改写。') + '</p>';
    }
  }

  if (ob.step === 4) {
    var defs = comboDefs(p, combo || defaultCombo(p, ob.grade));
    var rate = ob.target / p.total;
    body = '<div class="target-big"><input id="ob-target" data-ob="target" type="number" inputmode="numeric" min="1" max="' + p.total + '" step="1" value="' + ob.target + '" aria-label="目标总分"><span class="of">/ ' + p.total + '</span></div>' +
      '<p class="target-rate">目标得分率 <b id="ob-rate">' + fmtPct(rate) + '</b> · 各科目标分按满分占比换算</p>' +
      '<div class="target-chips">' + [80, 85, 90].map(function (x) {
        return '<button class="chip" data-act="ob-target-preset" data-v="' + x + '" aria-pressed="false">' + x + '% · ' + Math.round(p.total * x / 100) + '</button>';
      }).join('') + '</div>' +
      '<div class="tpreview" id="ob-preview">' + defs.map(function (s) {
        return '<div><span>' + s.name + '</span><b>' + Math.round(rate * s.full) + '</b></div>';
      }).join('') + '</div>' +
      '<div class="size-row"><label class="size-cell"><span class="cap">默认班级人数</span><input data-ob="classSize" type="number" inputmode="numeric" min="1" max="200" value="' + ob.classSize + '"></label>' +
      '<label class="size-cell"><span class="cap">默认年级人数</span><input data-ob="gradeSize" type="number" inputmode="numeric" min="1" max="3000" value="' + ob.gradeSize + '"></label></div>' +
      '<p class="ob-note">人数只用于自动带出排名人数，可以在每一场里单独修改。所有数据只保存在这台设备。</p>';
  }

  var titles = [
    ['你在读哪个年级？', '成绩会按年级归档，升级后历史记录不受影响。'],
    ['你在哪个省份参加高考？', '内置 31 个省份的高考模式、总分与各科满分，默认甘肃。'],
    ['选科组合是什么？', '赋分科目会自动标注，统计时可以切换口径。'],
    ['给自己定一个目标总分。', '目标会按比例换算出每科目标分，之后可以随时改。']
  ];
  var t = titles[ob.step - 1];
  if (ob.step === 3 && p.mode === '传统') {
    t = ob.unsorted ? ['先记九科，还是直接选文理？', '没分科就先记九科；已经分科就关掉上面的开关。'] : ['选文还是选理？', '文理分科后按语数外 + 文综/理综记录，历史记录不受影响。'];
  }

  return '<div class="ob" role="dialog" aria-modal="true" aria-label="初始设置">' +
    '<div class="ob-inner">' +
    '<div class="ob-brand"><span class="ob-mark">' + icon('chart') + '</span><b>成绩簿</b><span>高中三年 · 本机记录</span></div>' +
    '<div class="ob-steps">' + steps.map(function (i) { return '<i class="' + (i <= ob.step ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
    '<div class="ob-stepno"><span>' + ob.step + ' / 4</span><span>' + ['选年级', '选省份', '选科目', '设目标'][ob.step - 1] + '</span></div>' +
    '<div class="ob-q"><h2>' + t[0] + '</h2><p>' + t[1] + '</div>' +
    '<div class="ob-body">' + body + '</div>' +
    (ob.step === 1 ? '<div class="ob-index">' +
      '<p class="ix-t">这三年会留下什么</p>' +
      '<div class="ix-row"><span>每场考试</span><b>分数、排名、一句备注</b></div>' +
      '<div class="ix-row"><span>每个目标</span><b>总分、各科目标分、得分率</b></div>' +
      '<div class="ix-row"><span>每次分析</span><b>趋势、短板、下一步先补哪科</b></div>' +
      '<p class="ix-note">无需账号 · 不联网 · 数据只在本机</p></div>' : '') +
    '<div class="ob-foot">' + (ob.step > 1 ? '<button class="back" data-act="ob-back">上一步</button>' : '') +
    '<button class="btn-primary next" data-act="ob-next"' + ((ob.step === 3 && !combo) ? ' disabled' : '') + '>' + (ob.step === 4 ? '完成设置，开始记录' : '继续') + '</button></div>' +
    '</div></div>';
}

/* ============================================================
   总览
   ============================================================ */
function renderOverview(data, state) {
  var latest = latestExam(data);
  var p = provinceOf(data.profile.province);
  if (!latest) {
    return viewHead(esc(gradeOf(data)) + ' · ' + esc(comboLabel(data.profile.combo)) + ' · ' + esc(data.profile.province), '总览',
      '<button class="icon-btn" data-act="go-record" aria-label="记录考试">' + icon('plus') + '</button>') +
      '<div class="empty-screen"><div class="empty"><div class="glyph">' + icon('ledger') + '</div><h3>还没有成绩记录</h3><p>第一场考试录入后，这里会出现目标进度、各科对比和趋势。</p><button class="btn-line" data-act="go-record">' + icon('plus') + '记录第一场</button></div>' +
      '<div class="about" style="margin-top:22px;text-align:center">无账号 · 无云同步 · 数据只在本机</div></div>';
  }

  var c = calcExam(latest, state.basis, data.target.rate);
  var targetRate = data.target.rate;
  var gap = c.gap;
  var prevExam = sortedExams(data, 'desc')[1] || null;
  var prevC = prevExam ? calcExam(prevExam, state.basis, targetRate) : null;
  var dPrev = prevC ? (c.total - prevC.total) : null;
  var fillPct = Math.min(100, c.rate * 100);
  var tickPct = Math.min(100, targetRate * 100);
  var tickStyle = 'left:' + tickPct + '%';
  var lblStyle = 'left:' + tickPct + '%';
  if (tickPct < 24) { lblStyle += ';transform:none;margin-left:7px;'; }
  var rankedExam = latestHasRank(data) ? latest : latestRanked(data);
  var insight = buildInsight(scopeExams(data, { grade: 'current', type: 'all' }), state.basis, targetRate);
  var top = insight.priority[0];

  var recent = sortedExams(data, 'desc').slice(0, 5).reverse();
  var firstRecent = recent[0], lastRecent = recent[recent.length - 1];
  var cFirst = calcExam(firstRecent, state.basis, targetRate);
  var cLast = calcExam(lastRecent, state.basis, targetRate);
  var delta = (cLast.rate - cFirst.rate) * p.total;

  var list = sortedExams(data, 'desc').filter(function (e) {
    return state.recType === 'all' || e.type === state.recType;
  });

  var html = viewHead(esc(data.profile.grade) + ' · ' + esc(comboLabel(data.profile.combo)) + ' · ' + esc(data.profile.province), '总览',
    '<button class="icon-btn" data-act="go-record" aria-label="记录考试">' + icon('plus') + '</button>');

  /* 目标进度 */
  html += '<section class="hero" aria-label="目标进度">' +
    '<div class="hero-meta"><span>最近一次 · ' + esc(latest.name) + (c.missing ? ' <span class="tag amber">不完整 ' + c.filled + '/' + (c.filled + c.missing) + '</span>' : '') + '</span><span class="hero-prev">' + (prevC ? '较上场 <b class="' + (dPrev >= 0 ? 'up' : 'down') + '">' + (dPrev >= 0 ? '↑' : '↓') + ' ' + fmtScore(Math.abs(dPrev)) + '</b>' : esc(latest.grade)) + '</span></div>' +
    '<div class="hero-score-row"><div class="hero-score"><span class="count" data-count="' + c.total + '" data-dec="' + (Math.abs(c.total - Math.round(c.total)) > 0.05 ? 1 : 0) + '">' + fmtScore(c.total) + '</span><span class="unit">/ ' + fmtScore(c.base) + '</span></div>' +
    '<div class="hero-gap"><span class="gap-label">' + (gap >= 0.5 ? '距目标' : (gap <= -0.5 ? '超出目标' : '目标已达成')) + '</span>' +
    (Math.abs(gap) < 0.5 ? '<span class="gap-val over">刚好</span>' : '<span class="gap-val' + (gap < 0 ? ' over' : '') + '"><span class="count" data-count="' + Math.round(Math.abs(gap)) + '" data-dec="0">' + fmtScore(Math.round(Math.abs(gap))) + '</span><small>分</small></span>') +
    '</div></div>' +
    '<div class="track-area"><span class="tick-label" style="' + lblStyle + '">目标 ' + fmtScore(Math.round(c.targetPts)) + '</span>' +
    '<div class="track"><div class="fill" style="width:' + fillPct.toFixed(2) + '%"></div><div class="tick" style="' + tickStyle + '"></div></div></div>' +
    '<div class="hero-foot"><span>本场得分率 <b>' + fmtPct(c.rate) + '</b></span><span>目标 ' + fmtScore(Math.round(c.targetPts)) + ' 分 · ' + fmtPct(targetRate) + '</span></div>' +
    (Math.abs(c.base - p.total) > 0.5 ? '<p class="hero-note">本场满分 ' + fmtScore(c.base) + ' 分，目标按得分率折算为 ' + fmtScore(Math.round(c.targetPts)) + ' 分（等同 ' + p.total + ' 分制下的 ' + data.target.total + ' 分）。</p>' : '') +
    (c.missing ? '<p class="hero-note">少填 ' + c.missing + ' 科，总分与目标对比按已录 ' + c.filled + ' 科计。</p>' : '') +
    '</section><div class="hr2"></div>';

  /* 最新成绩 */
  html += '<section class="sec">' + secHead('最新成绩', c.met + ' / ' + c.filled + ' 达标', 'blue') +
    '<div class="panel">' + c.rows.map(function (r) {
      var has = r.value != null;
      var met = r.met;
      return '<div class="srow">' +
        '<span class="sname">' + subjDot(r.name) + esc(r.name) + (r.graded ? '<span class="mark">赋</span>' : '') + '</span>' +
        '<div class="bullet"><div class="fill ' + (met ? '' : 'miss') + '" style="width:' + (has ? Math.min(100, r.rate * 100).toFixed(1) : 0) + '%"></div><div class="tick" style="left:' + (targetRate * 100).toFixed(1) + '%"></div></div>' +
        '<span class="sval">' + (has ? fmtScore(r.value) : '—') + '</span>' +
        '<span class="sbase">/' + r.full + '</span>' +
        '<span class="sgap ' + (met ? 'met' : (has ? '' : ' absent')) + '">' + (has ? (met ? (Math.abs(r.gap) < 0.05 ? '0' : '+' + fmtScore(Math.abs(r.gap))) : '−' + fmtScore(Math.abs(r.gap))) : '缺考') + '</span>' +
        '</div>';
    }).join('') + '</div></section>';

  if (top) {
    html += '<button class="insight-strip" data-act="go-analysis"><span class="k">优先加强</span><strong><b>' + esc(top.name) + '</b> 差 ' + fmtScore(Math.max(0, top.gap)) + ' 分' +
      (top.consecutive >= 2 ? '，<span class="nowrap">连续 ' + top.consecutive + ' 场未达标</span>' : '') + '</strong><span class="arrow">分析 →</span></button>';
  }

  /* 排名 */
  html += '<section class="sec">' + secHead('排名', rankedExam && rankedExam.id !== latest.id ? '最近有排名 · ' + fmtDateCN(rankedExam.date) : '', 'green') + rankBlock(data, rankedExam) + '</section>';

  /* 近五次 */
  html += '<section class="sec">' + secHead('近五次总分', '按 ' + p.total + ' 分制折算', 'violet') +
    '<div class="chart-card tone-violet"><div class="chart-head"><div><h3>最近 ' + recent.length + ' 场</h3><p class="chart-sub">' + (recent.length > 1 ? fmtDateShort(firstRecent.date) + ' – ' + fmtDateShort(lastRecent.date) : fmtDateCN(lastRecent.date)) + '</div>' +
    '<p class="chart-stat"><b class="' + (delta > 0 ? 'up' : (delta < 0 ? 'down' : '')) + '">' + (delta > 0 ? '+' : (delta < 0 ? '−' : '')) + fmtScore(Math.abs(delta)) + '</b>较首场</p></div>' +
    '<div class="chart-wrap" id="mini-trend"></div></div></section>';

  /* 考试记录 */
  html += '<section class="sec">' + secHead('考试记录', '共 ' + list.length + ' 场', 'amber') +
    '<div class="chip-wrap rec-chips">' + chip('全部', state.recType === 'all', 'rec-type', 'all') +
    TYPES.map(function (t) { return chip(t, state.recType === t, 'rec-type', t); }).join('') + '</div>' +
    (list.length ? '<div class="rec-list">' + list.map(recRow).join('') + '</div>' :
      '<div class="empty"><h3>这个筛选下还没有记录</h3><p>换个类型，或者去记录一场新的考试。</p></div>') +
    '</section>';

  html += '<p class="about" style="text-align:center;margin-top:24px">数据只保存在这台设备 · 明文 JSON · 可随时导出</p>';
  return html;
}

function latestHasRank(data) {
  var e = latestExam(data);
  return !!(e && e.rank && (e.rank['class'] || e.rank.grade));
}

function latestRanked(data) {
  var list = sortedExams(data, 'desc');
  for (var i = 0; i < list.length; i++) {
    if (list[i].rank && (list[i].rank['class'] || list[i].rank.grade)) return list[i];
  }
  return null;
}

function rankBlock(data, exam) {
  if (!exam) {
    return '<div class="panel" style="padding:18px 16px"><p style="font-size:12.5px;color:var(--muted)">还没有排名记录。录成绩时填上名次，这里会显示班级、年级位置。</p></div>';
  }
  var r = exam.rank || {};
  var clsPct = examPercentile(r['class'], r.classSize);
  var grdPct = examPercentile(r.grade, r.gradeSize);
  var prev = null;
  var list = sortedExams(data, 'desc');
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    if (e.type === '期末' && e.date < exam.date && e.rank && e.rank['class'] && e.rank.classSize) { prev = e; break; }
  }
  var deltaTxt = '';
  if (prev && r['class']) {
    var d = prev.rank['class'] - r['class'];
    if (d > 0) deltaTxt = '<span class="up">↑ ' + d + ' 名</span>';
    else if (d < 0) deltaTxt = '<span class="down">↓ ' + Math.abs(d) + ' 名</span>';
    else deltaTxt = '<b>持平</b>';
    deltaTxt += '<span>较上次期末（' + fmtDateShort(prev.date) + '）</span>';
  } else if (prev) {
    deltaTxt = '<span>上次期末 ' + fmtDateShort(prev.date) + ' 未填班级名次</span>';
  } else {
    deltaTxt = '<span>还没有可对比的上次期末</span>';
  }

  var rows = '';
  if (r['class']) {
    rows += '<div class="rank-row"><div class="rank-line"><span class="rlabel">班级</span><span class="rval count" data-count="' + r['class'] + '" data-dec="0">' + r['class'] + '</span><span class="rof">/ ' + (r.classSize || '—') + '</span>' +
      '<span class="rpct">前 ' + fmtPct(clsPct) + '</span></div><div class="ptrack"><span class="pmark" style="left:' + (clsPct * 100).toFixed(1) + '%"></span></div></div>';
  }
  if (r.grade) {
    rows += '<div class="rank-row"><div class="rank-line"><span class="rlabel">年级</span><span class="rval count" data-count="' + r.grade + '" data-dec="0">' + r.grade + '</span><span class="rof">/ ' + (r.gradeSize || '—') + '</span>' +
      '<span class="rpct">前 ' + fmtPct(grdPct) + '</span></div><div class="ptrack"><span class="pmark" style="left:' + (grdPct * 100).toFixed(1) + '%"></span></div></div>';
  }
  if (!rows) rows = '<p style="padding:12px 0;font-size:12.5px;color:var(--muted)">这场没有填名次</p>';

  return '<div class="panel rank">' + rows + '<div class="rank-foot">' + deltaTxt + '</div></div>';
}

function recRow(e) {
  var c = calcExam(e, 'graded', 0); // 仅用于缺科判断，rate 不在这里用
  var missing = c.missing;
  var total = 0, base = 0;
  e.subjects.forEach(function (s) {
    var v = s.graded ? (s.gradedScore != null ? s.gradedScore : s.raw) : s.raw;
    if (v != null) { total += v; base += s.full; }
  });
  var rate = base ? total / base : 0;
  var r = e.rank || {};
  var meta = [esc(e.type)];
  if (e.type === '周测' && !r['class'] && !r.grade) {
    // 周测通常不排名，不在卡片里占位置
  } else if (r['class']) {
    meta.push('班级 ' + r['class']);
  } else if (r.grade) {
    meta.push('年级 ' + r.grade);
  } else {
    meta.push('未记排名');
  }
  meta.push('得分率 ' + fmtPct(rate));
  return '<button class="rec" data-act="open-exam" data-id="' + esc(e.id) + '">' +
    '<div class="rec-date"><b>' + fmtDateShort(e.date) + '</b><span>' + weekdayCN(e.date) + '</span></div>' +
    '<div class="rec-body" style="min-width:0"><div class="rec-name">' + esc(e.name === fmtDateCN(e.date) ? e.type : e.name) + '</div><div class="rec-meta">' +
    meta.map(function (m, i) { return (i ? '<span class="sep">·</span>' : '') + '<span>' + m + '</span>'; }).join('') +
    (missing ? '<span class="tag amber">不完整 ' + (e.subjects.length - missing) + '/' + e.subjects.length + '</span>' : '') +
    '</div></div>' +
    '<div class="rec-score"><b>' + fmtScore(total) + '</b><span>/ ' + fmtScore(base) + '</span></div>' +
    '</button>';
}

function draftParseNum(v) {
  if (v == null || String(v).trim() === '') return null;
  var n = Number(v);
  return isFinite(n) ? n : null;
}

function draftCalc(draft, targetRate) {
  var total = 0, base = 0, full = 0, filled = 0, missing = 0, met = 0;
  var rows = draft.subjects.map(function (s) {
    var sc = draft.scores[s.name] || { raw: '', graded: '' };
    var raw = draftParseNum(sc.raw);
    var graded = s.graded ? draftParseNum(sc.graded) : null;
    var value = s.graded ? (graded != null ? graded : raw) : raw;
    var target = subjectTarget(targetRate, s.full);
    full += s.full;
    if (value != null) {
      total += value; base += s.full; filled++;
      if (value >= target) met++;
    } else missing++;
    return { s: s, value: value, target: target, met: value != null && value >= target };
  });
  return { total: total, base: base, full: full, filled: filled, missing: missing, met: met, rate: base ? total / base : 0, rows: rows };
}

function draftLiveSummary(draft, targetRate) {
  var c = draftCalc(draft, targetRate);
  if (!c.filled) return '还没有填分';
  return '合计 <b style="color:var(--ink)">' + fmtScore(c.total) + '</b> · ' + fmtPct(c.rate) + ' · ' + c.filled + '/' + draft.subjects.length + ' 科';
}

   分析
   ============================================================ */
function renderAnalysis(data, state) {
  var p = provinceOf(data.profile.province);
  var f = state.analysis;
  var scope = scopeExams(data, f);
  var targetRate = data.target.rate;
  var html = viewHead(esc(data.profile.grade) + ' · ' + esc(comboLabel(data.profile.combo)), '分析',
    '<button class="icon-btn" data-act="go-record" aria-label="记录考试">' + icon('plus') + '</button>');

  var gradesPresent = [];
  data.exams.forEach(function (e) { if (gradesPresent.indexOf(e.grade) < 0) gradesPresent.push(e.grade); });
  GRADES.forEach(function (g) { if (gradesPresent.indexOf(g) < 0) gradesPresent.push(g); });

  var gradedInScope = scope.some(function (e) { return e.subjects.some(function (s) { return s.graded; }); });

  html += '<div class="filter-card" style="margin-top:14px">' +
    '<div class="filter-row"><span class="filter-lab">年级</span><div class="chip-wrap" style="flex:1;padding:0">' +
    chip('当前 · ' + data.profile.grade, f.grade === 'current', 'f-grade', 'current') +
    chip('全部', f.grade === 'all', 'f-grade', 'all') +
    GRADES.filter(function (g) { return g !== data.profile.grade; }).map(function (g) {
      return chip(g, f.grade === g, 'f-grade', g);
    }).join('') + '</div></div>' +
    '<div class="filter-row"><span class="filter-lab">类型</span><div class="chip-wrap" style="flex:1;padding:0">' +
    chip('全部', f.type === 'all', 'f-type', 'all') + TYPES.map(function (t) { return chip(t, f.type === t, 'f-type', t); }).join('') +
    '</div></div>' +
    (gradedInScope ? '<div class="filter-row"><span class="filter-lab">口径</span>' +
      segOpts([['graded', '赋分优先'], ['raw', '仅原始分']], state.basis, 'basis') +
      '</div>' : '') +
    '<div class="scope-line"><span>' + (scope.length ? scope.length + ' 场 · ' + fmtDateShort(scope[0].date) + ' – ' + fmtDateShort(scope[scope.length - 1].date) : '当前筛选没有场次') + '</span><span>按住并拖动看数值</span></div>' +
    '</div>';

  if (!scope.length) {
    return html + '<div class="empty" style="margin-top:22px"><div class="glyph">' + icon('chart') + '</div><h3>这个范围里还没有考试</h3><p>换一个年级或类型，或者先记录一场成绩。图表和结论会按筛选范围重新计算。</p><button class="btn-line" data-act="go-record">' + icon('plus') + '记录一场</button></div>';
  }

  var insight = buildInsight(scope, state.basis, targetRate);

  /* 结论 */
  html += '<section class="card insight" style="margin-top:12px">' +
    '<p class="ins-lead">本地规则结论</p>' +
    (insight.priority.length ?
      '<h2 style="font-size:15px;font-weight:650">优先加强</h2>' +
      '<div class="ins-list" style="margin-top:8px">' + insight.priority.map(function (s, i) {
        return '<div class="ins-row"><span class="idx">' + (i + 1) + '</span><div>' +
          '<div class="h"><b style="font-size:' + (i === 0 ? '17px' : '14px') + '">' + subjDot(s.name) + esc(s.name) + '</b>' +
          '<span class="d">差 ' + fmtScore(Math.max(0, s.gap)) + ' 分</span>' +
          '<span class="s">' + (s.consecutive >= 2 ? '连续 ' + s.consecutive + ' 场未达标' : '最近一次未达标') + ' · 平均 ' + fmtPct(s.avgRate) + '</span></div>' +
          (i === 0 ? '<p class="tip">' + esc(s.advice) + '</p>' : '') +
          '</div></div>';
      }).join('') + '</div>'
      : '<p style="font-size:13px;color:var(--muted);margin-top:8px">当前范围内没有明显掉队的科目。保持节奏，下一场继续观察。</p>') +
    '<div class="keep"><h3>保持优势</h3>' +
    (insight.keep.length ? insight.keep.map(function (s) {
      return '<div class="keep-row"><b>' + subjDot(s.name) + esc(s.name) + '</b><span class="ok">' + esc(s.keepNote) + '</span><span>平均 ' + fmtPct(s.avgRate) + '</span><span>波动 ' + fmtScore(s.std) + ' 分</span></div>';
    }).join('') : '<p style="font-size:12.5px;color:var(--muted)">还没有稳定达标的科目，先把最接近目标的一科顶上去。</p>') +
    '</div><p class="rule-note">结论按当前筛选范围内的差距排序，由本地规则计算；不联网、不调用 AI。</p></section>';

  /* 总分趋势 */
  var stats = scope.map(function (e) { return calcExam(e, state.basis, targetRate); });
  var firstVal = stats[0].rate * p.total, lastVal = stats[stats.length - 1].rate * p.total;
  var incomplete = scope.filter(function (e) {
    var c = calcExam(e, state.basis, targetRate);
    return !c.complete;
  }).length;
  html += '<section class="chart-card tone-violet" style="margin-top:12px"><div class="chart-head"><div><h3>总分趋势</h3><p class="chart-sub">' + scope.length + ' 场 · 折算 ' + p.total + ' 分制' + (incomplete ? ' · ' + incomplete + ' 场不完整已折算' : '') + '</div>' +
    '<p class="chart-stat"><b>' + fmtScore(Math.round(firstVal)) + ' → ' + fmtScore(Math.round(lastVal)) + '</b><span class="' + (lastVal >= firstVal ? 'up' : 'down') + '">' + (lastVal >= firstVal ? '+' : '−') + fmtScore(Math.abs(Math.round(lastVal - firstVal))) + '</span></p></div>' +
    '<div class="chart-wrap" id="chart-total"></div></section>';

  /* 单科趋势 */
  var subs = subjectStats(scope, state.basis, targetRate);
  var currentSub = state.subject;
  if (!subs.some(function (s) { return s.name === currentSub; })) currentSub = subs.length ? subs[0].name : null;
  var subStat = subs.filter(function (s) { return s.name === currentSub; })[0];
  html += '<section class="chart-card tone-subject" style="--chart-accent:' + subjectColorVar(currentSub) + '"><div class="chart-head"><div><h3>单科趋势</h3><p class="chart-sub">目标 ' + (subStat ? subjectTarget(targetRate, subStat.full) : '—') + ' · ' + (subStat ? subStat.count : 0) + ' 场</p></div>' +
    '<p class="chart-stat"><b>' + (subStat ? fmtPct(subStat.latestRate) : '—') + '</b>最新得分率</p></div>' +
    '<div class="chip-wrap subj-chips" style="padding:2px 4px 6px">' + subs.map(function (s) {
      return chipSubject(s.name, s.name === currentSub, 'subject', s.name);
    }).join('') + '</div>' +
    '<div class="chart-wrap" id="chart-subject"></div>' +
    (subStat ? '<div class="scope-line" style="padding:0 4px 6px"><span>平均 ' + fmtPct(subStat.avgRate) + '</span><span>最新 ' + fmtPct(subStat.latestRate) + ' · 目标 ' + fmtPct(targetRate) + '</span></div>' : '') +
    '</section>';

  /* 得分率对比 */
  html += '<section class="chart-card tone-amber"><div class="chart-head"><div><h3>得分率对比</h3><p class="chart-sub">筛选范围内平均 · 按差距从大到小</p></div><p class="chart-stat"><b>' + (scope.length ? fmtPct(avgOf(stats)) : '—') + '</b>整体平均</p></div>' +
    '<div class="chart-wrap" id="chart-rate"></div></section>';

  /* 排名走势 */
  html += '<section class="chart-card tone-teal"><div class="chart-head"><div><h3>排名走势</h3><p class="chart-sub">纵轴反转 · 越往上名次越靠前</p></div>' +
    segOpts([['class', '班级'], ['grade', '年级']], state.rankMode, 'rank-mode') + '</div>' +
    '<div class="chart-wrap" id="chart-rank"></div></section>';

  html += '<p class="about" style="text-align:center;margin-top:20px">所有图表与结论按筛选范围重算，不混合不同考试口径</p>';
  return html;
}

function avgOf(stats) {
  if (!stats.length) return 0;
  var sum = 0;
  stats.forEach(function (s) { sum += s.rate; });
  return sum / stats.length;
}
