<style>
/* ============================================================
   成绩簿 · 视觉系统
   纸面底色 / 账本式分隔线 / 唯一强调蓝 + 目标琥珀刻度
   ============================================================ */

:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;

  --paper:#eff0eb;
  --surface:#fcfcf9;
  --surface-2:#f4f5f0;
  --ink:#151814;
  --ink-2:#3e443d;
  --muted:#6c736b;
  --rule:#d8dad1;
  --rule-soft:#e4e6dc;

  --blue:#1f46c4;
  --blue-soft:#e8ecf8;
  --red:#b23a2d;
  --red-soft:#f7e7e3;
  --amber:#88651f;
  --amber-soft:#f4ebd8;
  --green:#1d6b47;
  --green-soft:#e2efe7;

  --shadow: 0 1px 0 rgba(21,24,20,.03), 0 18px 40px -34px rgba(21,24,20,.45);
  --r: 16px;
  --r-s: 12px;
}

[data-theme="dark"]{
  --paper:#0e100e;
  --surface:#171a16;
  --surface-2:#1e211c;
  --ink:#eaece5;
  --ink-2:#b4b9b0;
  --muted:#848b82;
  --rule:#2b2f29;
  --rule-soft:#242822;

  --blue:#93a9ff;
  --blue-soft:#1b2340;
  --red:#f09183;
  --red-soft:#2e1c18;
  --amber:#d9b673;
  --amber-soft:#2a2316;
  --green:#6fc79b;
  --green-soft:#17291f;

  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 18px 40px -30px rgba(0,0,0,.8);
}

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; }
a{ color:inherit; }
h1,h2,h3,p,ol,ul{ margin:0; }
svg{ overflow:visible; }

.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }

/* ---------- 页面骨架 ---------- */
.app{
  position:relative;
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  background:var(--paper);
}
@media (min-width:720px){
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(31,70,196,.06), transparent 60%),
      #e6e7e1;
  }
  [data-theme="dark"] body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(147,169,255,.06), transparent 60%),
      #080908;
  }
  .app{
    box-shadow:0 0 0 1px var(--rule-soft), 0 40px 90px -60px rgba(0,0,0,.55);
  }
}

.main{
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}

/* ---------- 标题 ---------- */
.view-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  padding:22px 20px 0;
}
.view-head .kicker{ margin:0 0 3px; }
h1{
  font-size:27px;
  line-height:1.15;
  font-weight:650;
  letter-spacing:-.015em;
}
.kicker{
  font-size:13px;
  color:var(--muted);
  letter-spacing:.015em;
  font-variant-numeric:tabular-nums;
}
.icon-btn{
  width:44px; height:44px;
  display:grid; place-items:center;
  border:1px solid var(--rule);
  border-radius:12px;
  background:var(--surface);
  color:var(--ink);
  transition:transform .16s ease, background .16s ease;
}
.icon-btn:active{ transform:scale(.96); }
.icon-btn svg{ width:20px; height:20px; }

/* ---------- 目标进度（账本表头，不套卡片） ---------- */
.hero{
  margin:14px 20px 0;
  padding-top:14px;
  border-top:1px solid var(--rule);
}
.hero-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:12.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.hero-meta span:first-child{
  max-width:74%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.hero-score-row{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-top:5px;
}
.hero-score{
  font-size:47px;
  line-height:1.02;
  font-weight:700;
  letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;
}
.hero-score .unit{
  font-size:14px;
  font-weight:450;
  color:var(--muted);
  letter-spacing:0;
  margin-left:7px;
}
.hero-gap{ text-align:right; padding-bottom:5px; }
.gap-label{ display:block; font-size:11.5px; color:var(--muted); line-height:1.3; }
.gap-val{
  display:inline-block;
  font-size:21px;
  font-weight:650;
  line-height:1.2;
  color:var(--red);
  font-variant-numeric:tabular-nums;
}
.gap-val.over{ color:var(--blue); }
.gap-val small{ font-size:11.5px; font-weight:400; color:var(--muted); margin-left:2px; }

.track-area{ position:relative; margin-top:27px; padding-top:15px; }
.tick-label{
  position:absolute;
  top:0;
  font-size:11px;
  line-height:1.2;
  color:var(--amber);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.track{
  position:relative;
  height:7px;
  border-radius:4px;
  background:var(--rule-soft);
}
.track .fill{
  height:100%;
  width:0;
  border-radius:4px 0 0 4px;
  background:var(--blue);
  transition:width .65s cubic-bezier(.22,.8,.24,1);
}
.track .tick{
  position:absolute;
  top:-5px; bottom:-5px;
  width:1px;
  background:var(--amber);
}
.track .tick::after{
  content:"";
  position:absolute;
  top:-1px; left:-2px;
  width:5px; height:5px;
  border-radius:50%;
  background:var(--amber);
}
.hero-foot{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
  font-size:12.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.hero-foot b{ color:var(--ink-2); font-weight:600; }
.hr2{
  height:4px;
  margin:16px 20px 0;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
}

/* ---------- 区块标题 ---------- */
.sec{ margin-top:27px; }
.sec-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  padding:0 20px;
  margin-bottom:9px;
}
.sec-head h2{
  font-size:15px;
  font-weight:650;
  letter-spacing:.005em;
}
.sec-note{
  font-size:12px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  text-align:right;
}

/* ---------- 面板与卡片 ---------- */
.panel{
  margin:0 20px;
  background:var(--surface);
  border:1px solid var(--rule-soft);
  border-radius:var(--r-s);
  overflow:hidden;
}
.card{
  margin:0 20px;
  background:var(--surface);
  border:1px solid var(--rule-soft);
  border-radius:var(--r);
  padding:16px;
  box-shadow:var(--shadow);
}

/* ---------- 最新成绩 ---------- */
.srow{
  display:grid;
  grid-template-columns:68px 1fr 36px 30px 43px;
  align-items:center;
  gap:7px;
  min-height:44px;
  padding:7px 14px;
}
.srow + .srow{ border-top:1px solid var(--rule-soft); }
.sname{
  display:flex;
  align-items:center;
  gap:3px;
  font-size:14px;
  font-weight:550;
  white-space:nowrap;
  min-width:0;
}
.sname .mark{
  font-size:9px;
  line-height:1.3;
  color:var(--amber);
  border:1px solid var(--amber);
  border-radius:3px;
  padding:0 2px;
  font-weight:500;
  flex:0 0 auto;
}
.bullet{
  position:relative;
  height:5px;
  border-radius:3px;
  background:var(--rule-soft);
  min-width:0;
}
.bullet .fill{
  height:100%;
  width:0;
  border-radius:3px;
  background:var(--blue);
  transition:width .55s cubic-bezier(.22,.8,.24,1);
}
.bullet .fill.miss{ background:var(--red); }
.bullet .tick{
  position:absolute;
  top:-2px; bottom:-2px;
  width:1px;
  background:var(--amber);
  opacity:.9;
}
.sval{
  font-size:15px;
  font-weight:650;
  text-align:right;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.sbase{
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.sgap{
  font-size:12px;
  text-align:right;
  color:var(--red);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.sgap{ color:var(--red); }
.sgap.met{ color:var(--blue); }

/* ---------- 短板提示条 ---------- */
.insight-strip{
  width:100%;
  margin:18px 20px 0;
  width:calc(100% - 40px);
  padding:11px 0 0;
  border-top:1px solid var(--rule);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  text-align:left;
}
.insight-strip .k{
  display:block;
  font-size:11px;
  letter-spacing:.13em;
  color:var(--amber);
  margin-bottom:3px;
}
.insight-strip strong{
  font-size:14px;
  font-weight:550;
  line-height:1.4;
}
.insight-strip strong b{ font-weight:700; }
.insight-strip .arrow{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
  padding-bottom:2px;
}

/* ---------- 排名 ---------- */
.rank{ padding:4px 16px 12px; }
.rank-row{ padding:9px 0; border-bottom:1px solid var(--rule-soft); }
.rank-row:last-of-type{ border-bottom:0; }
.rank-line{
  display:flex;
  align-items:baseline;
  gap:6px;
}
.rlabel{
  font-size:12px;
  color:var(--muted);
  width:30px;
  flex:0 0 auto;
}
.rval{
  font-size:22px;
  line-height:1.1;
  font-weight:700;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.rof{
  font-size:12px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.rpct{
  margin-left:auto;
  font-size:11.5px;
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.ptrack{
  position:relative;
  height:3px;
  margin-top:8px;
  border-radius:2px;
  background:var(--rule-soft);
}
.ptrack .pmark{
  position:absolute;
  top:-3px;
  width:2px;
  height:9px;
  border-radius:1px;
  background:var(--ink-2);
}
.rank-foot{
  display:flex;
  align-items:center;
  gap:5px;
  padding-top:10px;
  font-size:12px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.up{ color:var(--green); font-weight:650; }
.down{ color:var(--red); font-weight:650; }

/* ---------- 图表卡 ---------- */
.chart-card{
  margin:0 20px;
  padding:15px 13px 10px;
  background:var(--surface);
  border:1px solid var(--rule-soft);
  border-radius:var(--r);
}
.chart-card + .chart-card{ margin-top:12px; }
.chart-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  padding:0 4px 2px;
}
.chart-head h3{ font-size:14px; font-weight:650; }
.chart-sub{
  margin-top:2px;
  font-size:11.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.chart-stat{
  font-size:12px;
  color:var(--muted);
  text-align:right;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.chart-stat b{ display:block; font-size:14px; color:var(--ink); font-weight:650; }
.chart-wrap{ position:relative; width:100%; touch-action:pan-y; }
.chart-wrap svg{ display:block; width:100%; height:auto; }
.chart-hint{
  padding:2px 4px 2px;
  font-size:11px;
  color:var(--muted);
  text-align:center;
}
.chart-tip{
  position:absolute;
  top:4px;
  left:0;
  z-index:3;
  min-width:106px;
  max-width:210px;
  padding:7px 9px;
  border:1px solid var(--rule);
  border-radius:9px;
  background:var(--surface);
  box-shadow:0 10px 24px -16px rgba(0,0,0,.5);
  pointer-events:none;
  opacity:0;
  transform:translateX(-50%);
  transition:opacity .12s ease;
}
.chart-tip.on{ opacity:1; }
.chart-tip .tt{
  font-size:10.5px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.chart-tip .tm{
  margin-top:1px;
  font-size:15px;
  font-weight:650;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.chart-tip .ts{
  font-size:10.5px;
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.chart-cross{
  position:absolute;
  top:28px;
  bottom:30px;
  width:1px;
  background:var(--rule);
  pointer-events:none;
  opacity:0;
}
.chart-wrap.on .chart-cross{ opacity:1; }

/* SVG 图表元素 */
.c-grid{ stroke:var(--rule-soft); stroke-width:1; }
.c-axis{ fill:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums; }
.c-value{ fill:var(--ink); font-size:12px; font-weight:650; font-variant-numeric:tabular-nums; }
.c-small{ fill:var(--muted); font-size:10px; font-variant-numeric:tabular-nums; }
.c-target{ stroke:var(--amber); stroke-width:1; stroke-dasharray:4 4; opacity:.8; }
.c-target-label{ fill:var(--amber); font-size:10.5px; font-variant-numeric:tabular-nums; }
.c-line{ stroke:var(--blue); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.c-area{ fill:var(--blue); opacity:.05; }
.c-dot{ fill:var(--blue); }
.c-dot-open{ fill:var(--surface); stroke:var(--blue); stroke-width:1.5; }
.c-dot-last{ fill:var(--blue); stroke:var(--surface); stroke-width:2; }
.c-rank-line{ stroke:var(--ink); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.c-rank-dot{ fill:var(--ink); }
.c-rank-last{ fill:var(--blue); stroke:var(--surface); stroke-width:2; }
.c-bar-met{ fill:var(--blue); }
.c-bar-miss{ fill:var(--red); }
.c-bar-target{ stroke:var(--amber); stroke-width:1.4; opacity:.95; }
.c-bar-baseline{ stroke:var(--rule); stroke-width:1; }

/* ---------- 筛选 ---------- */
.filter-card{
  margin:0 20px;
  padding:6px 16px 12px;
  background:var(--surface);
  border:1px solid var(--rule-soft);
  border-radius:var(--r);
}
.filter-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--rule-soft);
  min-height:44px;
}
.filter-row:last-of-type{ border-bottom:0; }
.filter-lab{
  flex:0 0 34px;
  font-size:12px;
  color:var(--muted);
}
.scroll-x{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:1px 0;
  scrollbar-width:none;
  min-width:0;
}
.scroll-x::-webkit-scrollbar{ display:none; }
.scope-line{
  padding-top:8px;
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.scope-line .warn{ color:var(--amber); }

/* ---------- chips / segmented ---------- */
.chip{
  flex:0 0 auto;
  height:30px;
  padding:0 12px;
  border:1px solid var(--rule);
  border-radius:999px;
  background:transparent;
  color:var(--ink-2);
  font-size:12.5px;
  white-space:nowrap;
  transition:background .14s ease, color .14s ease, border-color .14s ease;
}
.chip[aria-pressed="true"]{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--surface);
  font-weight:550;
}
.seg{
  display:inline-flex;
  padding:2px;
  border:1px solid var(--rule-soft);
  border-radius:10px;
  background:var(--surface-2);
}
.seg button{
  height:28px;
  padding:0 11px;
  border-radius:8px;
  font-size:12.5px;
  color:var(--muted);
  white-space:nowrap;
}
.seg button[aria-pressed="true"]{
  background:var(--surface);
  color:var(--ink);
  font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}

/* ---------- 结论卡 ---------- */
.insight{ padding:16px 16px 14px; }
.ins-lead{
  font-size:12px;
  letter-spacing:.1em;
  color:var(--amber);
  margin-bottom:6px;
}
.ins-title{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
}
.ins-title h2{
  font-size:22px;
  font-weight:700;
  letter-spacing:-.01em;
}
.ins-title .gap-pill{
  font-size:12px;
  color:var(--red);
  border:1px solid var(--red);
  border-radius:999px;
  padding:1px 7px;
  font-variant-numeric:tabular-nums;
}
.ins-sub{
  margin-top:3px;
  font-size:12px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.ins-list{ margin-top:14px; border-top:1px solid var(--rule-soft); }
.ins-row{
  display:grid;
  grid-template-columns:22px 1fr;
  gap:9px;
  padding:11px 0;
  border-bottom:1px solid var(--rule-soft);
}
.idx{
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  padding-top:2px;
}
.ins-row .h{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
}
.ins-row .h b{ font-size:14px; font-weight:650; }
.ins-row .h .d{
  font-size:11.5px;
  color:var(--red);
  font-variant-numeric:tabular-nums;
}
.ins-row .h .s{
  font-size:11.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.ins-row .tip{
  margin-top:3px;
  font-size:12px;
  color:var(--ink-2);
  line-height:1.5;
}
.keep{ margin-top:14px; }
.keep h3{
  font-size:12px;
  font-weight:600;
  color:var(--blue);
  letter-spacing:.06em;
  margin-bottom:6px;
}
.keep-row{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
  padding:6px 0;
  border-bottom:1px solid var(--rule-soft);
  font-size:12.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.keep-row b{ font-size:13.5px; color:var(--ink); font-weight:650; }
.keep-row .ok{ color:var(--blue); }
.rule-note{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--rule-soft);
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
}

/* ---------- 记录列表 ---------- */
.rec-list{
  margin:10px 20px 0;
  background:var(--surface);
  border:1px solid var(--rule-soft);
  border-radius:var(--r-s);
  overflow:hidden;
}
.rec{
  display:grid;
  grid-template-columns:50px 1fr auto;
  gap:12px;
  width:100%;
  padding:12px 14px;
  text-align:left;
  align-items:start;
  transition:background .14s ease;
}
.rec:active{ background:var(--surface-2); }
.rec + .rec{ border-top:1px solid var(--rule-soft); }
.rec-date{
  padding-right:10px;
  border-right:1px solid var(--rule-soft);
  align-self:stretch;
}
.rec-date b{
  display:block;
  font-size:15px;
  font-weight:650;
  letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
}
.rec-date span{
  display:block;
  font-size:10.5px;
  color:var(--muted);
  margin-top:1px;
}
.rec-name{
  font-size:14px;
  font-weight:600;
  line-height:1.35;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.rec-meta{
  margin-top:4px;
  font-size:11.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:4px;
}
.rec-meta .sep{ opacity:.5; }
.rec-score{
  text-align:right;
  font-variant-numeric:tabular-nums;
  padding-top:1px;
}
.rec-score b{
  display:block;
  font-size:20px;
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1.2;
}
.rec-score span{
  font-size:10px;
  color:var(--muted);
}
.tag{
  display:inline-block;
  font-size:9.5px;
  line-height:1.5;
  padding:0 4px;
  border-radius:3px;
  border:1px solid var(--rule);
  color:var(--muted);
  font-weight:500;
  white-space:nowrap;
}
.tag.amber{ color:var(--amber); border-color:var(--amber); }
.tag.red{ color:var(--red); border-color:var(--red); }
.tag.blue{ color:var(--blue); border-color:var(--blue); }

/* ---------- 表单 ---------- */
.form-card{
  margin:0 20px;
  padding:2px 16px 16px;
  background:var(--surface);
  border:1px solid var(--rule-soft);
  border-radius:var(--r);
}
.fblock{ padding:14px 0 4px; }
.fblock + .fblock{ border-top:1px solid var(--rule-soft); }
.fblock-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:2px;
}
.fblock-head h2{ font-size:13px; font-weight:600; color:var(--ink-2); }
.fblock-head .live{
  font-size:11.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.frow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:46px;
  padding:5px 0;
}
.frow > span{ font-size:14px; color:var(--ink); white-space:nowrap; }
.frow .sub{ font-size:11px; color:var(--muted); }
.input{
  width:100%;
  height:42px;
  padding:0 12px;
  border:1px solid var(--rule);
  border-radius:10px;
  background:var(--surface-2);
  font-size:16px;
  color:var(--ink);
  min-width:0;
}
.input:focus{
  outline:none;
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}
.input::placeholder{ color:var(--muted); }
.input.invalid{ border-color:var(--red); }
.date-input{ width:150px; flex:0 0 150px; padding-right:4px; }
.name-input{ flex:1; min-width:0; }

.srow-form{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:8px;
  min-height:52px;
  padding:6px 0;
  border-bottom:1px solid var(--rule-soft);
}
.srow-form:last-child{ border-bottom:0; }
.sf-name{ min-width:0; }
.sf-name .nm{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:14px;
  font-weight:550;
}
.sf-name .hint{
  display:block;
  font-size:10.5px;
  color:var(--muted);
  margin-top:1px;
}
.sf-inputs{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}
.score-in{
  width:62px;
  height:40px;
  border:1px solid var(--rule);
  border-radius:9px;
  background:var(--surface-2);
  text-align:center;
  font-size:16px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  padding:0 4px;
  min-width:0;
}
.score-in:focus{
  outline:none;
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}
.score-in.invalid{ border-color:var(--red); }
.score-in::-webkit-outer-spin-button,
.score-in::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.score-in[type="number"]{ -moz-appearance:textfield; }
.full-mark{
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.mini-field{
  position:relative;
  width:66px;
  flex:0 0 auto;
}
.mini-field .cap{
  position:absolute;
  top:3px;
  left:0;
  right:0;
  text-align:center;
  font-size:9px;
  line-height:1.2;
  color:var(--muted);
  pointer-events:none;
}
.mini-field .score-in{
  width:100%;
  height:42px;
  padding-top:12px;
  font-size:15px;
}
.rank-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:4px;
}
.rank-cell{
  border:1px solid var(--rule-soft);
  border-radius:11px;
  padding:8px 10px 10px;
  background:var(--surface-2);
}
.rank-cell .cap{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-bottom:5px;
}
.rank-cell .pair{
  display:flex;
  align-items:center;
  gap:5px;
}
.rank-cell input{
  width:100%;
  height:34px;
  border:0;
  border-bottom:1px solid var(--rule);
  background:transparent;
  text-align:center;
  font-size:16px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  min-width:0;
}
.rank-cell input:focus{ outline:none; border-color:var(--blue); }
.rank-cell .slash{ font-size:11px; color:var(--muted); }
.form-actions{ padding:18px 20px 0; }
.btn-primary{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:52px;
  border-radius:13px;
  background:var(--ink);
  color:var(--surface);
  font-size:16px;
  font-weight:600;
  letter-spacing:.01em;
  transition:transform .16s ease, opacity .16s ease;
}
.btn-primary:active{ transform:scale(.985); }
.btn-primary:disabled{ opacity:.4; }
.btn-line{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  height:42px;
  padding:0 16px;
  border:1px solid var(--rule);
  border-radius:11px;
  background:var(--surface);
  color:var(--ink);
  font-size:13.5px;
  font-weight:550;
}
.btn-quiet{
  height:42px;
  padding:0 12px;
  color:var(--muted);
  font-size:13px;
}
.form-error{
  margin:10px 20px 0;
  padding:9px 12px;
  border:1px solid var(--red);
  border-radius:9px;
  color:var(--red);
  font-size:12.5px;
  background:var(--red-soft);
}
.edit-banner{
  margin:12px 20px 0;
  padding:9px 12px;
  border:1px solid var(--amber);
  border-radius:10px;
  background:var(--amber-soft);
  font-size:12px;
  color:var(--ink-2);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.edit-banner b{ color:var(--ink); }
.edit-banner button{ font-size:12px; color:var(--amber); font-weight:600; }

/* ---------- 设置 ---------- */
.set-block{ padding:4px 16px 12px; }
.set-block h2{
  font-size:13px;
  font-weight:600;
  color:var(--ink-2);
  padding:12px 0 2px;
}
.set-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  width:100%;
  min-height:48px;
  border-top:1px solid var(--rule-soft);
  text-align:left;
  font-size:14px;
}
.set-row > span:first-child{ color:var(--ink); }
.set-row .v{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:13px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.set-row .v b{ color:var(--ink); font-weight:600; }
.set-row svg{ width:15px; height:15px; color:var(--muted); flex:0 0 auto; }
.set-row.danger > span:first-child{ color:var(--red); }
.set-note{
  font-size:11.5px;
  color:var(--muted);
  line-height:1.6;
  padding:2px 0 8px;
}
.set-note b{ color:var(--ink-2); font-weight:550; }
.num-input{
  width:76px;
  height:34px;
  border:1px solid var(--rule);
  border-radius:8px;
  background:var(--surface-2);
  text-align:center;
  font-size:16px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.num-input:focus{ outline:none; border-color:var(--blue); }
.theme-seg{ flex:0 0 auto; }
.target-edit{
  display:flex;
  align-items:baseline;
  gap:6px;
  padding:4px 0 10px;
}
.target-edit input{
  width:112px;
  border:0;
  border-bottom:1px solid var(--rule);
  background:transparent;
  font-size:34px;
  font-weight:700;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  padding:0 0 2px;
}
.target-edit input:focus{ outline:none; border-color:var(--blue); }
.target-edit .of{ font-size:12px; color:var(--muted); }
.target-chips{ display:flex; gap:6px; flex-wrap:wrap; }
.tpreview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  margin-top:10px;
  background:var(--rule-soft);
  border:1px solid var(--rule-soft);
  border-radius:10px;
  overflow:hidden;
}
.tpreview div{
  background:var(--surface);
  padding:8px 9px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:4px;
  font-size:11.5px;
  color:var(--muted);
}
.tpreview b{ font-size:13px; color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums; }
.about{
  padding:16px;
  font-size:11.5px;
  color:var(--muted);
  line-height:1.7;
}
.about .brandline{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  color:var(--ink);
}
.about .brandline b{ font-size:14px; font-weight:700; letter-spacing:.02em; }
.about p + p{ margin-top:5px; }

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:24;
  margin:0 auto;
  max-width:480px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:5px 8px calc(5px + env(safe-area-inset-bottom,0px));
  background:var(--surface);
  border-top:1px solid var(--rule-soft);
  box-shadow:0 -10px 30px -26px rgba(0,0,0,.4);
}
.tab{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  height:50px;
  border-radius:10px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.02em;
}
.tab svg{ width:20px; height:20px; }
.tab.active{ color:var(--blue); font-weight:600; }
.tab.active::before{
  content:"";
  position:absolute;
  top:-6px;
  width:16px; height:2px;
  border-radius:1px;
  background:var(--blue);
}

/* ---------- 空状态 ---------- */
.empty{
  margin:0 20px;
  padding:34px 20px 30px;
  text-align:center;
  border:1px dashed var(--rule);
  border-radius:var(--r-s);
  background:var(--surface);
}
.empty .glyph{
  width:42px; height:42px;
  margin:0 auto 12px;
  border:1px solid var(--rule);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--muted);
}
.empty .glyph svg{ width:19px; height:19px; }
.empty h3{ font-size:14px; font-weight:600; margin-bottom:4px; }
.empty p{ font-size:12.5px; color:var(--muted); max-width:270px; margin:0 auto; line-height:1.6; }
.empty .btn-line{ margin-top:14px; }

/* ---------- 引导 ---------- */
.ob{
  position:fixed;
  inset:0;
  z-index:50;
  background:var(--paper);
  overflow-y:auto;
  overscroll-behavior:contain;
}
.ob-inner{
  display:flex;
  flex-direction:column;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  margin:0 auto;
  padding:20px 20px calc(16px + env(safe-area-inset-bottom,0px));
}
.ob-brand{
  display:flex;
  align-items:center;
  gap:9px;
}
.ob-mark{
  width:30px; height:30px;
  border-radius:8px;
  background:var(--blue);
  display:grid;
  place-items:center;
  color:#fff;
}
.ob-mark svg{ width:17px; height:17px; }
.ob-brand b{ font-size:14px; font-weight:700; letter-spacing:.03em; }
.ob-brand span{ font-size:10.5px; color:var(--muted); margin-left:1px; }
.ob-steps{
  display:flex;
  gap:5px;
  margin-top:16px;
}
.ob-steps i{
  flex:1;
  height:3px;
  border-radius:2px;
  background:var(--rule);
  transition:background .2s ease;
}
.ob-steps i.on{ background:var(--blue); }
.ob-stepno{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-size:10.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.ob-q{ margin-top:24px; }
.ob-q h2{
  font-size:25px;
  line-height:1.35;
  font-weight:650;
  letter-spacing:-.02em;
}
.ob-q p{
  margin-top:7px;
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
}
.ob-body{ flex:1; margin-top:18px; }
.ob-foot{
  position:sticky;
  bottom:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding-top:14px;
  background:var(--paper);
}
.ob-foot .back{
  height:50px;
  padding:0 6px 0 0;
  font-size:13px;
  color:var(--muted);
  flex:0 0 auto;
}
.ob-foot .next{ flex:1; }

.gcard{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  padding:14px 15px;
  margin-bottom:9px;
  border:1px solid var(--rule);
  border-radius:13px;
  background:var(--surface);
  text-align:left;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.gcard[aria-pressed="true"]{
  border-color:var(--ink);
  box-shadow:0 0 0 1px var(--ink) inset;
}
.gnum{
  width:74px;
  flex:0 0 auto;
  font-size:25px;
  font-weight:700;
  letter-spacing:.02em;
}
.gsub{ font-size:12px; color:var(--muted); line-height:1.45; }
.gdot{
  width:17px; height:17px;
  flex:0 0 auto;
  margin-left:auto;
  border:1px solid var(--rule);
  border-radius:50%;
  display:grid;
  place-items:center;
}
.gdot svg{ width:9px; height:9px; opacity:0; }
.gcard[aria-pressed="true"] .gdot{ background:var(--ink); border-color:var(--ink); }
.gcard[aria-pressed="true"] .gdot svg{ opacity:1; color:var(--surface); }

.pgrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:14px;
}
.pcell{
  height:38px;
  border:1px solid var(--rule);
  border-radius:9px;
  background:var(--surface);
  font-size:12.5px;
  color:var(--ink-2);
  white-space:nowrap;
  transition:background .14s ease, color .14s ease;
}
.pcell[aria-pressed="true"]{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--surface);
  font-weight:600;
}
.pinfo{
  margin-top:12px;
  padding:11px 13px;
  border:1px solid var(--rule-soft);
  border-radius:11px;
  background:var(--surface-2);
  font-size:12px;
  color:var(--ink-2);
  line-height:1.6;
}
.pinfo b{ color:var(--ink); }
.pinfo .meta{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
  font-variant-numeric:tabular-nums;
}
.pinfo .meta b{ font-size:14px; }
.pinfo .note{ color:var(--muted); margin-top:2px; }

.switch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:11px 13px;
  border:1px solid var(--rule-soft);
  border-radius:12px;
  background:var(--surface);
  margin-bottom:13px;
  text-align:left;
  width:100%;
}
.switch-row .t{ font-size:14px; font-weight:550; }
.switch-row .d{ font-size:11.5px; color:var(--muted); margin-top:1px; }
.switch{
  position:relative;
  width:44px; height:26px;
  flex:0 0 auto;
  border-radius:14px;
  background:var(--rule);
  transition:background .18s ease;
}
.switch::after{
  content:"";
  position:absolute;
  top:3px; left:3px;
  width:20px; height:20px;
  border-radius:50%;
  background:var(--surface);
  box-shadow:0 1px 2px rgba(0,0,0,.18);
  transition:transform .18s ease;
}
.switch[aria-checked="true"]{ background:var(--blue); }
.switch[aria-checked="true"]::after{ transform:translateX(18px); }

.first-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.big-chip{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  height:60px;
  border:1px solid var(--rule);
  border-radius:12px;
  background:var(--surface);
  font-size:17px;
  font-weight:600;
}
.big-chip small{ font-size:10.5px; font-weight:400; color:var(--muted); }
.big-chip[aria-pressed="true"]{
  border-color:var(--ink);
  background:var(--ink);
  color:var(--surface);
}
.big-chip[aria-pressed="true"] small{ color:var(--surface); opacity:.66; }
.ob-sublab{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin:16px 0 7px;
  font-size:12px;
  color:var(--muted);
}
.ob-sublab b{ font-size:12px; color:var(--ink-2); font-weight:600; }
.ob-sublab .count{ font-variant-numeric:tabular-nums; }
.elect-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.elect-grid .big-chip{ height:48px; font-size:15px; flex-direction:row; gap:6px; }
.combo-line{
  margin-top:14px;
  padding:12px 14px;
  border:1px solid var(--rule-soft);
  border-radius:12px;
  background:var(--surface);
  display:flex;
  align-items:baseline;
  gap:8px;
  font-size:13px;
  color:var(--muted);
}
.combo-line b{ font-size:16px; color:var(--ink); font-weight:700; letter-spacing:.03em; }
.track-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.track-card{
  padding:16px;
  border:1px solid var(--rule);
  border-radius:12px;
  background:var(--surface);
  text-align:left;
}
.track-card[aria-pressed="true"]{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; }
.track-card b{ font-size:17px; }
.track-card span{ display:block; font-size:11.5px; color:var(--muted); margin-top:2px; }

.target-big{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:8px;
  margin:8px 0 10px;
}
.target-big input{
  width:164px;
  border:0;
  border-bottom:1px solid var(--rule);
  background:transparent;
  text-align:center;
  font-size:44px;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
  padding:0;
}
.target-big input:focus{ outline:none; border-color:var(--blue); }
.target-big .of{ font-size:14px; color:var(--muted); }
.target-rate{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  margin-bottom:12px;
}
.target-rate b{ color:var(--ink-2); font-weight:600; }
.ob-note{
  margin-top:14px;
  font-size:11.5px;
  color:var(--muted);
  line-height:1.6;
}
.size-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.size-cell{
  border:1px solid var(--rule-soft);
  border-radius:11px;
  padding:8px 10px;
  background:var(--surface);
}
.size-cell .cap{ display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
.size-cell input{
  width:100%;
  height:32px;
  border:0;
  border-bottom:1px solid var(--rule);
  background:transparent;
  font-size:16px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  text-align:center;
}
.size-cell input:focus{ outline:none; border-color:var(--blue); }

/* ---------- 浮层 / 弹层 ---------- */
.layer{ position:relative; z-index:60; }
.overlay{
  position:fixed;
  inset:0;
  z-index:60;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(10,12,9,.42);
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}
.sheet{
  width:100%;
  max-width:480px;
  max-height:90vh;
  max-height:90dvh;
  overflow-y:auto;
  overscroll-behavior:contain;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(20px);
  opacity:0;
  animation:sheetIn .26s cubic-bezier(.22,.8,.24,1) forwards;
}
.sheet-grip{
  width:36px; height:4px;
  margin:0 auto 12px;
  border-radius:2px;
  background:var(--rule);
}
.sheet-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.sheet-close{
  width:34px; height:34px;
  flex:0 0 auto;
  display:grid; place-items:center;
  border-radius:9px;
  color:var(--muted);
  border:1px solid var(--rule-soft);
}
.sheet-close svg{ width:15px; height:15px; }
.dialog{
  align-self:center;
  width:calc(100% - 44px);
  max-width:360px;
  margin:0 auto;
  background:var(--surface);
  border-radius:18px;
  padding:20px;
  animation:dlgIn .2s cubic-bezier(.22,.8,.24,1) both;
}
.dialog h2{ font-size:19px; font-weight:650; letter-spacing:-.01em; }
.dialog p{ margin-top:7px; font-size:12.5px; color:var(--muted); line-height:1.6; }
.dialog .acts{
  display:flex;
  gap:8px;
  margin-top:20px;
}
.dialog .acts > *{ flex:1; }
@keyframes sheetIn{ to{ transform:translateY(0); opacity:1; } }
@keyframes dlgIn{ from{ transform:scale(.97); opacity:0; } to{ transform:scale(1); opacity:1; } }

/* ---------- 考试详情 ---------- */
.detail-kicker{
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  font-variant-numeric:tabular-nums;
}
.detail-title{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.01em;
  margin-top:3px;
  line-height:1.35;
}
.detail-hero{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  padding:14px 0 12px;
  margin-top:10px;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
}
.detail-score{
  font-size:38px;
  line-height:1.05;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.detail-score .unit{ font-size:12px; color:var(--muted); font-weight:400; margin-left:5px; letter-spacing:0; }
.detail-side{ text-align:right; font-size:11.5px; color:var(--muted); line-height:1.5; }
.detail-side b{ display:block; font-size:14px; font-weight:650; font-variant-numeric:tabular-nums; }
.detail-side b.miss{ color:var(--red); }
.detail-side b.met{ color:var(--blue); }
.dt{
  width:100%;
  border-collapse:collapse;
  margin-top:4px;
  table-layout:fixed;
}
.dt th{
  font-size:10.5px;
  color:var(--muted);
  font-weight:500;
  text-align:right;
  padding:8px 0 6px;
  border-bottom:1px solid var(--rule-soft);
}
.dt th:first-child{ text-align:left; }
.dt td{
  padding:8px 0;
  border-bottom:1px solid var(--rule-soft);
  font-size:13px;
  text-align:right;
  font-variant-numeric:tabular-nums;
  vertical-align:middle;
}
.dt td:first-child{ text-align:left; }
.dt .ds-name{ display:flex; align-items:center; gap:3px; font-weight:550; }
.dt .ds-name .mark{
  font-size:9px;
  border:1px solid var(--amber);
  color:var(--amber);
  border-radius:3px;
  padding:0 2px;
  font-weight:500;
}
.dt .ds-raw{
  display:block;
  font-size:9.5px;
  color:var(--muted);
  font-weight:400;
  margin-top:1px;
}
.dt .score{ font-weight:650; font-size:14px; }
.dt .score small{ font-size:10px; color:var(--muted); font-weight:400; margin-left:1px; }
.dt .gap{ color:var(--red); }
.dt .gap.met{ color:var(--blue); }
.dt .rate{ color:var(--red); }
.dt .rate.met{ color:var(--blue); }
.dt .lag{
  display:inline-block;
  margin-left:3px;
  font-size:8.5px;
  color:var(--red);
  border:1px solid var(--red);
  border-radius:2px;
  padding:0 2px;
  vertical-align:1px;
}
.detail-rank{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  margin-top:14px;
  background:var(--rule-soft);
  border:1px solid var(--rule-soft);
  border-radius:10px;
  overflow:hidden;
}
.detail-rank div{ background:var(--surface); padding:9px 11px; }
.detail-rank .cap{ font-size:10.5px; color:var(--muted); }
.detail-rank .v{ font-size:15px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:1px; }
.detail-rank .v small{ font-size:10px; color:var(--muted); font-weight:400; }
.detail-note{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--rule-soft);
  font-size:12.5px;
  color:var(--ink-2);
}
.detail-note span{ color:var(--muted); font-size:11px; margin-right:6px; }
.detail-acts{
  display:flex;
  gap:8px;
  margin-top:16px;
}
.detail-acts .btn-line{ flex:1; }
.detail-acts .del{ color:var(--red); border-color:var(--red-soft); }

/* ---------- 恢复预览 ---------- */
.preview-box{
  margin-top:12px;
  border:1px solid var(--rule-soft);
  border-radius:12px;
  overflow:hidden;
}
.preview-box .prow{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  padding:8px 12px;
  border-bottom:1px solid var(--rule-soft);
  font-size:12px;
  color:var(--muted);
}
.preview-box .prow:last-child{ border-bottom:0; }
.preview-box .prow b{ font-size:12.5px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; text-align:right; }
.check{
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin-top:10px;
  font-size:12px;
  line-height:1.55;
  color:var(--ink-2);
}
.check svg{ width:14px; height:14px; flex:0 0 auto; margin-top:2px; color:var(--green); }
.check.warn svg{ color:var(--amber); }
.check.err svg{ color:var(--red); }
.check.err{ color:var(--red); }

/* ---------- JSON 查看 ---------- */
.json-box{
  margin-top:12px;
  max-height:46vh;
  overflow:auto;
  border:1px solid var(--rule-soft);
  border-radius:10px;
  background:var(--surface-2);
  padding:10px;
  font-family:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size:11px;
  line-height:1.55;
  white-space:pre;
  color:var(--ink-2);
}

/* ---------- toast ---------- */
.toast{
  position:fixed;
  left:50%;
  bottom:calc(90px + env(safe-area-inset-bottom,0px));
  z-index:80;
  transform:translate(-50%,8px);
  max-width:82vw;
  padding:9px 15px;
  border-radius:999px;
  background:var(--ink);
  color:var(--surface);
  font-size:12.5px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
}
.toast.on{ opacity:1; transform:translate(-50%,0); }

/* ---------- 存储警告 ---------- */
.storage-warn{
  margin:12px 20px 0;
  padding:9px 12px;
  border:1px solid var(--amber);
  border-radius:10px;
  background:var(--amber-soft);
  font-size:11.5px;
  color:var(--ink-2);
  line-height:1.5;
}

/* ---------- 无数据 ---------- */
.center-note{
  padding:30px 20px;
  text-align:center;
  font-size:12.5px;
  color:var(--muted);
}

@media (max-width:359px){
  .srow{ grid-template-columns:60px 1fr 32px 26px 38px; gap:5px; padding:7px 11px; }
  .hero-score{ font-size:42px; }
  .pgrid{ grid-template-columns:repeat(3,1fr); }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

/* ---------- 补充分件 ---------- */
.hero-note{
  margin-top:7px;
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
}
.hero-meta .tag{ margin-left:5px; vertical-align:1px; }
.chart-legend{
  display:flex;
  gap:13px;
  justify-content:flex-end;
  padding:0 6px 3px;
  font-size:10.5px;
  color:var(--muted);
}
.chart-legend .dot{
  display:inline-block;
  width:6px; height:6px;
  border-radius:50%;
  margin-right:4px;
  vertical-align:1px;
}
.chart-legend .dot.met{ background:var(--blue); }
.chart-legend .dot.miss{ background:var(--red); }
.chart-legend .tick{
  display:inline-block;
  width:9px; height:1px;
  background:var(--amber);
  margin-right:5px;
  vertical-align:3px;
}
body.lock{ overflow:hidden; }
.c-bar-met,.c-bar-miss{
  transform-box:fill-box;
  transform-origin:bottom;
  animation:barGrow .55s cubic-bezier(.22,.8,.24,1) both;
}
@keyframes barGrow{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type="number"]{ -moz-appearance:textfield; }
.score-in{ width:76px; }
.sheet .gcard:last-child{ margin-bottom:0; }
.dialog .btn-primary:active{ transform:scale(.985); }
@media (max-width:390px){
  .chart-legend{ justify-content:flex-start; }
}
.ob-index{
  margin-top:22px;
  border-top:1px solid var(--line);
  padding-top:14px;
}
.ob-index .ix-t{
  font-size:10.5px;
  letter-spacing:.08em;
  color:var(--muted);
  margin:0 0 4px;
}
.ob-index .ix-row{
  display:grid;
  grid-template-columns:64px 1fr;
  gap:10px;
  padding:7px 0;
  border-bottom:1px dotted var(--line);
  font-size:12px;
  line-height:1.5;
}
.ob-index .ix-row span{ color:var(--muted); font-size:11px; }
.ob-index .ix-row b{ font-weight:500; color:var(--ink-soft); }
.ob-index .ix-note{
  margin:10px 0 0;
  font-size:10px;
  letter-spacing:.04em;
  color:var(--faint);
}

.chip-wrap{ display:flex; flex-wrap:wrap; gap:7px; padding:0 20px 9px; }
.chip-wrap .chip{ margin:0; }

.type-chip{ padding:0 10px; }

.rec-chips{ gap:6px; }
.rec-chips .chip{ padding:0 8px; }

.ic{ width:16px; height:16px; flex:0 0 auto; vertical-align:middle; }
body.lock .toast{ bottom:auto; top:calc(14px + env(safe-area-inset-top)); }

.empty-screen{
  min-height:calc(100dvh - 190px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.sgap.absent{ color:var(--muted); font-weight:400; }
@media (min-width:460px){
  .filter-row .chip-wrap{ padding:0; gap:5px; }
  .filter-row .chip-wrap .chip{ padding:0 8px; }
}

/* ============================================================
   成绩簿 · v2 视觉增强层
   纸面账本 + 科目索引色 / 分层纸卡 / 丝滑动效
   ============================================================ */

:root{
  --font-display:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong","SimSun",serif;

  --paper:#f2efe6;
  --surface:#fffdf7;
  --surface-2:#f7f3e9;
  --ink:#171915;
  --ink-2:#3c423a;
  --muted:#70766d;
  --rule:#dad8ce;
  --rule-soft:#e8e5da;
  --fiber:rgba(23,25,21,.018);
  --wash:#e9edfb;

  --blue:#2b50cf;
  --blue-2:#4f74f0;
  --blue-soft:#e9edfb;
  --red:#bd4631;
  --red-soft:#f9e8e2;
  --amber:#9c7424;
  --amber-soft:#f6ecd7;
  --green:#1e7450;
  --green-soft:#e4f1e9;
  --violet:#6847bc;
  --violet-soft:#efeafb;
  --teal:#1f777e;
  --teal-soft:#e3f1f1;
  --rose:#b24466;
  --rose-soft:#f7e7ed;
  --sky:#2d74a8;
  --sky-soft:#e7f0f7;

  --s1:#a27322; --s1-soft:#f6ecd9;
  --s2:#2b50cf; --s2-soft:#e9edfb;
  --s3:#6847bc; --s3-soft:#efeafb;
  --s4:#1f777e; --s4-soft:#e3f1f1;
  --s5:#b24466; --s5-soft:#f7e7ed;
  --s6:#29714f; --s6-soft:#e4f1e9;
  --s7:#bd5a2f; --s7-soft:#f8e9df;
  --s8:#8a5a3a; --s8-soft:#f2e9e0;
  --s9:#2d74a8; --s9-soft:#e7f0f7;

  --btn:#1d3fb8;
  --btn-2:#2b50cf;

  --shadow-1:0 1px 2px rgba(24,26,20,.035), 0 12px 28px -24px rgba(24,26,20,.35);
  --shadow-2:0 2px 4px rgba(24,26,20,.04), 0 22px 46px -30px rgba(24,26,20,.45);
  --ease-out:cubic-bezier(.22,.86,.28,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}

[data-theme="dark"]{
  --paper:#0f1116;
  --surface:#181b20;
  --surface-2:#1f232a;
  --ink:#eceee8;
  --ink-2:#b7bbae;
  --muted:#868c81;
  --rule:#2d323a;
  --rule-soft:#242930;
  --fiber:rgba(255,255,255,.012);
  --wash:#161c2e;

  --blue:#9bb1ff;
  --blue-2:#bccbff;
  --blue-soft:#1a2340;
  --red:#f39a8b;
  --red-soft:#2f1d19;
  --amber:#e0bd7d;
  --amber-soft:#2b2416;
  --green:#78d0a5;
  --green-soft:#17291f;
  --violet:#b8a1ff;
  --violet-soft:#221b36;
  --teal:#7fd2d4;
  --teal-soft:#152a2b;
  --rose:#f09bb8;
  --rose-soft:#2c1a22;
  --sky:#8ec5e8;
  --sky-soft:#16242f;

  --s1:#e0bd7d; --s1-soft:#2b2416;
  --s2:#9bb1ff; --s2-soft:#1a2340;
  --s3:#b8a1ff; --s3-soft:#221b36;
  --s4:#7fd2d4; --s4-soft:#152a2b;
  --s5:#f09bb8; --s5-soft:#2c1a22;
  --s6:#78d0a5; --s6-soft:#17291f;
  --s7:#f0a37c; --s7-soft:#2d1e17;
  --s8:#d3a583; --s8-soft:#2a211b;
  --s9:#8ec5e8; --s9-soft:#16242f;

  --btn:#2448c8;
  --btn-2:#2b50cf;

  --shadow-1:0 1px 2px rgba(0,0,0,.18), 0 14px 30px -26px rgba(0,0,0,.9);
  --shadow-2:0 2px 4px rgba(0,0,0,.2), 0 24px 50px -30px rgba(0,0,0,.95);
  color-scheme:dark;
}

/* ---------- 纸面与桌面 ---------- */
body{
  background:var(--paper);
  transition:background-color .4s var(--ease-out);
}
.app{
  background:
    repeating-linear-gradient(0deg, var(--fiber) 0 1px, transparent 1px 4px),
    radial-gradient(120% 48% at 50% -8%, var(--wash) 0%, transparent 62%),
    linear-gradient(180deg, var(--surface) 0, var(--paper) 300px);
  transition:background-color .4s var(--ease-out);
}
.ob{
  background:
    repeating-linear-gradient(0deg, var(--fiber) 0 1px, transparent 1px 4px),
    radial-gradient(110% 42% at 50% 0%, var(--wash) 0%, transparent 60%),
    var(--paper);
}
@media (min-width:720px){
  body{
    background:
      radial-gradient(900px 560px at 50% -8%, rgba(43,80,207,.10), transparent 62%),
      radial-gradient(760px 520px at 86% 104%, rgba(104,71,188,.07), transparent 62%),
      #e8e3d7;
  }
  [data-theme="dark"] body{
    background:
      radial-gradient(900px 560px at 50% -8%, rgba(155,177,255,.055), transparent 62%),
      radial-gradient(760px 520px at 86% 104%, rgba(184,161,255,.045), transparent 62%),
      #08090c;
  }
  .app{
    box-shadow:
      0 0 0 1px var(--rule),
      0 48px 110px -56px rgba(36,28,16,.52),
      0 2px 0 rgba(255,255,255,.35) inset;
  }
}

/* ---------- 标题 / 模块索引色 ---------- */
body[data-view="overview"]{ --tone:var(--blue); --tone-soft:var(--blue-soft); }
body[data-view="records"]{ --tone:var(--amber); --tone-soft:var(--amber-soft); }
body[data-view="analysis"]{ --tone:var(--violet); --tone-soft:var(--violet-soft); }
body[data-view="settings"]{ --tone:var(--teal); --tone-soft:var(--teal-soft); }
body[data-view="onboarding"]{ --tone:var(--blue); --tone-soft:var(--blue-soft); }

.view-head{ padding:26px 20px 0; align-items:center; }
.view-head .kicker{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  letter-spacing:.015em;
  color:var(--muted);
}
.view-head .kicker::before{
  content:"";
  width:6px; height:6px;
  flex:0 0 auto;
  border-radius:50%;
  background:var(--tone,var(--blue));
  box-shadow:0 0 0 3px var(--tone-soft,var(--blue-soft));
}
.view-head h1{
  font-family:var(--font-display);
  font-size:31px;
  font-weight:700;
  letter-spacing:-.012em;
  margin-top:1px;
}
.icon-btn{
  background:var(--surface);
  border-color:var(--rule);
  border-radius:13px;
  box-shadow:var(--shadow-1);
  transition:transform .2s var(--ease-spring), box-shadow .2s var(--ease-out), background .2s;
}
.icon-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-2); }
.icon-btn:active{ transform:scale(.94); }

.sec-head{ margin-bottom:10px; }
.sec-head .sec-title{ display:flex; align-items:center; gap:8px; min-width:0; }
.sec-mark{
  width:4px; height:14px;
  flex:0 0 auto;
  border-radius:2.5px;
  background:var(--muted);
  opacity:.4;
}
.sec-mark.tone-blue{ background:var(--blue); opacity:1; }
.sec-mark.tone-amber{ background:var(--amber); opacity:1; }
.sec-mark.tone-violet{ background:var(--violet); opacity:1; }
.sec-mark.tone-green{ background:var(--green); opacity:1; }
.sec-mark.tone-teal{ background:var(--teal); opacity:1; }
.sec-mark.tone-red{ background:var(--red); opacity:1; }
.sec-head h2{ font-size:15px; letter-spacing:.004em; }

/* ---------- 卡片层 ---------- */
.panel{
  border-color:var(--rule);
  border-radius:16px;
  box-shadow:var(--shadow-1);
  transition:box-shadow .22s var(--ease-out);
}
.card{
  border-color:var(--rule);
  border-radius:18px;
  box-shadow:var(--shadow-1);
  transition:transform .22s var(--ease-out), box-shadow .22s var(--ease-out);
}
.chart-card{
  position:relative;
  overflow:hidden;
  border-color:var(--rule);
  border-radius:18px;
  box-shadow:var(--shadow-1);
  background:var(--surface);
  transition:transform .22s var(--ease-out), box-shadow .22s var(--ease-out);
}
.chart-card::before{
  content:"";
  position:absolute;
  top:0; left:0; right:0;
  height:2px;
  background:linear-gradient(90deg, var(--chart-accent,var(--blue)), transparent 58%);
  opacity:.55;
  pointer-events:none;
}
@media (hover:hover){
  .card:hover, .chart-card:hover{ transform:translateY(-1px); box-shadow:var(--shadow-2); }
  .panel:hover{ box-shadow:var(--shadow-2); }
}
.filter-card, .form-card{ border-color:var(--rule); border-radius:16px; box-shadow:var(--shadow-1); }

/* 图表卡主题色 */
.chart-card.tone-blue{ --chart-accent:var(--blue); }
.chart-card.tone-violet{ --chart-accent:var(--violet); }
.chart-card.tone-amber{ --chart-accent:var(--amber); }
.chart-card.tone-teal{ --chart-accent:var(--teal); }
.chart-card.tone-subject{ --chart-accent:var(--s2); }
.chart-head h3{ display:flex; align-items:center; gap:7px; }
.chart-head h3::before{
  content:"";
  width:5px; height:5px;
  flex:0 0 auto;
  border-radius:50%;
  background:var(--chart-accent,var(--blue));
  box-shadow:0 0 0 3px var(--rule-soft);
}
.chart-stat b{
  font-family:var(--font-display);
  font-size:16px;
  letter-spacing:-.01em;
}

/* ---------- 目标进度：蓝色纸卡 ---------- */
.hero{
  position:relative;
  overflow:hidden;
  margin:16px 20px 0;
  padding:16px 16px 14px;
  border:1px solid var(--rule);
  border-radius:18px;
  background:
    radial-gradient(110% 130% at 100% 0%, var(--blue-soft) 0%, transparent 58%),
    linear-gradient(165deg, var(--surface), var(--surface-2));
  box-shadow:var(--shadow-1);
}
.hero-meta{ font-size:12px; }
.hero-meta .hero-prev{
  display:inline-flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
}
.hero-meta .hero-prev b{ font-size:12.5px; }
.hero-meta .hero-prev b.up{ color:var(--green); }
.hero-meta .hero-prev b.down{ color:var(--red); }
.hero-score-row{ margin-top:4px; }
.hero-score{
  font-family:var(--font-display);
  font-size:54px;
  font-weight:700;
  letter-spacing:-.035em;
  line-height:1;
}
.hero-score .unit{ font-family:var(--font); font-size:13.5px; font-weight:450; }
.hero-gap .gap-label{ font-size:11px; letter-spacing:.02em; }
.gap-val{
  font-family:var(--font-display);
  font-size:20px;
  padding:2px 9px 3px;
  border-radius:999px;
  background:var(--red-soft);
  color:var(--red);
  line-height:1.25;
}
.gap-val.over{ background:var(--blue-soft); color:var(--blue); }
.gap-val small{ font-family:var(--font); font-size:11px; color:var(--muted); }
.track-area{ margin-top:25px; }
.track{
  height:9px;
  border-radius:999px;
  background:
    repeating-linear-gradient(90deg, transparent 0 9.6%, var(--rule) 9.6% 10%),
    var(--rule-soft);
  box-shadow:inset 0 1px 2px rgba(21,24,18,.08);
}
.track .fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg, var(--blue), var(--blue-2));
  box-shadow:0 0 14px -2px rgba(43,80,207,.5);
  transform-origin:left center;
  animation:barGrow .9s var(--ease-out) both;
  transition:width .6s var(--ease-out);
}
.track .tick{
  width:1px;
  background:var(--amber);
  opacity:.9;
}
.track .tick::after{
  width:7px; height:7px;
  top:-3px; left:-3px;
  border-radius:2px;
  transform:rotate(45deg);
  background:var(--amber);
  box-shadow:0 0 0 2px var(--surface);
}
.tick-label{
  font-size:10.5px;
  padding:2px 7px;
  border-radius:6px;
  background:var(--amber-soft);
  color:var(--amber);
  box-shadow:0 0 0 1px var(--surface);
  top:-2px;
}
.hero-foot{ font-size:12px; }
.hr2{ display:none; }
.hero-note{
  margin-top:7px;
  background:var(--surface-2);
  border-radius:8px;
  padding:6px 8px;
}

/* ---------- 最新成绩：科目索引色 ---------- */
.srow{
  grid-template-columns:76px 1fr 37px 30px 46px;
  min-height:46px;
  padding:7px 14px;
  transition:background .16s ease;
}
@media (hover:hover){ .srow:hover{ background:var(--surface-2); } }
.sname{ gap:5px; font-size:13.5px; }
.subj-dot{
  display:inline-block;
  width:6px; height:6px;
  flex:0 0 auto;
  border-radius:50%;
  background:var(--sc,var(--blue));
  box-shadow:0 0 0 2px var(--rule-soft);
}
.bullet{ height:6px; border-radius:999px; }
.bullet .fill{ border-radius:999px; transform-origin:left center; animation:barGrow .75s var(--ease-out) both; }
.bullet .fill.miss{ background:linear-gradient(90deg,var(--red),#d7654d); }
.bullet .fill:not(.miss){ background:linear-gradient(90deg,var(--blue),var(--blue-2)); }
.bullet .tick{ top:-2px; bottom:-2px; background:var(--amber); }
.sval{ font-size:15px; }
.sgap{
  display:inline-block;
  min-width:36px;
  padding:1px 5px;
  border-radius:999px;
  background:var(--red-soft);
  font-size:11.5px;
  line-height:1.45;
}
.sgap.met{ background:var(--blue-soft); }
.sgap.absent{ background:transparent; color:var(--muted); }
.sname .mark{ border-color:var(--amber); color:var(--amber); background:var(--amber-soft); font-weight:500; }
.sname .mark, .dt .ds-name .mark{ border-radius:4px; padding:0 3px; }

.insight-strip{
  border-top:0;
  margin-top:16px;
  padding:12px 14px;
  width:calc(100% - 40px);
  border-radius:14px;
  background:var(--surface);
  border:1px solid var(--rule);
  box-shadow:var(--shadow-1);
  transition:transform .2s var(--ease-out), box-shadow .2s var(--ease-out);
}
.insight-strip:hover{ transform:translateY(-1px); box-shadow:var(--shadow-2); }
.insight-strip .k{ color:var(--red); letter-spacing:.08em; white-space:nowrap; flex:0 0 auto; }
.insight-strip .arrow{ white-space:nowrap; flex:0 0 auto; }
.insight-strip strong{ min-width:0; line-height:1.55; }

.nowrap{ white-space:nowrap; }

/* ---------- 排名 ---------- */
.rank{ background:var(--surface); }
.rank-line{ gap:7px; }
.rval{ font-family:var(--font-display); font-size:24px; font-weight:700; }
.rpct{
  background:var(--green-soft);
  color:var(--green);
  border-radius:999px;
  padding:1px 7px;
  font-size:11px;
}
.ptrack{ height:4px; border-radius:999px; }
.ptrack .pmark{
  width:3px; height:11px; top:-4px;
  border-radius:2px;
  background:var(--teal);
  box-shadow:0 0 0 2px var(--surface);
}
.rank-foot{
  margin-top:2px;
  padding:9px 10px;
  border-top:0;
  border-radius:9px;
  background:var(--surface-2);
}
.rank-foot .up{ background:var(--green-soft); padding:1px 6px; border-radius:6px; }
.rank-foot .down{ background:var(--red-soft); padding:1px 6px; border-radius:6px; }

/* ---------- 记录列表 ---------- */
.rec-list{ border-color:var(--rule); border-radius:16px; box-shadow:var(--shadow-1); }
.rec{ transition:background .16s ease, transform .16s var(--ease-out); }
@media (hover:hover){ .rec:hover{ background:var(--surface-2); } }
.rec:active{ transform:scale(.993); }
.rec-date b{ font-family:var(--font-display); font-size:17px; }
.rec-score b{ font-family:var(--font-display); font-size:19px; letter-spacing:-.01em; }
.rec-score span{ font-size:10.5px; }
.rec-meta{ color:var(--muted); }

/* ---------- 分析筛选 / 口径 ---------- */
.filter-card{ padding:4px 16px 10px; }
.filter-row{ border-bottom-color:var(--rule-soft); }
.filter-lab{ font-size:11.5px; letter-spacing:.03em; }
.scope-line{ color:var(--muted); font-size:11px; }

.chip{
  border-color:var(--rule);
  background:var(--surface);
  color:var(--ink-2);
  font-size:12.5px;
  transition:background .18s var(--ease-out), color .18s, border-color .18s, transform .16s var(--ease-spring), box-shadow .18s;
}
.chip:hover{ border-color:var(--tone,var(--blue)); }
.chip:active{ transform:scale(.96); }
.chip[aria-pressed="true"]{
  background:var(--tone,var(--blue));
  border-color:var(--tone,var(--blue));
  color:#fff;
  font-weight:600;
  box-shadow:0 4px 12px -8px var(--tone,var(--blue));
}
.chip .chip-dot{
  display:inline-block;
  width:6px; height:6px;
  margin-right:5px;
  border-radius:50%;
  background:var(--sc,var(--blue));
  vertical-align:1px;
}
.seg{
  padding:3px;
  border-radius:999px;
  background:var(--surface-2);
  border-color:var(--rule-soft);
}
.seg button{
  height:27px;
  border-radius:999px;
  transition:background .22s var(--ease-out), color .22s, box-shadow .22s;
}
.seg button[aria-pressed="true"]{
  background:var(--blue);
  color:#fff;
  box-shadow:0 4px 12px -8px var(--blue);
}

/* ---------- 结论 ---------- */
.card.insight{
  background:
    radial-gradient(120% 90% at 100% 0%, var(--red-soft) 0%, transparent 46%),
    var(--surface);
}
.ins-lead{ font-size:11px; letter-spacing:.12em; color:var(--red); }
.ins-lead::before{
  content:"";
  display:inline-block;
  width:5px; height:5px;
  border-radius:50%;
  background:var(--red);
  margin-right:6px;
  vertical-align:1px;
}
.ins-list{ border-top-color:var(--rule); }
.ins-row{ grid-template-columns:24px 1fr; }
.idx{
  display:grid;
  place-items:center;
  width:20px; height:20px;
  border-radius:50%;
  background:var(--red-soft);
  color:var(--red);
  font-weight:650;
  font-size:10.5px;
  padding-top:0;
}
.ins-row:first-child .idx{ background:var(--red); color:#fff; }
.ins-row .h b{ font-family:var(--font-display); font-weight:700; }
.ins-row .h .d{ background:var(--red-soft); border-radius:6px; padding:0 5px; }
.keep h3{ color:var(--green); display:flex; align-items:center; gap:6px; }
.keep h3::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--green); }
.keep-row .ok{ color:var(--green); }
.keep-row b{ font-family:var(--font-display); }
.rule-note{ font-size:10.5px; }

/* ---------- 图表动效 ---------- */
.chart-tip{
  top:4px;
  padding:7px 10px 7px 12px;
  border-radius:11px;
  border-color:var(--rule);
  background:var(--surface);
  box-shadow:0 16px 34px -22px rgba(20,20,15,.55);
  transform:translate(-50%,6px) scale(.96);
  transition:opacity .16s var(--ease-out), transform .22s var(--ease-spring);
}
.chart-tip::before{
  content:"";
  position:absolute;
  left:0; top:7px; bottom:7px;
  width:2px;
  border-radius:2px;
  background:var(--chart-accent,var(--blue));
}
.chart-tip.on{ transform:translate(-50%,0) scale(1); }
.chart-tip .tm{ font-family:var(--font-display); font-size:16px; }
.chart-tip .tt{ color:var(--ink-2); font-weight:550; }
.chart-cross{
  background:linear-gradient(180deg, var(--chart-accent,var(--blue)), transparent);
  opacity:0;
  transition:left .1s linear;
}
.chart-wrap.on .chart-cross{ opacity:.34; }
.chart-focus{
  position:absolute;
  z-index:2;
  width:10px; height:10px;
  margin:-5px 0 0 -5px;
  border-radius:50%;
  background:var(--surface);
  border:2px solid var(--chart-accent,var(--blue));
  box-shadow:0 0 0 4px var(--surface), 0 0 0 5px var(--rule);
  opacity:0;
  pointer-events:none;
  transition:opacity .14s ease, left .08s linear, top .08s linear;
}
.chart-wrap.on .chart-focus{ opacity:1; }
.chart-wrap{ cursor:crosshair; }

.c-grid{ stroke:var(--rule-soft); }
.c-axis{ fill:var(--muted); font-size:10.5px; }
.c-value{ font-family:var(--font-display); font-size:12.5px; font-weight:700; }
.c-small{ fill:var(--muted); font-size:10px; }
.c-target{ stroke:var(--amber); stroke-width:1.1; stroke-dasharray:4 5; opacity:.75; }
.c-target-label{ fill:var(--amber); font-size:10.5px; }
.c-line{
  fill:none;
  stroke:var(--chart-accent,var(--blue));
  stroke-width:2.4;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  animation:drawLine 1.05s var(--ease-out) .12s forwards;
}
.c-glow{
  fill:none;
  stroke:var(--chart-accent,var(--blue));
  stroke-width:7;
  opacity:.10;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  animation:drawLine 1.05s var(--ease-out) .12s forwards;
}
.c-dot, .c-dot-last, .c-dot-open{ stroke:var(--surface); }
.c-dot{ fill:var(--chart-accent,var(--blue)); stroke-width:1.5; }
.c-dot-open{ fill:var(--surface); stroke:var(--chart-accent,var(--blue)); stroke-width:1.8; }
.c-dot-last{ fill:var(--chart-accent,var(--blue)); stroke-width:2; }
.c-halo{
  fill:var(--chart-accent,var(--blue));
  opacity:.10;
  animation:haloPulse 2.8s var(--ease-out) infinite;
  transform-box:fill-box;
  transform-origin:center;
}
.c-rank-line{
  fill:none;
  stroke:var(--chart-accent,var(--teal));
  stroke-width:2.1;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  animation:drawLine 1.05s var(--ease-out) .12s forwards;
}
.c-rank-dot{ fill:var(--chart-accent,var(--teal)); }
.c-rank-last{ fill:var(--chart-accent,var(--teal)); stroke:var(--surface); stroke-width:2; }
.c-rank-dot, .c-rank-last{ animation:dotIn .32s var(--ease-spring) both; animation-delay:calc(.42s + var(--i,0)*.055s); }
.c-bar-met{ fill:var(--blue); }
.c-bar-miss{ fill:var(--red); }
.c-bar{ transform-box:fill-box; transform-origin:bottom; animation:barRise .8s var(--ease-out) both; animation-delay:calc(.08s + var(--i,0)*.07s); }
.c-bar-target{ stroke:var(--amber); stroke-width:1.4; }
.c-bar-baseline{ stroke:var(--rule); }
.c-subj-dot{ opacity:.85; }
.c-axis, .c-small, .c-value, .c-target-label{ animation:fadeIn .5s var(--ease-out) both; }
.c-value{ animation-delay:.75s; }
.c-target-label{ animation-delay:.45s; }
.c-dot, .c-dot-last, .c-dot-open{ animation:dotIn .32s var(--ease-spring) both; animation-delay:calc(.42s + var(--i,0)*.055s); }
.c-halo{ animation-delay:1s; }

/* 单科切换：9 科更紧凑，避免占掉半屏 */
.subj-chips{ gap:5px !important; padding:2px 4px 6px !important; }
.subj-chips .chip{ height:29px; padding:0 8px; font-size:11.5px; gap:5px; }
.subj-chips .chip .chip-dot{ width:5px; height:5px; }

/* ---------- 表单 / CTA ---------- */
.form-card{ box-shadow:var(--shadow-1); }
.fblock-head h2{ font-size:12.5px; letter-spacing:.03em; }
.sf-name .nm{ gap:5px; }
.srow-form{ border-bottom-color:var(--rule-soft); }
.score-in, .input, .rank-cell, .num-input{
  transition:border-color .18s var(--ease-out), box-shadow .18s var(--ease-out), background .18s;
}
.score-in:focus, .input:focus, .num-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px var(--blue-soft);
}
.score-in{ background:var(--surface); }
.rank-cell{ background:linear-gradient(180deg, var(--surface-2), var(--surface)); }
.btn-primary{
  background:linear-gradient(135deg, var(--btn), var(--btn-2));
  color:#fff;
  border-radius:14px;
  box-shadow:0 12px 26px -18px rgba(29,63,184,.85), 0 1px 0 rgba(255,255,255,.18) inset;
  transition:transform .18s var(--ease-spring), box-shadow .22s var(--ease-out), filter .18s;
}
.btn-primary:hover{ box-shadow:0 16px 32px -18px rgba(29,63,184,.9), 0 1px 0 rgba(255,255,255,.2) inset; filter:brightness(1.03); }
.btn-primary:active{ transform:scale(.982); }
.btn-line{
  border-color:var(--rule);
  background:var(--surface);
  border-radius:12px;
  transition:background .18s, border-color .18s, transform .16s var(--ease-spring);
}
.btn-line:hover{ background:var(--surface-2); border-color:var(--tone,var(--blue)); }
.btn-line:active{ transform:scale(.97); }

/* ---------- 设置 ---------- */
.set-block h2{ display:flex; align-items:center; gap:7px; font-size:12.5px; letter-spacing:.03em; }
.set-block h2::before{
  content:"";
  width:5px; height:5px;
  border-radius:50%;
  background:var(--block-tone,var(--teal));
  box-shadow:0 0 0 3px var(--rule-soft);
}
.set-block.tone-violet{ --block-tone:var(--violet); }
.set-block.tone-blue{ --block-tone:var(--blue); }
.set-block.tone-amber{ --block-tone:var(--amber); }
.set-block.tone-teal{ --block-tone:var(--teal); }
.set-block.tone-green{ --block-tone:var(--green); }
.set-row{ border-top-color:var(--rule-soft); transition:background .16s; }
@media (hover:hover){ .set-row:hover{ background:var(--surface-2); } }
.set-row:active{ background:var(--surface-2); }
.target-edit input{
  font-family:var(--font-display);
  font-size:38px;
  font-weight:700;
}
.tpreview div{ position:relative; }
.tpreview div::before{
  content:"";
  width:5px; height:5px;
  border-radius:50%;
  background:var(--sc,var(--muted));
  position:absolute;
  left:8px; top:11px;
}
.tpreview div > span{ padding-left:11px; }
.tpreview b{ font-family:var(--font-display); font-size:13.5px; }

/* 安装卡 */
.install-card{
  background:
    radial-gradient(120% 100% at 100% 0%, var(--teal-soft) 0%, transparent 55%),
    var(--surface);
}
.install-row{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:12px 0 10px;
  text-align:left;
  border-top:1px solid var(--rule-soft);
}
.install-badge{
  width:40px; height:40px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:var(--teal-soft);
  color:var(--teal);
}
.install-badge svg{ width:19px; height:19px; }
.install-copy{ min-width:0; flex:1; }
.install-copy b{ display:block; font-size:14px; color:var(--ink); }
.install-copy span{ display:block; font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.45; }
.install-act{
  flex:0 0 auto;
  height:34px;
  padding:0 12px;
  border-radius:999px;
  background:var(--teal);
  color:#fff;
  font-size:12px;
  font-weight:600;
  box-shadow:0 6px 16px -12px var(--teal);
}
.install-act:active{ transform:scale(.96); }
.install-ok{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11.5px;
  color:var(--green);
  background:var(--green-soft);
  border-radius:999px;
  padding:2px 8px;
  white-space:nowrap;
}
.install-steps{ counter-reset:step; }
.install-steps li{
  counter-increment:step;
  display:flex;
  gap:9px;
  padding:8px 0;
  font-size:12.5px;
  color:var(--ink-2);
  list-style:none;
  border-bottom:1px solid var(--rule-soft);
}
.install-steps li::before{
  content:counter(step);
  width:20px; height:20px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--teal-soft);
  color:var(--teal);
  font-size:10.5px;
  font-weight:650;
}

/* ---------- 底部导航 ---------- */
.tabbar{
  background:var(--surface);
  border-top-color:var(--rule);
  box-shadow:0 -14px 34px -30px rgba(20,20,15,.55);
}
.tab-ind{
  position:absolute;
  top:0;
  left:calc(12.5% + var(--tab,0) * 25%);
  width:22px; height:2px;
  margin-left:-11px;
  border-radius:2px;
  background:var(--blue);
  transition:left .38s var(--ease-spring), background .3s;
  pointer-events:none;
}
.tab{ transition:color .25s, transform .2s var(--ease-out); }
.tab.active{ color:var(--blue); }
.tab.active::before{ display:none; }
.tab.active svg{ transform:translateY(-1px) scale(1.06); transition:transform .25s var(--ease-spring); }

/* ---------- 弹层 / 动效 ---------- */

/* ---------- 主题过渡 / 减弱动效 ---------- */
html.theme-anim, html.theme-anim body, html.theme-anim .app, html.theme-anim .panel, html.theme-anim .card, html.theme-anim .chart-card, html.theme-anim .hero{

/* 视图切换 */

@media (prefers-reduced-motion: reduce){

}

/* ---------- keyframes ---------- */

<body>
