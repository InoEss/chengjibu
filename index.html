function renderExamDetail(data, exam, state) {
  var c = calcExam(exam, state.basis, data.target.rate);
  var r = exam.rank || {};
  var targetRate = data.target.rate;
  var worstGap = 0, worstName = '';
  c.rows.forEach(function (row) {
    if (row.value != null && !row.met && row.gap > worstGap) { worstGap = row.gap; worstName = row.name; }
  });
  var hasRank = r['class'] || r.grade;

  var rows = c.rows.map(function (row) {
    var has = row.value != null;
    return '<tr><td><div class="ds-name">' + subjDot(row.name) + esc(row.name) + (row.graded ? '<span class="mark">赋</span>' : '') +
      (row.name === worstName ? '<span class="lag">拖后腿</span>' : '') + '</div>' +
      (row.graded && row.raw != null ? '<span class="ds-raw">原始 ' + fmtScore(row.raw) + '</span>' : '') + '</td>' +
      '<td class="score">' + (has ? fmtScore(row.value) : '缺考') + '<small>/' + row.full + '</small></td>' +
      '<td>' + row.target + '</td>' +
      '<td class="gap ' + (row.met ? 'met' : '') + '">' + (has ? (row.gap === 0 ? '0' : (row.gap > 0 ? '−' : '+') + fmtScore(Math.abs(row.gap))) : '—') + '</td>' +
      '<td class="rate ' + (row.met ? 'met' : '') + '">' + (has ? fmtPct(row.rate) : '—') + '</td></tr>';
  }).join('');

  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="考试详情">' +
    '<div class="sheet-grip"></div>' +
    '<div class="sheet-head"><div><div class="detail-kicker">' + esc(exam.type) + '<span>·</span>' + esc(exam.grade) + '<span>·</span>' + esc(comboLabel(exam.combo)) + '<span>·</span>' + esc(exam.province) + '</div>' +
    '<div class="detail-title">' + esc(exam.name) + '</div></div><button class="sheet-close" data-act="close-layer" aria-label="关闭">' + icon('close') + '</button></div>' +
    '<div class="detail-hero"><div><div class="detail-score"><span class="count" data-count="' + c.total + '" data-dec="' + (Math.abs(c.total - Math.round(c.total)) > 0.05 ? 1 : 0) + '">' + fmtScore(c.total) + '</span><span class="unit">/ ' + fmtScore(c.base) + '</span></div>' +
    '<div class="detail-kicker" style="margin-top:3px">' + fmtDateCN(exam.date) + ' · ' + weekdayCN(exam.date) + (c.missing ? ' · 不完整 ' + c.filled + '/' + (c.filled + c.missing) : '') + '</div></div>' +
    '<div class="detail-side"><span>' + (c.gap >= 0.5 ? '距目标' : (c.gap <= -0.5 ? '超出目标' : '目标达成')) + '</span><b class="' + (c.gap > 0 ? 'miss' : 'met') + '">' + (Math.abs(c.gap) < 0.5 ? '刚好' : fmtScore(Math.round(Math.abs(c.gap))) + ' 分') + '</b><span>得分率 ' + fmtPct(c.rate) + ' · 目标 ' + fmtPct(targetRate) + '</span></div></div>' +
    '<table class="dt"><thead><tr><th style="width:27%">科目</th><th style="width:20%">得分</th><th style="width:16%">目标</th><th style="width:19%">差距</th><th style="width:18%">得分率</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="detail-rank"><div><span class="cap">班级排名</span><div class="v">' + (r['class'] ? '<span class="count" data-count="' + r['class'] + '" data-dec="0">' + r['class'] + '</span><small> / ' + (r.classSize || '—') + ' · 前 ' + fmtPct(examPercentile(r['class'], r.classSize)) + '</small>' : '未记录') + '</div></div>' +
    '<div><span class="cap">年级排名</span><div class="v">' + (r.grade ? '<span class="count" data-count="' + r.grade + '" data-dec="0">' + r.grade + '</span><small> / ' + (r.gradeSize || '—') + ' · 前 ' + fmtPct(examPercentile(r.grade, r.gradeSize)) + '</small>' : '未记录') + '</div></div></div>' +
    (exam.note ? '<div class="detail-note"><span>备注</span>' + esc(exam.note) + '</div>' : '') +
    '<div class="detail-note" style="border-top:0;padding-top:4px;font-size:11px;color:var(--muted)">' + (c.rows.some(function (x) { return x.graded; }) ? (state.basis === 'raw' ? '按原始分口径显示' : '赋分科目按赋分计，可回到分析切换口径') : '所有科目按原始分计入') + '</div>' +
    '<div class="detail-acts"><button class="btn-line" data-act="edit-exam" data-id="' + esc(exam.id) + '">' + icon('edit') + '修改记录</button>' +
    '<button class="btn-line del" data-act="ask-delete" data-id="' + esc(exam.id) + '">' + icon('trash') + '删除</button></div>' +
    '</div>';
}

function comboSheetTemp(profile) {
  var p = provinceOf(profile.province);
  var combo = profile.combo;
  var names = parseCombo(combo);
  var first = names.indexOf('物理') >= 0 ? '物理' : (names.indexOf('历史') >= 0 ? '历史' : '物理');
  var second = names.filter(function (n) { return ['化学', '生物', '政治', '地理'].indexOf(n) >= 0; });
  if (second.length !== 2) second = ['化学', '生物'];
  var elect = names.filter(function (n) { return p.elect && p.elect.some(function (x) { return x[0] === n; }); });
  if (elect.length !== 3) elect = ['物理', '化学', '生物'];
  return { unsorted: combo === '九科', first: first, second: second, elect: elect, track: combo === '文科' ? '文科' : '理科' };
}

function sheetCombo(data, temp) {
  var p = provinceOf(data.profile.province);
  var combo = temp.unsorted ? '九科' : (p.mode === '传统' ? temp.track : (p.mode === '3+1+2' ?
    (temp.first && temp.second.length === 2 ? comboFromNames([temp.first].concat(temp.second)) : null) :
    (temp.elect.length === 3 ? comboFromNames(temp.elect) : null)));
  var body = '<button class="switch-row" data-act="sheet-combo-unsorted"><span><span class="t">九科全录</span><span class="d">未选科时先记录所有科目</span></span><span class="switch" aria-checked="' + (temp.unsorted ? 'true' : 'false') + '" role="switch"></span></button>';
  if (!temp.unsorted) {
    if (p.mode === '3+1+2') {
      body += '<p class="ob-sublab"><b>首选</b><span>二选一</span></p><div class="first-grid">' + p.first.map(function (x) {
        return '<button class="big-chip" data-act="sheet-first" data-v="' + x[0] + '" aria-pressed="' + (temp.first === x[0] ? 'true' : 'false') + '">' + x[0] + '<small>原始分</small></button>';
      }).join('') + '</div>' +
        '<p class="ob-sublab"><b>再选</b><span class="count">' + temp.second.length + ' / 2</span></p><div class="elect-grid">' + p.second.map(function (x) {
          return '<button class="big-chip" data-act="sheet-second" data-v="' + x[0] + '" aria-pressed="' + (temp.second.indexOf(x[0]) >= 0 ? 'true' : 'false') + '">' + x[0] + '<small>赋分</small></button>';
        }).join('') + '</div>';
    } else if (p.mode === '3+3') {
      body += '<p class="ob-sublab"><b>选考</b><span class="count">' + temp.elect.length + ' / 3</span></p><div class="elect-grid">' + p.elect.map(function (x) {
        return '<button class="big-chip" data-act="sheet-elect" data-v="' + x[0] + '" aria-pressed="' + (temp.elect.indexOf(x[0]) >= 0 ? 'true' : 'false') + '">' + x[0] + '<small>' + x[1] + ' 分</small></button>';
      }).join('') + '</div>';
    } else {
      body += '<p class="ob-sublab"><b>文理方向</b><span>综合 300</span></p><div class="track-grid">' + ['文科', '理科'].map(function (t) {
        return '<button class="track-card" data-act="sheet-track" data-v="' + t + '" aria-pressed="' + (temp.track === t ? 'true' : 'false') + '"><b>' + t + '</b><span>' + p.tracks[t].map(function (x) { return x[0]; }).join(' · ') + '</span></button>';
      }).join('') + '</div>';
    }
  }
  return '<div class="sheet"><div class="sheet-grip"></div><div class="sheet-head"><div><h2 style="font-size:19px">科目组合</h2><p class="kicker" style="margin-top:4px">' + esc(data.profile.province) + ' · ' + p.mode + '</p></div><button class="sheet-close" data-act="close-layer" aria-label="关闭">' + icon('close') + '</button></div>' +
    '<div style="margin-top:12px">' + body + '</div>' +
    '<div class="combo-line"><span>当前</span><b>' + (combo ? esc(comboLabel(combo)) : '未完成') + '</b><span>' + (combo ? comboDefs(p, combo).reduce(function (a, s) { return a + s.full; }, 0) + ' 分' : '') + '</span></div>' +
    '<div class="form-actions" style="padding:14px 0 0"><button class="btn-primary" data-act="apply-combo" data-v="' + (combo || '') + '"' + (combo ? '' : ' disabled') + '>保存组合</button></div></div>';
}

/* ---------- 工具 ---------- */
function debounce(fn, wait) {
  var t = null;
  return function () {
    var args = arguments, self = this;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(self, args); }, wait);
  };
}

function showToast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el.__timer);
  el.__timer = setTimeout(function () { el.classList.remove('on'); }, 2400);
}

function prefersReduced() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function animateCounts() {
  if (prefersReduced()) return;
  var els = document.querySelectorAll('.count[data-count]');
  for (var i = 0; i < els.length; i++) {
    (function (el) {
      var target = Number(el.getAttribute('data-count'));
      if (!isFinite(target)) return;
      var dec = Number(el.getAttribute('data-dec') || 0);
      var t0 = null;
      var dur = Math.min(900, 420 + Math.abs(target) * 0.35);
      function fmt(n) {
        var v = Math.round(n * Math.pow(10, dec)) / Math.pow(10, dec);
        return dec ? v.toFixed(dec) : String(Math.round(v));
      }
      function step(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        var e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(target * e);
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = fmt(target);
      }
      requestAnimationFrame(step);
    })(els[i]);
  }
}

function applyTheme() {
  var theme = state.data && state.data.profile.theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1116' : '#f2efe6');
}

/* ---------- 存储 ---------- */
function storageTest() {
  try {
    localStorage.setItem('__chengjibu_test', '1');
    localStorage.removeItem('__chengjibu_test');
    state.storageOK = true;
  } catch (e) {
    state.storageOK = false;
  }
}

function saveData() {
  if (!state.data) return;
  state.data.updatedAt = new Date().toISOString();
  if (!state.storageOK) return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state.data, null, 2));
  } catch (e) {
    state.storageOK = false;
    showToast('本地存储写入失败，请导出备份');
  }
}

function loadData() {
  var raw;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return null; }
  if (!raw) return null;
  try {
    var d = JSON.parse(raw);
    if (!d || typeof d !== 'object' || !d.profile || !Array.isArray(d.exams)) return null;
    if (!d.target) d.target = { total: defaultTargetTotal(provinceOf(d.profile.province)), rate: 0, perSubject: {} };
    d.profile.classSize = Math.max(1, Number(d.profile.classSize) || 45);
    d.profile.gradeSize = Math.max(1, Number(d.profile.gradeSize) || 720);
    if (GRADES.indexOf(d.profile.grade) < 0) d.profile.grade = '高一';
    if (!PROVINCES[d.profile.province]) d.profile.province = '甘肃';
    d.exams.forEach(function (e) {
      if (!e.rank) e.rank = { 'class': null, classSize: d.profile.classSize, grade: null, gradeSize: d.profile.gradeSize };
      if (!e.subjects) e.subjects = [];
      if (!e.id) e.id = uid();
    });
    recalcTarget(d);
    return d;
  } catch (e) {
    try { localStorage.setItem(STORE_KEY + '.corrupt.' + Date.now(), raw); } catch (e2) {}
    showToast('本地数据无法读取，原始内容已另存');
    return null;
  }
}

/* ---------- 渲染 ---------- */
function renderMainShell() {
  var body = '';
  if (state.view === 'overview') body = renderOverview(state.data, state);
  else if (state.view === 'records') {
    if (!state.draft) state.draft = newDraft();
    body = renderRecords(state.data, state);
  } else if (state.view === 'analysis') body = renderAnalysis(state.data, state);
  else body = renderSettings(state.data, state);
  return '<div class="app"><main class="main" id="main">' + body + '</main>' + renderNav() + '</div>';
}

function renderNav() {
  var items = [
    ['overview', '总览'],
    ['records', '记录'],
    ['analysis', '分析'],
    ['settings', '设置']
  ];
  var idx = 0;
  items.forEach(function (it, i) { if (it[0] === state.view) idx = i; });
  return '<nav class="tabbar" aria-label="主导航"><span class="tab-ind" style="--tab:' + idx + '"></span>' + items.map(function (it) {
    var on = state.view === it[0];
    return '<button class="tab ' + (on ? 'active' : '') + '" data-act="view" data-v="' + it[0] + '" aria-current="' + (on ? 'page' : 'false') + '">' + icon(it[0]) + '<span>' + it[1] + '</span></button>';
  }).join('') + '</nav>';
}

function render(opts) {
  opts = opts || {};
  var root = document.getElementById('root');
  if (!state.data) {
    document.body.dataset.view = 'onboarding';
    var firstOb = state._lastObStep === null;
    var stepChanged = !firstOb && state._lastObStep !== state.ob.step;
    state._lastObStep = state.ob.step;
    root.innerHTML = renderOnboarding(state.ob);
    var ob = root.querySelector('.ob-inner');
    if (ob && (stepChanged || firstOb)) {
      ob.classList.add('step-enter');
      setTimeout(function () { ob.classList.remove('step-enter'); }, 520);
    }
    applyTheme();
    return;
  }
  var viewChanged = state._lastView !== null && state._lastView !== state.view;
  state._lastView = state.view;
  document.body.dataset.view = state.view;
  var keepY = window.scrollY;
  root.innerHTML = renderMainShell();
  var app = root.querySelector('.app');
  if (viewChanged && app) {
    app.classList.add('view-enter');
    setTimeout(function () { app.classList.remove('view-enter'); }, 560);
  }
  applyTheme();
  if (opts.top) window.scrollTo(0, 0);
  else if (opts.keepScroll) window.scrollTo(0, keepY);
  drawAllCharts();
  animateCounts();
}

function drawAllCharts() {
  if (!state.data) return;
  var rate = state.data.target.rate;
  var p = provinceOf(state.data.profile.province);
  if (state.view === 'overview') {
    var el = document.getElementById('mini-trend');
    if (el) {
      var recent = sortedExams(state.data, 'desc').slice(0, 5).reverse();
      drawMiniTrend(el, recent, state.basis, rate, state.data.target.total, p.total);
    }
  }
  if (state.view === 'analysis') {
    var scope = scopeExams(state.data, state.analysis);
    if (!scope.length) return;
    var totalEl = document.getElementById('chart-total');
    if (totalEl) drawTotalChart(totalEl, scope, state.basis, rate, state.data.target.total, p.total);
    var subs = subjectStats(scope, state.basis, rate);
    var cur = state.subject;
    if (!subs.some(function (s) { return s.name === cur; })) cur = subs.length ? subs[0].name : null;
    var subEl = document.getElementById('chart-subject');
    if (subEl && cur) drawSubjectChart(subEl, scope, cur, state.basis, rate);
    var rateEl = document.getElementById('chart-rate');
    if (rateEl) drawRateChart(rateEl, subs, rate);
    var rankEl = document.getElementById('chart-rank');
    if (rankEl) drawRankChart(rankEl, scope, state.rankMode);
  }
}

/* ---------- 弹层 ---------- */
function paintLayer() {
  var el = document.getElementById('layer');
  if (!el) return;
  if (!state.layer) {
    el.innerHTML = '';
    document.body.classList.remove('lock');
    return;
  }
  var kind = state.layer.kind;
  var html = '';
  if (kind === 'grade') html = sheetGrade(state.data);
  else if (kind === 'province') html = sheetProvince(state.data, state.layer.temp);
  else if (kind === 'combo') html = sheetCombo(state.data, state.layer.temp);
  else if (kind === 'detail') {
    var exam = state.data.exams.filter(function (e) { return e.id === state.layer.id; })[0];
    if (!exam) { state.layer = null; el.innerHTML = ''; document.body.classList.remove('lock'); return; }
    html = renderExamDetail(state.data, exam, state);
  } else if (kind === 'restore') html = dialogRestore(state.layer.preview);
  else if (kind === 'dialog') {
    var n = state.layer.name;
    if (n === 'upgrade') html = dialogUpgrade(state.data);
    else if (n === 'delete') {
      var ex = state.data.exams.filter(function (e) { return e.id === state.layer.id; })[0];
      if (ex) html = dialogDelete(ex);
    } else if (n === 'reset') html = dialogReset(state.data);
    else if (n === 'demo') html = dialogDemo(state.data);
    else if (n === 'export') html = dialogExport(state.layer.payload);
    else if (n === 'json') html = dialogJson(state.data);
    else if (n === 'install') html = dialogInstall();
    else if (n === 'importError') html = dialogImportError(state.layer.payload);
  }
  if (!html) { el.innerHTML = ''; document.body.classList.remove('lock'); state.layer = null; return; }
  el.innerHTML = '<div class="overlay" data-overlay="1">' + html + '</div>';
  document.body.classList.add('lock');
  animateCounts();
}

function showLayer(spec) {
  state.layer = spec;
  paintLayer();
}

function closeLayer() {
  var el = document.getElementById('layer');
  var ov = el && el.querySelector('.overlay');
  state.layer = null;
  state.pendingRestore = null;
  if (!ov) { paintLayer(); return; }
  if (prefersReduced()) { paintLayer(); return; }
  ov.classList.add('closing');
  var token = ++state._closeToken;
  setTimeout(function () {
    if (state._closeToken === token && !state.layer) paintLayer();
  }, 190);
}

/* ---------- 引导 ---------- */
function defaultOb() {
  var p = provinceOf('甘肃');
  return {
    step: 1, grade: '高一', province: '甘肃',
    unsorted: true, first: '物理', second: ['化学', '生物'],
    elect: ['物理', '化学', '生物'], track: '理科',
    target: defaultTargetTotal(p), classSize: 45, gradeSize: 720
  };
}

function resetComboDefaults(ob, oldTotal) {
  var p = provinceOf(ob.province);
  if (p.mode === '3+1+2') { ob.first = '物理'; ob.second = ['化学', '生物']; }
  else if (p.mode === '3+3') { ob.elect = ['物理', '化学', '生物']; }
  else { ob.track = '理科'; }
  if (oldTotal && oldTotal !== p.total) {
    ob.target = Math.max(1, Math.min(p.total, Math.round(ob.target / oldTotal * p.total)));
  }
  return ob;
}

function updateObTargetUI() {
  var ob = state.ob;
  var p = provinceOf(ob.province);
  var combo = obCombo(ob);
  var rate = ob.target / p.total;
  var rEl = document.getElementById('ob-rate');
  if (rEl) rEl.textContent = fmtPct(rate);
  var pv = document.getElementById('ob-preview');
  if (pv) {
    var defs = comboDefs(p, combo || defaultCombo(p, ob.grade));
    pv.innerHTML = defs.map(function (s) {
      return '<div><span>' + s.name + '</span><b>' + subjectTarget(rate, s.full) + '</b></div>';
    }).join('');
  }
  var input = document.getElementById('ob-target');
  if (input) input.value = ob.target;
}

function finishOnboarding() {
  var ob = state.ob;
  var p = provinceOf(ob.province);
  var combo = obCombo(ob);
  if (!combo) { showToast('请先完成选科'); return; }
  var total = Number(ob.target);
  if (!isFinite(total) || total < 1 || total > p.total) { showToast('目标总分应在 1–' + p.total + ' 之间'); return; }
  var d = makeDefaultData();
  d.profile.grade = ob.grade;
  d.profile.province = ob.province;
  d.profile.combo = combo;
  d.profile.classSize = Math.max(1, Math.round(Number(ob.classSize) || 45));
  d.profile.gradeSize = Math.max(1, Math.round(Number(ob.gradeSize) || 720));
  d.target.total = Math.round(total);
  recalcTarget(d);
  state.data = d;
  state.ob = null;
  state.view = 'overview';
  saveData();
  render({ top: true });
  showToast('设置完成，可以开始记录了');
}

/* ---------- 表单 ---------- */
function newDraft() {
  var p = provinceOf(state.data.profile.province);
  var defs = comboDefs(p, state.data.profile.combo);
  var today = todayStr();
  var draft = {
    id: null, date: today, type: '周测',
    name: fmtDateCN(today), nameAuto: true,
    grade: state.data.profile.grade, province: state.data.profile.province, combo: state.data.profile.combo,
    subjects: defs, scores: {},
    cls: '', clsSize: String(state.data.profile.classSize),
    grd: '', grdSize: String(state.data.profile.gradeSize),
    note: '', createdAt: null
  };
  defs.forEach(function (s) { draft.scores[s.name] = { raw: '', graded: '' }; });
  return draft;
}

function editDraft(exam) {
  var draft = {
    id: exam.id, date: exam.date, type: exam.type,
    name: exam.name, nameAuto: false,
    grade: exam.grade, province: exam.province, combo: exam.combo,
    subjects: exam.subjects.map(function (s) { return { name: s.name, full: s.full, graded: !!s.graded }; }),
    scores: {}, cls: '', clsSize: '', grd: '', grdSize: '', note: exam.note || '',
    createdAt: exam.createdAt
  };
  exam.subjects.forEach(function (s) {
    draft.scores[s.name] = { raw: s.raw == null ? '' : String(s.raw), graded: s.gradedScore == null ? '' : String(s.gradedScore) };
  });
  draft.cls = exam.rank && exam.rank['class'] != null ? String(exam.rank['class']) : '';
  draft.clsSize = String((exam.rank && exam.rank.classSize) || state.data.profile.classSize);
  draft.grd = exam.rank && exam.rank.grade != null ? String(exam.rank.grade) : '';
  draft.grdSize = String((exam.rank && exam.rank.gradeSize) || state.data.profile.gradeSize);
  return draft;
}

function draftValues(d) {
  var out = [];
  d.subjects.forEach(function (s) {
    var sc = d.scores[s.name] || {};
    out.push({ s: s, raw: draftParseNum(sc.raw), graded: s.graded ? draftParseNum(sc.graded) : null });
  });
  return out;
}

function validateDraft(d) {
  var errs = [];
  if (!dateParts(d.date)) errs.push('考试日期无效');
  if (!String(d.name).trim()) errs.push('考试名称不能为空');
  var usable = 0;
  d.subjects.forEach(function (s) {
    var sc = d.scores[s.name] || {};
    var raw = draftParseNum(sc.raw);
    var gs = s.graded ? draftParseNum(sc.graded) : null;
    if (raw != null) {
      if (raw < 0 || raw > s.full) errs.push(s.name + '原始分应在 0–' + s.full + ' 之间');
      usable++;
    }
    if (s.graded && gs != null) {
      if (gs < 0 || gs > s.full) errs.push(s.name + '赋分应在 0–' + s.full + ' 之间');
      usable++;
    }
  });
  if (!usable) errs.push('至少填一科成绩');
  var cls = draftParseNum(d.cls), clsSize = draftParseNum(d.clsSize);
  var grd = draftParseNum(d.grd), grdSize = draftParseNum(d.grdSize);
  if (cls != null && clsSize != null && cls > clsSize) errs.push('班级名次不能大于班级人数');
  if (cls != null && math_floor(cls) !== cls) errs.push('班级名次应为整数');
  if (grd != null && grdSize != null && grd > grdSize) errs.push('年级名次不能大于年级人数');
  if (clsSize != null && clsSize < 1) errs.push('班级人数应大于 0');
  if (grdSize != null && grdSize < 1) errs.push('年级人数应大于 0');
  return errs;
}

function math_floor(n) { return Math.floor(n); }

function saveExam() {
  var d = state.draft;
  var errs = validateDraft(d);
  if (errs.length) {
    showToast(errs[0]);
    var bad = document.querySelector('.input.invalid, .score-in.invalid');
    if (bad) bad.focus();
    return;
  }
  var subs = d.subjects.map(function (s) {
    var sc = d.scores[s.name] || {};
    var o = { name: s.name, full: s.full, graded: !!s.graded, raw: draftParseNum(sc.raw) };
    if (s.graded) o.gradedScore = draftParseNum(sc.graded);
    return o;
  });
  var now = new Date().toISOString();
  var exam = {
    id: d.id || uid(),
    name: String(d.name).trim(),
    date: d.date,
    type: d.type,
    grade: d.grade,
    province: d.province,
    combo: d.combo,
    subjects: subs,
    rank: {
      'class': draftParseNum(d.cls),
      classSize: draftParseNum(d.clsSize) || state.data.profile.classSize,
      grade: draftParseNum(d.grd),
      gradeSize: draftParseNum(d.grdSize) || state.data.profile.gradeSize
    },
    note: String(d.note || '').trim(),
    createdAt: d.createdAt || now,
    updatedAt: now
  };
  if (d.id) {
    var idx = state.data.exams.findIndex(function (e) { return e.id === d.id; });
    if (idx >= 0) state.data.exams[idx] = exam;
  } else {
    state.data.exams.push(exam);
  }
  state.draft = null;
  state.view = 'overview';
  saveData();
  render({ top: true });
  showToast(d.id ? '记录已更新' : '已保存这场考试');
}

/* ---------- 备份 ---------- */
function doExport() {
  var backup = makeBackup(state.data);
  var json = JSON.stringify(backup, null, 2);
  state.lastExportJson = json;
  var name = '成绩簿备份_' + todayStr() + '.json';
  try {
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
  } catch (e) {
    showToast('浏览器不支持直接下载，请复制 JSON');
  }
  showLayer({ kind: 'dialog', name: 'export', payload: { name: name, count: state.data.exams.length, kb: Math.max(1, Math.round(json.length / 1024)) } });
}

function copyText(text, okMsg) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    showToast(ok ? (okMsg || '已复制') : '复制失败，请手动选择文本');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { showToast(okMsg || '已复制'); }).catch(fallback);
  } else fallback();
}

function readBackupFile(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { showLayer({ kind: 'dialog', name: 'importError', payload: '文件超过 8 MB，不像是成绩簿备份。' }); return; }
  var reader = new FileReader();
  reader.onload = function () {
    var obj;
    try { obj = JSON.parse(String(reader.result)); } catch (e) {
      showLayer({ kind: 'dialog', name: 'importError', payload: '文件不是有效的 JSON，无法解析。' });
      return;
    }
    var v = validateBackup(obj);
    v.fileName = file.name;
    v.currentCount = state.data ? state.data.exams.length : 0;
    state.pendingRestore = v;
    showLayer({ kind: 'restore', preview: v });
  };
  reader.onerror = function () { showLayer({ kind: 'dialog', name: 'importError', payload: '读取文件失败，请重试。' }); };
  reader.readAsText(file);
}

/* ---------- 事件 ---------- */
function onDocClick(e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  if (t.disabled) return;
  var act = t.getAttribute('data-act');
  var v = t.getAttribute('data-v');

  switch (act) {
    case 'view':
      if (state.view === v) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (v === 'records') {
        if (!state.draft || (!state.draft.id && (state.draft.province !== state.data.profile.province || state.draft.combo !== state.data.profile.combo || state.draft.grade !== state.data.profile.grade))) {
          state.draft = newDraft();
        }
      }
      state.view = v;
      render({ top: true });
      return;
    case 'go-record':
      state.view = 'records';
      if (!state.draft) state.draft = newDraft();
      render({ top: true });
      return;
    case 'go-overview':
      if (state.draft && !state.draft.id) state.draft = null;
      state.view = 'overview';
      render({ top: true });
      return;
    case 'go-analysis':
      state.view = 'analysis';
      render({ top: true });
      return;
    case 'rec-type':
      state.recType = v;
      render({ keepScroll: true });
      return;
    case 'f-grade':
      state.analysis.grade = v;
      render({ keepScroll: true });
      return;
    case 'f-type':
      state.analysis.type = v;
      render({ keepScroll: true });
      return;
    case 'basis':
      state.basis = v;
      render({ keepScroll: true });
      return;
    case 'subject':
      state.subject = v;
      render({ keepScroll: true });
      return;
    case 'rank-mode':
      state.rankMode = v;
      render({ keepScroll: true });
      return;
    case 'open-exam':
      showLayer({ kind: 'detail', id: t.getAttribute('data-id') });
      return;
    case 'close-layer':
      closeLayer();
      return;
    case 'edit-exam': {
      var ex = state.data.exams.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0];
      if (!ex) return;
      state.draft = editDraft(ex);
      state.view = 'records';
      closeLayer();
      render({ top: true });
      return;
    }
    case 'ask-delete':
      showLayer({ kind: 'dialog', name: 'delete', id: t.getAttribute('data-id') });
      return;
    case 'do-delete': {
      var id = t.getAttribute('data-id');
      state.data.exams = state.data.exams.filter(function (x) { return x.id !== id; });
      saveData();
      closeLayer();
      render({ keepScroll: true });
      showToast('记录已删除');
      return;
    }
    case 'cancel-edit':
      state.draft = newDraft();
      render({ keepScroll: true });
      return;
    case 'draft-type':
      if (!state.draft) return;
      state.draft.type = v;
      if (state.draft.nameAuto) {
        state.draft.name = fmtDateCN(state.draft.date) + ' ' + v;
        var ni = document.querySelector('[data-f="name"]');
        if (ni) ni.value = state.draft.name;
      }
      render({ keepScroll: true });
      return;
    case 'save-exam':
      saveExam();
      return;
    case 'theme': {
      var doTheme = function () {
        state.data.profile.theme = v;
        saveData();
        applyTheme();
        render({ keepScroll: true });
        showToast(v === 'dark' ? '已切换到深色主题' : '已切换到浅色主题');
      };
      if (document.startViewTransition && !prefersReduced()) {
        try { document.startViewTransition(doTheme); } catch (e) { doTheme(); }
      } else {
        document.documentElement.classList.add('theme-anim');
        doTheme();
        setTimeout(function () { document.documentElement.classList.remove('theme-anim'); }, 460);
      }
      return;
    }
    case 'install':
      if (state.installPrompt) {
        var prompt = state.installPrompt;
        state.installPrompt = null;
        try { prompt.prompt(); } catch (e) {}
        if (prompt.userChoice && prompt.userChoice.then) {
          prompt.userChoice.then(function (choice) {
            if (choice && choice.outcome === 'accepted') showToast('安装已开始，可从桌面打开');
            if (state.data && state.view === 'settings') render({ keepScroll: true });
          });
        } else if (state.data && state.view === 'settings') {
          render({ keepScroll: true });
        }
      } else {
        showLayer({ kind: 'dialog', name: 'install' });
      }
      return;
    case 'sheet-grade':
      showLayer({ kind: 'grade' });
      return;
    case 'set-grade': {
      if (v === state.data.profile.grade) { closeLayer(); return; }
      state.data.profile.grade = v;
      if (v !== '高一' && state.data.profile.combo === '九科') {
        var p0 = provinceOf(state.data.profile.province);
        state.data.profile.combo = defaultCombo(p0, v);
      }
      state.draft = null;
      recalcTarget(state.data);
      saveData();
      closeLayer();
      render({ top: true });
      showToast('年级已改为' + v + '，可在科目组合里选科');
      return;
    }
    case 'sheet-province':
      showLayer({ kind: 'province', temp: state.data.profile.province });
      return;
    case 'sheet-prov-pick':
      if (state.layer && state.layer.kind === 'province') {
        state.layer.temp = v;
        paintLayer();
      }
      return;
    case 'apply-province': {
      var name = v;
      var oldTotal = provinceOf(state.data.profile.province).total;
      var newP = provinceOf(name);
      var rate = state.data.target.total / oldTotal;
      state.data.profile.province = name;
      if (!comboIsValid(newP, state.data.profile.combo, state.data.profile.grade)) {
        state.data.profile.combo = defaultCombo(newP, state.data.profile.grade);
      }
      state.data.target.total = Math.max(1, Math.min(newP.total, Math.round(rate * newP.total)));
      state.draft = null;
      recalcTarget(state.data);
      saveData();
      closeLayer();
      render({ top: true });
      showToast('省份已改为' + name + '，目标按得分率换算');
      return;
    }
    case 'sheet-combo':
      showLayer({ kind: 'combo', temp: comboSheetTemp(state.data.profile) });
      return;
    case 'sheet-combo-unsorted':
      if (state.layer) { state.layer.temp.unsorted = !state.layer.temp.unsorted; paintLayer(); }
      return;
    case 'sheet-first':
      if (state.layer) { state.layer.temp.first = v; paintLayer(); }
      return;
    case 'sheet-second': {
      var tmp = state.layer.temp;
      var idx = tmp.second.indexOf(v);
      if (idx >= 0) tmp.second.splice(idx, 1);
      else {
        if (tmp.second.length >= 2) tmp.second.shift();
        tmp.second.push(v);
      }
      paintLayer();
      return;
    }
    case 'sheet-elect': {
      var tmp2 = state.layer.temp;
      var j = tmp2.elect.indexOf(v);
      if (j >= 0) tmp2.elect.splice(j, 1);
      else {
        if (tmp2.elect.length >= 3) tmp2.elect.shift();
        tmp2.elect.push(v);
      }
      paintLayer();
      return;
    }
    case 'sheet-track':
      if (state.layer) { state.layer.temp.track = v; paintLayer(); }
      return;
    case 'apply-combo': {
      if (!v) return;
      if (!comboIsValid(provinceOf(state.data.profile.province), v, state.data.profile.grade)) { showToast('这个组合不完整'); return; }
      state.data.profile.combo = v;
      state.draft = null;
      recalcTarget(state.data);
      saveData();
      closeLayer();
      render({ top: true });
      showToast('科目组合已更新为' + comboLabel(v));
      return;
    }
    case 'upgrade':
      showLayer({ kind: 'dialog', name: 'upgrade' });
      return;
    case 'do-upgrade': {
      var gi = gradeIndex(state.data.profile.grade);
      if (gi >= 2) return;
      state.data.profile.grade = GRADES[gi + 1];
      state.draft = null;
      recalcTarget(state.data);
      saveData();
      closeLayer();
      render({ top: true });
      showToast('已升到' + state.data.profile.grade + '，新记录按新年级归档');
      return;
    }
    case 'target-preset': {
      var p1 = provinceOf(state.data.profile.province);
      state.data.target.total = Math.round(p1.total * Number(v) / 100);
      recalcTarget(state.data);
      saveData();
      render({ keepScroll: true });
      showToast('目标已设为 ' + state.data.target.total + ' 分');
      return;
    }
    case 'export':
      doExport();
      return;
    case 'copy-json':
      copyText(state.layer && state.layer.name === 'export' ? state.lastExportJson : JSON.stringify(state.data, null, 2), '已复制 JSON');
      return;
    case 'restore':
      if (state.pendingRestore) state.pendingRestore = null;
      var fi = document.getElementById('restore-file');
      if (fi) fi.click();
      return;
    case 'view-json':
      showLayer({ kind: 'dialog', name: 'json' });
      return;
    case 'demo':
      showLayer({ kind: 'dialog', name: 'demo' });
      return;
    case 'do-demo':
      state.data = makeDemoData(state.data.profile, state.data.target.rate);
      saveData();
      state.view = 'overview';
      closeLayer();
      render({ top: true });
      showToast('已载入示例数据，可在设置里清空');
      return;
    case 'reset':
      showLayer({ kind: 'dialog', name: 'reset' });
      return;
    case 'do-reset':
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      state.data = null;
      state.draft = null;
      state.ob = defaultOb();
      state.view = 'overview';
      closeLayer();
      applyTheme();
      render({ top: true });
      return;
    case 'do-restore': {
      var pv = state.pendingRestore;
      if (!pv || pv.errors.length) return;
      state.data = normalizeImport(pv.data);
      state.draft = null;
      state.pendingRestore = null;
      state.view = 'overview';
      saveData();
      closeLayer();
      render({ top: true });
      showToast('已恢复 ' + state.data.exams.length + ' 场考试');
      return;
    }
    /* 引导 */
    case 'ob-grade':
      state.ob.grade = v;
      state.ob.unsorted = (v === '高一');
      render({ top: true });
      return;
    case 'ob-prov': {
      var oldT = provinceOf(state.ob.province).total;
      state.ob.province = v;
      resetComboDefaults(state.ob, oldT);
      render({ top: true });
      return;
    }
    case 'ob-unsorted':
      state.ob.unsorted = !state.ob.unsorted;
      render({ top: false, keepScroll: true });
      return;
    case 'ob-first':
      state.ob.first = v;
      render({ keepScroll: true });
      return;
    case 'ob-second': {
      var ob = state.ob;
      var k = ob.second.indexOf(v);
      if (k >= 0) ob.second.splice(k, 1);
      else {
        if (ob.second.length >= 2) ob.second.shift();
        ob.second.push(v);
      }
      render({ keepScroll: true });
      return;
    }
    case 'ob-elect': {
      var ob2 = state.ob;
      var q = ob2.elect.indexOf(v);
      if (q >= 0) ob2.elect.splice(q, 1);
      else {
        if (ob2.elect.length >= 3) ob2.elect.shift();
        ob2.elect.push(v);
      }
      render({ keepScroll: true });
      return;
    }
    case 'ob-track':
      state.ob.track = v;
      render({ keepScroll: true });
      return;
    case 'ob-target-preset': {
      var p2 = provinceOf(state.ob.province);
      state.ob.target = Math.round(p2.total * Number(v) / 100);
      render({ keepScroll: true });
      updateObTargetUI();
      return;
    }
    case 'ob-next': {
      if (state.ob.step < 4) {
        if (state.ob.step === 2 && !PROVINCES[state.ob.province]) return;
        if (state.ob.step === 3 && !obCombo(state.ob)) { showToast('请先完成选科'); return; }
        state.ob.step++;
        render({ top: true });
        return;
      }
      finishOnboarding();
      return;
    }
    case 'ob-back':
      if (state.ob.step > 1) state.ob.step--;
      render({ top: true });
      return;
    default:
      return;
  }
}

function onDocInput(e) {
  var el = e.target;
  if (!el || !el.getAttribute) return;
  var f = el.getAttribute('data-f');
  if (f && state.draft) {
    if (f.indexOf('raw|') === 0 || f.indexOf('graded|') === 0) {
      var parts = f.split('|');
      var name = parts[1];
      if (!state.draft.scores[name]) state.draft.scores[name] = { raw: '', graded: '' };
      state.draft.scores[name][parts[0]] = el.value;
      var sub = state.draft.subjects.filter(function (s) { return s.name === name; })[0];
      var bad = false;
      if (el.value !== '' && sub) {
        var n = Number(el.value);
        bad = !isFinite(n) || n < 0 || n > sub.full;
      }
      el.classList.toggle('invalid', bad);
      var live = document.getElementById('live-sum');
      if (live) live.innerHTML = draftLiveSummary(state.draft, state.data.target.rate);
      return;
    }
    if (f === 'name') {
      state.draft.name = el.value;
      state.draft.nameAuto = (el.value === fmtDateCN(state.draft.date) + ' ' + state.draft.type);
      return;
    }
    if (f === 'date') {
      state.draft.date = el.value;
      if (state.draft.nameAuto) {
        state.draft.name = fmtDateCN(el.value) + ' ' + state.draft.type;
        var ni = document.querySelector('[data-f="name"]');
        if (ni) ni.value = state.draft.name;
      }
      return;
    }
    if (f === 'note') { state.draft.note = el.value; return; }
    if (f === 'cls') { state.draft.cls = el.value; return; }
    if (f === 'clsSize') { state.draft.clsSize = el.value; return; }
    if (f === 'grd') { state.draft.grd = el.value; return; }
    if (f === 'grdSize') { state.draft.grdSize = el.value; return; }
  }

  var obf = el.getAttribute('data-ob');
  if (obf && state.ob) {
    if (obf === 'target') {
      state.ob.target = Number(el.value);
      updateObTargetUI();
      return;
    }
    if (obf === 'classSize') { state.ob.classSize = el.value; return; }
    if (obf === 'gradeSize') { state.ob.gradeSize = el.value; return; }
  }
}

function onDocChange(e) {
  var el = e.target;
  if (!el || !el.getAttribute) return;
  if (el.getAttribute('data-ob') === 'target') {
    var p = provinceOf(state.ob.province);
    var n = Math.round(Number(el.value));
    if (!isFinite(n) || n < 1 || n > p.total) {
      showToast('目标总分应在 1–' + p.total + ' 之间');
      el.value = state.ob.target;
      return;
    }
    state.ob.target = n;
    updateObTargetUI();
    return;
  }
  if (el.getAttribute('data-ob') === 'classSize') {
    state.ob.classSize = Math.max(1, Math.round(Number(el.value) || 45));
    el.value = state.ob.classSize;
    return;
  }
  if (el.getAttribute('data-ob') === 'gradeSize') {
    state.ob.gradeSize = Math.max(1, Math.round(Number(el.value) || 720));
    el.value = state.ob.gradeSize;
    return;
  }

  if (el.getAttribute('data-f')) {
    var f = el.getAttribute('data-f');
    if (f === 'date' && state.draft && !dateParts(state.draft.date)) {
      showToast('日期无效');
      el.value = todayStr();
      state.draft.date = todayStr();
      return;
    }
    if ((f === 'clsSize' || f === 'grdSize') && state.draft) {
      var val = Math.round(Number(el.value));
      if (!isFinite(val) || val < 1) {
        showToast('人数应大于 0');
        el.value = f === 'clsSize' ? state.data.profile.classSize : state.data.profile.gradeSize;
        state.draft[f] = String(el.value);
      }
    }
    return;
  }

  var set = el.getAttribute('data-set');
  if (set) {
    var p2 = provinceOf(state.data.profile.province);
    if (set === 'classSize' || set === 'gradeSize') {
      var n2 = Math.round(Number(el.value));
      var min = 1, max = set === 'classSize' ? 200 : 3000;
      if (!isFinite(n2) || n2 < min || n2 > max) { showToast('人数应在 ' + min + '–' + max + ' 之间'); el.value = state.data.profile[set]; return; }
      state.data.profile[set] = n2;
      saveData();
      showToast('默认人数已更新，只影响新记录');
      return;
    }
    if (set === 'target') {
      var t = Math.round(Number(el.value));
      if (!isFinite(t) || t < 1 || t > p2.total) { showToast('目标总分应在 1–' + p2.total + ' 之间'); el.value = state.data.target.total; return; }
      state.data.target.total = t;
      recalcTarget(state.data);
      saveData();
      render({ keepScroll: true });
      showToast('目标已更新为 ' + state.data.target.total + ' 分');
      return;
    }
  }
}

function onDocKey(e) {
  if (e.key === 'Escape' && state.layer) closeLayer();
}

/* ---------- 启动 ---------- */
function boot() {
  storageTest();
  state.data = loadData();
  if (state.data) {
    state.subject = null;
    state.analysis.grade = 'current';
    state.analysis.type = 'all';
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('action') === 'record') {
        state.view = 'records';
        state.draft = newDraft();
      } else if (q.get('action') === 'analysis') {
        state.view = 'analysis';
      }
    } catch (e) {}
  } else {
    state.ob = defaultOb();
  }
  var fi = document.createElement('input');
  fi.type = 'file';
  fi.id = 'restore-file';
  fi.accept = '.json,application/json';
  fi.style.display = 'none';
  fi.addEventListener('change', function () {
    var file = fi.files && fi.files[0];
    fi.value = '';
    if (file) readBackupFile(file);
  });
  document.body.appendChild(fi);

  document.getElementById('layer').addEventListener('click', function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-overlay') === '1') closeLayer();
  });
  document.addEventListener('click', onDocClick);
  document.addEventListener('input', onDocInput);
  document.addEventListener('change', onDocChange);
  document.addEventListener('keydown', onDocKey);
  window.addEventListener('resize', debounce(function () {
    if (state.data && (state.view === 'overview' || state.view === 'analysis')) drawAllCharts();
  }, 240));

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    state.installPrompt = e;
    if (state.data && state.view === 'settings') render({ keepScroll: true });
  });
  window.addEventListener('appinstalled', function () {
    state.installPrompt = null;
    showToast('已安装到桌面');
    if (state.data && state.view === 'settings') render({ keepScroll: true });
  });

  registerServiceWorker();
  render({ top: true });
}

function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  var host = location.hostname;
  var ok = location.protocol === 'https:' || host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
  if (!ok) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (w) w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) showToast('新版本已缓存，下次打开生效');
        });
      });
    }).catch(function () {});
  });
}

boot();

</script>
